<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="kit/tokens.css" />
    <script src="kit/gsap.min.js"></script>
    <script src="kit/dither.js"></script>
    <script type="module" src="kit/gemsmoke.js"></script>
    <style>
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .fill { position: absolute; inset: 0; background: var(--ink); }
      .q { position: absolute; width: 960px; height: 540px; overflow: hidden; }
      .q > div, .q > canvas { position: absolute; inset: 0; width: 960px; height: 540px; display: block; }
      #q1 { left: 0; top: 0; } #q2 { left: 960px; top: 0; } #q3 { left: 0; top: 540px; } #q4 { left: 960px; top: 540px; }
      .lab { position: absolute; left: 24px; bottom: 18px; color: #f2f2f0; font: 500 24px/1 var(--font); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1920" data-height="1080">
      <div class="fill"></div>
      <section id="scene" class="clip" data-start="0" data-duration="3" data-track-index="1" data-layout-allow-overflow>
        <div class="q" id="q1"><div id="g1"></div><span class="lab">blue</span></div>
        <div class="q" id="q2"><div id="g2"></div><span class="lab">fire</span></div>
        <div class="q" id="q3"><div id="g3"></div><span class="lab">blue, GT mark shape</span></div>
        <div class="q" id="q4"><div id="g4" style="visibility:hidden"></div><canvas id="d4" width="960" height="540"></canvas><span class="lab">fire, dithered</span></div>
      </section>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const gems = {};
      const grid = GTDither.grid(document.getElementById('d4'), 3, { width: 960, height: 540 });
      function draw(t) {
        if (gems.a) gems.a.at(t);
        if (gems.b) gems.b.at(t);
        if (gems.c) gems.c.at(t);
        if (gems.d) { gems.d.at(t); gems.d.dither(grid, { tones: ['#000000', '#7a2a08', '#fe5b16'] }); }
      }
      const proxy = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(proxy, { t: 3, duration: 3, ease: 'none', onUpdate: () => draw(proxy.t) }, 0);
      window.__timelines['main'] = tl;
      function boot() {
        Promise.all([
          GTGem.mount(document.getElementById('g1'), { palette: 'blue', width: 960, height: 540, offset: 4 }),
          GTGem.mount(document.getElementById('g2'), { palette: 'fire', width: 960, height: 540, offset: 6 }),
          GTGem.mount(document.getElementById('g3'), { palette: 'blue', width: 960, height: 540, image: 'kit/gem-shapes/gt-mark.png', params: { scale: 0.8 } }),
          GTGem.mount(document.getElementById('g4'), { palette: 'fire', width: 960, height: 540, offset: 6, pixelRatio: 0.5 }),
        ]).then(([a, b, c, d]) => { Object.assign(gems, { a, b, c, d }); draw(proxy.t); });
      }
      if (window.GTGem) boot(); else window.addEventListener('gtgem-ready', boot, { once: true });
    </script>
  </body>
</html>
