    <script>
      /*
       * Ben-Yehuda, Pines, and the vocabulary of Modern Hebrew. v2 (SCRIPT-v2.md): 69.6 s, twelve
       * pictures, every time read from data/cues.js (sound/tools/mix.py, from the takes).
       * The film is set on the pages of the first volume of Ben-Yehuda's
       * dictionary (Jerusalem and Berlin, 1908). Every frame is drawn by
       * render(t) in lib/film.js from the beat states in lib/beats.js, a pure
       * function of film time. One paused timeline, built synchronously and
       * registered at once; its onUpdate draws the frame.
       */
      const film = window.MHFilm.mount(document.getElementById('film'));
      const clock = { t: 0 };
      const tl = gsap.timeline({ paused: true, onUpdate: () => film.render(tl.time()) });
      tl.to(clock, { t: film.DUR, duration: film.DUR, ease: 'none' }, 0);
      film.render(0);
      window.__timelines['main'] = tl;
      // The renderer's seek to 0 does not move the timeline, so onUpdate never
      // fires for frame 0. Redraw the current time when each picture and the
      // fonts are ready (the renderer waits for both); render(t) stays pure.
      const redraw = () => film.render(tl.time());
      document.querySelectorAll('#film img').forEach((i) => {
        if (!i.complete) i.addEventListener('load', redraw);
      });
      if (document.fonts) document.fonts.ready.then(redraw);
    </script>
