    <style>
      html, body { width: 1920px; height: 1080px; overflow: hidden; margin: 0; background: #071124; }

      canvas.full { image-rendering: pixelated; }
      .gemhost { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #gemA { visibility: hidden; }
      /* The headings (v4): one size, one grid. Ink from x 160, first baseline y 252, second y 402. */
      .hd {
        position: absolute;
        left: 160px;
        top: 125px;
        margin: 0;
        color: #ffffff;
        font-family: var(--font);
        font-size: 144px;

        letter-spacing: -0.035em;
        line-height: 1.04;

        /* Always on its own layer, so a heading's text is not re-rasterized on the first frame it moves. */
        will-change: transform, opacity;

  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="53.5" data-width="1920" data-height="1080">

      <div id="sS" class="clip full" data-start="0" data-duration="49.5" data-track-index="1" data-layout-allow-overflow>

      <!-- The shared series end card (kit/endcard), added by the timeline at B.card: silent, the music resolves under it. -->

      <!-- Sound: the narrator's masters and the bed, built by audio/make-bed.py and audio/mix.py (peak control lives there); mix.py rewrites these attributes from the cue table O. -->
      <hf-audio-group id="voiceover" data-label="Narrator (Frederick Surrey)" data-volume="1"></hf-audio-group>
      <audio id="vo-1" src="audio/vo-1.master.wav" data-audio-group="voiceover" data-start="0.92" data-duration="2.926" data-track-index="10"></audio>
      <audio id="vo-2" src="audio/vo-2.master.wav" data-audio-group="voiceover" data-start="3.88" data-duration="2.84" data-track-index="11"></audio>
      <audio id="vo-3" src="audio/vo-3.master.wav" data-audio-group="voiceover" data-start="7.645" data-duration="4.795" data-track-index="12"></audio>
      <audio id="vo-4" src="audio/vo-4.master.wav" data-audio-group="voiceover" data-start="13.96" data-duration="3.7" data-track-index="13"></audio>

    <script>
      (function () {
        'use strict';
        const { W, H, CELL, COLS, ROWS, C, K, TH, clamp, clamp01, smooth, lin, ease, prog } = F;
        const lerp = (a, b, x) => a + (b - a) * x;
        const s01 = (x) => smooth(0, 1, x);

        /* ---------------- the cue table (from the takes' word timings) ---------------- */
        // O[n]: the film time of line n's first word (Frederick Surrey, kit/audio/voice.json, speed 1.0, the v3 takes as
        // recorded). audio/mix.py places each master so its first word lands here. Word times below are scribe_v1 word
        // starts from each take's first word (audio/vo-N.stt.json); nothing is cut inside a line and nothing is
        // stretched. v4 fix round (NOTES.md, 2026-10-06): the gaps between lines (last word's end to the next first word)
        // are 0.80, 1.30, 1.90, 1.30, 2.16, 2.25, 2.24, 1.50 and 1.31 s, so every set piece finishes and holds before the
        // next and the steps of each bridge run one after another; the gap before line 10 puts the card on the first 0.5 s
        // beat after the last word plus 0.6 s, with heading 5's floor inside it.
        const O = [0, 1.0, 3.98, 7.72, 14.04, 18.66, 24.94, 31.33, 36.29, 40.65, 44.7];
        const WD = {
          agents: O[1] + 1.74,
          humans: O[2],
          still: O[2] + 0.44,
          read2: O[2] + 0.68,
          docs2: O[2] + 0.94,
          evaluate: O[2] + 1.34,
          product: O[2] + 1.96,
          general: O[3],
          translation: O[3] + 0.3,
          redesigned: O[3] + 1.04,
          its3: O[3] + 1.54,
          docs3: O[3] + 1.74,
          people: O[3] + 3.08,
          read3: O[3] + 3.58,
          writing3: O[3] + 3.98,
          cluttered: O[4] + 1.38,
          creates: O[4] + 2.32,
          mental: O[4] + 2.66,
          clutter: O[4] + 2.98,
          redesign: O[5] + 0.14,
          deleting: O[5] + 1.3,
          lines: O[5] + 2.16,
          links: O[5] + 2.84,
          buttons: O[5] + 3.62,
          sidebar: O[6] + 0.14,
          one: O[6] + 1.24,
          accordion: O[6] + 1.4,
          rare: O[6] + 2.98,
          sites: O[6] + 3.78,
          writing: O[7] + 0.12,
          it: O[7] + 2.58,
          translated: O[8],
          pages8: O[8] + 0.58,
          same: O[8] + 1.38,
          spacing: O[8] + 1.8,
          and8: O[8] + 2.2,
          each: O[9],
          action: O[9] + 1.9,
          docs: O[10],
          design10: O[10] + 0.28,
          is10: O[10] + 0.84,
          an10: O[10] + 0.94,
          open10: O[10] + 1.14,
          problem10: O[10] + 1.46,
          team: O[10] + 2.48,
          last: O[10] + 3.72,
        };
        // The scene clock (DESIGN-v4.md, section 2, retimed by the fix round). rise: the camera's start on "product"; iso:
        // the iso view; recent: the re-centre once heading 2 has left; flat0: the flatten; land: the landing (0.24 s
        // before "cluttered", settled on it); pile: the pile's first wave; red: the redline on "redesign"; push: the push
        // into the sidebar; diag: the push lands and the first connector starts; back6: the pull back (on "rare"); wall:
        // the wall lands; fly: the fly-in; write: the camera lands on the writing; out: the pull-out; planet: the page
        // over the planet, which lights from here; step: the script step on "same"; guides: the guides on "and
        // alignment"; tobox: into the page box; path: the reader's path; back: the shrink back on "Docs"; card: the end
        // card (the first 0.5 s beat after the last word plus 0.6 s). mix.py and make-bed.py read these numbers.
        const B = { rise: 5.94, iso: 7.4, recent: 12.88, flat0: 13.58, land: 15.18, pile: 16.2, red: 18.8, push: 23.68, diag: 24.68, back6: 27.88, wall: 29.68, fly: 30.73, write: 32.73, out: 35.19, planet: 36.19, step: 37.67, guides: 38.49, tobox: 39.89, path: 40.69, back: 44.7, card: 49.5, end: 53.5 };
        // The headings (section 3): each word enters on its own word start (0.30 s, 12 px rise, power2.out); each
        // heading holds (words / 3) + 1 s after its last word has arrived, and leaves whole (0.45 s, 8 px up,
        // power2.inOut) in a pause or its own sentence's tail. Heading 1 leaves by the moving type into heading 2's
        // first line; heading 5 leaves on the card's cut.
        const MT = { t0: 7.55, d: 0.8, swap: 0.05, y0: 117, rows: 70 };
        const HW = {
          h1: [[WD.humans, WD.still, WD.read2, WD.docs2]],
          h2: [[null, null], [WD.redesigned, WD.its3, WD.docs3]],
          h3: [[WD.one, WD.accordion]],
          h4: [[WD.translated, WD.pages8]],
          h5: [[WD.docs, WD.design10, WD.is10], [WD.an10, WD.open10, WD.problem10]],
        };
        const HX = { h2: 12.43, h3: 30.28, h4: 39.89 };
        const HEADS = ['h1', 'h2', 'h3', 'h4', 'h5'];

        /* ---------------- shared ---------------- */
        const $ = (id) => document.getElementById(id);
        const show = (el, on) => {
          const v = on ? '' : 'none';
          if (el.style.display !== v) el.style.display = v;
        };
        const gems = {};
        const sample = document.createElement('canvas');
        sample.width = COLS;
        sample.height = ROWS;
        const sctx = sample.getContext('2d', { willReadFrequently: true });
        function gemCells(gem) {
          sctx.imageSmoothingEnabled = true;
          sctx.imageSmoothingQuality = 'high';
          sctx.clearRect(0, 0, COLS, ROWS);
          sctx.drawImage(gem.canvas, 0, 0, COLS, ROWS);
          return sctx.getImageData(0, 0, COLS, ROWS).data;
        }
        const lum = (d, i) => (0.2126 * d[i * 4] + 0.7152 * d[i * 4 + 1] + 0.0722 * d[i * 4 + 2]) / 255;
        const keyOf = (c) => (c === C.navy ? 'navy' : c === C.blue ? 'blue' : c === C.lift ? 'lift' : 'white');
        /*
         * A fill or stroke at one tone on the film's screen: a 24 px pattern at the frame's origin holding the 8 by 8
         * Bayer tile of 3 px cells, lit where the tone is over a cell's threshold, so an SVG piece at tone v lights
         * exactly the cells Cells.rect lights at v. Only valid on elements drawn in screen space (no transform).
         */
        function tonePat(svg, color, v) {
          const level = clamp(Math.round(v * 64), 0, 64);
          if (level <= 0) return 'none';
          if (level >= 64) return color;
          const id = `${svg.id}-tp-${keyOf(color)}-${level}`;
          if (!svg.__pats) {
            svg.__pats = {};
            svg.__defs = F.el(svg, 'defs', {});
          }
          if (!svg.__pats[id]) {
            const p = F.el(svg.__defs, 'pattern', { id, x: 0, y: 0, width: 24, height: 24, patternUnits: 'userSpaceOnUse' });
            for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) if (F.B8[y * 8 + x] < level) F.el(p, 'rect', { x: x * 3, y: y * 3, width: 3, height: 3, fill: color, 'shape-rendering': 'crispEdges' });
            svg.__pats[id] = true;
          }
          return `url(#${id})`;
        }
        const rgb = (a, b, s) => 'rgb(' + GTDither.mixColor(a, b, clamp01(s)).join(',') + ')';

        /* ---------------- the gem smoke: one mount, two settings ---------------- */
        const FIELD = {
          params: { colorBack: '#000000', colors: ['#ffffff'], colorInner: '#00000000', scale: 1.8, size: 0.55, angle: 35, outerGlow: 0.8, innerGlow: 1, innerDistortion: 0.8, outerDistortion: 0.6, offset: 0, shape: 'metaballs', fit: 'contain', offsetX: 0, offsetY: 0, rotation: 240 },
          // The clock: gem time 9.2 + 0.12 s a second (the v3 build's, NOTES.md); the v4 lit shares are in NOTES.md.
          g0: 9.2,
          rate: 0.12,
          gamma: 1.45,
          cap: 0.88,
          floor: [0.045, 0.075],
        };
        const GEM7 = {
          params: { colorBack: '#2f5ce0', colors: ['#ffffff', '#86a8ff'], colorInner: '#00000000', scale: 1.5, size: 0.8, angle: 0, outerGlow: 0.55, innerGlow: 1, innerDistortion: 0.8, outerDistortion: 0.6, offset: 0, shape: 'metaballs', fit: 'contain', offsetX: 0.2, offsetY: -0.2, rotation: 0 },
          t0: 19.0,
          rate: 0.45,
          lead: 3.45, // the smoke's phase when the writing starts printing is round 7d's
        };
        let gemMode = '';
        function gemFor(mode) {
          const g = gems.a;
          if (!g) return null;
          if (gemMode !== mode) {
            g.set(mode === 'field' ? FIELD.params : GEM7.params);
            gemMode = mode;
          }
          return g;
        }

        /* ---------------- the page geometry ---------------- */
        const PB = { x: 561, y: 456 }; // the page box: x 561 to 1853, y 456 to the foot
        const PS = 0.897;
        const at = F.place(PS, PB.x, PB.y);
        const X = (u) => Math.round((PB.x + u * PS) / CELL) * CELL;
        const Y = (v) => Math.round((PB.y + v * PS) / CELL) * CELL;
        // yr: the contents rail's plate foot (page y 268), below its six rows.
        const PG = { x0: 561, xs: X(294), xr: X(1140), x3: 1853, y0: 456, yh: Y(60), yr: Y(268), y3: 456 + 807 };
        const PC = [(PG.x0 + PG.x3) / 2, (PG.y0 + PG.y3) / 2];
        const PAGE = F.page().map(at); // the clean page, frame px
        const isOld = (e) => e.ctl !== 'search' && e.ctl !== 'star';
        const rectOf = (r) => at({ x: r[0], y: r[1], w: r[2], h: r[3] });
        const EXTRAS = F.extras().map((x) => Object.assign({}, x, { R: rectOf(x.r), parts: x.parts.map((p) => Object.assign(at(p), { toR: p.to ? rectOf(p.to) : null })) }));
        // The opening and closing page's rect: x 160 to 1056, y 470 to 1030 (the page box page at 0.694 about its centre).
        const OPEN = { k: 896 / 1292, c: [608, 750] };

        /* ---------------- the one flat camera (lines 4 to 10) ---------------- */
        /*
         * Scale k about the page box's centre PC, then centre c: a page point p sits at c + k (p - PC). Every move is a
         * zoom about the fixed point of its two end cameras, on power2.inOut (zero speed at both ends), so scale changes in
         * log space and position follows on the same progress.
         */
        const CAMS = {
          box: { k: 1, c: PC },
          // The push: the page's own sidebar becomes the diagram's accordion, x 1200 to 1543, switcher at y 250, so the
          // first group's heading (and the tab bar's connector) sits at y 344, below heading 3's band (fix round: was k 1.4
          // with the switcher at y 110 and the connector at y 211).
          push: { k: 1.3, c: [1200 - 1.3 * (PG.x0 - PC[0]), 250 - 1.3 * (PB.y + 86 * PS - PC[1])] },
          // General Translation's slot in the wall: column 4, row 2 (x 976 to 1216, y 522 to 672).
          slot: { k: 240 / 1292, c: [976 + 120, 522 + 75] },
          // The writing view: the content column (page x 332 to 1108) spans x 420 to 1520, the title at y 300.
          write: (() => {
            const xl = PB.x + 332 * PS, xr = PB.x + 1108 * PS, k = 1100 / (xr - xl);
            return { k, c: [420 - k * (xl - PC[0]), 300 - k * (PB.y + 80 * PS - PC[1])] };
          })(),
          // The page over the planet: x 1036 to 1760, y 340 to 792.
          small: { k: 0.56, c: [1036 + 0.56 * 646, 340 + 0.56 * 403.5] },
          open: OPEN,
        };
        // The three long zooms (the pull back, the fly-in and the pull-out) run on the trapezoid ease, so their top speed is
        // 1.43 times their mean; the short moves keep power2.inOut.
        const MOVES = [
          [B.push, B.diag, 'box', 'push', ease.p2io],
          [B.back6, B.wall, 'push', 'slot', ease.trap],
          [B.fly, B.write, 'slot', 'write', ease.trap],
          [B.out, B.planet, 'write', 'small', ease.trap],
          [B.tobox, B.path, 'small', 'box', ease.p2io],
          [B.back, B.back + 0.9, 'box', 'open', ease.p2io],
        ];
        function zoomCam(A, Z, a) {
          const r = Z.k / A.k;
          if (Math.abs(r - 1) < 1e-6) return { k: A.k, c: [lerp(A.c[0], Z.c[0], a), lerp(A.c[1], Z.c[1], a)] };
          const f0 = (Z.c[0] - r * A.c[0]) / (1 - r), f1 = (Z.c[1] - r * A.c[1]) / (1 - r);
          const m = Math.pow(r, a);
          return { k: A.k * m, c: [f0 + m * (A.c[0] - f0), f1 + m * (A.c[1] - f1)] };
        }
        function camF(t) {
          let cur = 'box';
          for (const [t0, t1, a, b, ez] of MOVES) {
            if (t < t0) return { k: CAMS[cur].k, c: CAMS[cur].c, snap: cur === 'box', at: cur, a: 0 };
            if (t < t1) {
              const u = ez((t - t0) / (t1 - t0));
              return Object.assign(zoomCam(CAMS[a], CAMS[b], u), { snap: false, from: a, to: b, a: u });
            }
            cur = b;
          }
          return { k: CAMS[cur].k, c: CAMS[cur].c, snap: false, at: cur, a: 1 };
        }
        const camPt = (cam, p) => [cam.c[0] + cam.k * (p[0] - PC[0]), cam.c[1] + cam.k * (p[1] - PC[1])];
        const pageRect = (cam) => [cam.c[0] + cam.k * (PG.x0 - PC[0]), cam.c[1] + cam.k * (PG.y0 - PC[1]), cam.c[0] + cam.k * (PG.x3 - PC[0]), cam.c[1] + cam.k * (PG.y3 - PC[1])];
        // Below about 0.4 px a page unit the page hands over by tone to its miniature, and back.
        const detail = (k) => smooth(0.35, 0.45, k * PS);

        /* ---------------- the background field ---------------- */
        const cf = new F.Cells($('cf'));
        const ENV = {};
        const envNow = new Float32Array(COLS * ROWS);
        function envBuild(items) {
          const e = new Float32Array(COLS * ROWS).fill(1);
          for (const it of items) {
            if (it.disc) {
              const [cx, cy, r, m] = it.disc;
              for (let y = 0, i = 0; y < ROWS; y++)
                for (let x = 0; x < COLS; x++, i++) {
                  const d = Math.hypot(x * CELL + 1.5 - cx, y * CELL + 1.5 - cy) - r;
                  e[i] *= m > 0 ? smooth(0, m, d) : d > 0 ? 1 : 0;
                }
              continue;
            }
            rectCalm(e, it.r, it.m0 || 0, it.m1 || 0, 1);
          }

        // to 681) once the camera lands.
        const outPA = F.el(vW, 'path', { d: '', fill: 'none', stroke: C.white, 'stroke-width': 3, 'stroke-linecap': 'square', 'shape-rendering': 'crispEdges' });
        const outPB = F.el(vW, 'path', { d: '', fill: 'none', stroke: C.white, 'stroke-width': 3, 'stroke-linecap': 'square', 'shape-rendering': 'crispEdges' });
        const OUTL = { t0: B.wall - 0.4, d: 0.4, back0: B.fly, backD: 0.35 };

        // lands; the writing's hairlines then draw out of them.
        const GLIDE_END = B.write;
        function drawWall(t, cam) {
          const on = t >= B.back6 && t < B.write + 0.1;
          show(cw, on);
          show(vW, on);
          if (!on) return;
          const ctx = cwx;
          ctx.clearRect(0, 0, W, H);
          const s = cam.k / CAMS.slot.k;
          const vp = detail(cam.k);
          const moving = t < B.wall + 0.5 ? 1 - smooth(B.wall - 0.45, B.wall, t) : smooth(B.fly, B.fly + 0.35, t);

            // While heading 3 is up, a page coming in over its ground waits (tone 0) until it is clear of the heading's
            // keep-out (28 px round its ink), then rises by tone over the next 24 px of its travel.
            if (!p.gt && t < HX.h3 + 0.45) {

          // The panel: its hairline frame draws out of its top-left cross (PANEL.t0, 0.6 s, expo.out), its right edge down out
          // of the top-right corner, the bottom along out of the bottom-left; the corner crosses land as the lines reach
          // them. On the fly-in the hairlines run back into their crosses and three crosses glide to the writing view's.
          const e = ease.expoOut(prog(t, PANEL.t0, 0.6));
          const eR = ease.expoOut(prog(t, PANEL.t0 + 0.25, 0.35));

            const outA = F.poly([[x0, y0], [x1, y0], [x1, y1]]), outB = F.poly([[x0, y0], [x0, y1], [x1, y1]]);

        }

        /* ---------------- line 7: the writing ---------------- */
        // The writing view at the writing camera: eleven lines from x 420 (title at y 300, lowest line ending by y 880)
        // in page coordinates, so they move with the camera; a rail at x 360 (the doubled line, gauge 9, core 3) that
        // draws down out of the hairline at y 250; hairlines x 300 down and y 250 across with crosses at their ends.
        const W7 = { x0: 420, x1: 1520, y0: 300, yEnd: 882, rail: 360.5, hx: 300, hy: 250, hx1: 1620 };
        const LINES7 = [
          [300, 534, 54],
          [387, 1048, 21], [429, 671, 21],
          [531, 1087, 18], [570, 1042, 18], [612, 1100, 18], [654, 501, 18],
          [714, 345, 33],
          [783, 1068, 18], [822, 1003, 18], [864, 762, 18],
        ];
        // Each line in page px (the inverse of the writing camera), so the camera carries it.

          const k = CAMS.write.k, c = CAMS.write.c;
          return [PC[0] + (W7.x0 - c[0]) / k, PC[1] + (y - c[1]) / k, w / k, h / k];
        });
        const c7 = new F.Cells($('c7'));
        const v7 = $('v7');
        const hV = F.el(v7, 'line', { x1: W7.hx + 0.5, y1: W7.hy + 0.5, x2: W7.hx + 0.5, y2: W7.hy + 0.5, stroke: C.blue, 'stroke-width': 1, 'shape-rendering': 'crispEdges' });
        const hA = F.el(v7, 'line', { x1: W7.hx + 0.5, y1: W7.hy + 0.5, x2: W7.hx + 0.5, y2: W7.hy + 0.5, stroke: C.blue, 'stroke-width': 1, 'shape-rendering': 'crispEdges' });
        const x7 = [[W7.hx, W7.hy], [W7.hx1, W7.hy], [W7.hx, 1013]].map(([x, y]) => F.cross(v7, x, y, C.lift));
        const rule7 = F.el(v7, 'line', { x1: W7.x0, y1: 498.5, x2: W7.x0, y2: 498.5, stroke: C.blue, 'stroke-width': 1, 'shape-rendering': 'crispEdges' });
        const rail7 = F.doubled(v7, C.blue, C.navy, 9, 3);
        const thumb7 = F.doubled(v7, C.white, C.navy, 9, 3);
        // Fix round, one step after another once the camera has landed (B.write): the furniture tones out while the
        // writing's hairlines draw out of the crosses and its rail draws down (0.6 s); then the eleven lines print from
        // their own smoke in reading order (0.3 s each, 60 ms apart, from B.write + 0.5), each taking over from the page's
        // own pieces in its row, and the white thumb runs down the rail with the print from the title to the section
        // heading (0.96 s, power2.inOut).
        const LINE7 = (i) => B.write + 0.5 + i * 0.06;
        const W7T = { h0: B.write, hD: 0.6, rail0: B.write + 0.05, railD: 0.6, rule0: LINE7(3) - 0.05, thumb0: LINE7(0), thumbD: 0.96, a: [303, 351], b: [708, 756] };
        function drawWriting(t, cam) {
          const on = t >= LINE7(0) - 0.1 && t < B.out + 0.45;
          show($('c7'), on);
          show(v7, t >= W7T.h0 && t < B.out + 0.45);
          const away = 1 - lin(B.out, B.out + 0.4, t);
          if (t >= W7T.h0 && t < B.out + 0.45) {
            const h = ease.expoOut(prog(t, W7T.h0, W7T.hD));
            hV.setAttribute('y2', (W7.hy + (H - W7.hy) * h + 0.5).toFixed(1));
            hA.setAttribute('x2', (W7.hx + (W7.hx1 - W7.hx) * h + 0.5).toFixed(1));
            [hV, hA].forEach((l) => l.setAttribute('stroke', tonePat(v7, C.blue, away)));
            x7.forEach((x) => x.setAttribute('stroke', tonePat(v7, C.lift, (t >= W7T.h0 ? 1 : 0) * away)));
            const r = ease.p3out(prog(t, W7T.rule0, 0.4));

            rule7.setAttribute('stroke', tonePat(v7, C.blue, away));

            rail7.set(rr > 0 ? `M${W7.rail} ${W7.hy + 12}L${W7.rail} ${(W7.hy + 12 + (H - W7.hy - 12) * rr).toFixed(1)}` : '');
            rail7.g.childNodes[0].setAttribute('stroke', tonePat(v7, C.blue, away));
            rail7.g.childNodes[1].setAttribute('stroke', tonePat(v7, C.navy, away));

            const ya = lerp(W7T.a[0], W7T.b[0], s), yb = lerp(W7T.a[1], W7T.b[1], s);

            thumb7.set(tv > 0 ? `M${W7.rail} ${ya.toFixed(2)}L${W7.rail} ${yb.toFixed(2)}` : '');
            thumb7.g.childNodes[0].setAttribute('stroke', tonePat(v7, C.white, tv));
            thumb7.g.childNodes[1].setAttribute('stroke', tonePat(v7, C.navy, tv));
          }

          const g = gemFor('s7');
          let d = null;
          if (g) {
            g.at(GEM7.t0 + (t - LINE7(0) - 0.06 - GEM7.lead) * GEM7.rate);
            d = gemCells(g);
          }
          LINE7P.forEach(([px, py, pw, ph], li) => {
            const pres = lin(LINE7(li), LINE7(li) + 0.3, t) * away;

            const x0 = clamp(Math.round(sx0 / CELL), 0, COLS), y0 = clamp(Math.round(sy0 / CELL), 0, ROWS);

        }

        /* ---------------- line 8: the glyph planet under the translated page ---------------- */
        // 30 px cells (fix round, was 21), so the glyphs are 20 to 26 px tall and the script step reads at phone size.
        const G1 = { cell: 30, cols: Math.ceil(W / 30), rows: Math.ceil(H / 30), turn0: 44 };
        const planet = F.globe({ cx: 960 / W, cy: 1520 / H, radius: 1010 / H, aspect: W / H, ambient: 0.14, rim: 0.16, spin: 0.14, tilt: 0.42 });

        {
          const rnd = GTDither.rng(1988);

          for (let y = 0; y < G1.rows; y++)
            for (let x = 0; x < G1.cols; x++) {
              const cx = (x + 0.5) * G1.cell, cy = (y + 0.5) * G1.cell;

        const ctx1 = c1.getContext('2d');

        function drawPlanet(t) {
          const on = t >= PL.rise0 && t < PL.set0 + 0.65;
          show(c1, on);

          const ctx = ctx1;
          ctx.clearRect(0, 0, W, H);

            const v = c.cy / H;

        // E5's three dashed guides on "and alignment": white, 2 px, 10 on and 8 off, across the page at its header row,

        const PATH3PTS = [P3(8, 110), P3(8, 353), P3(196, 353), P3(312, 237), P3(312, 95), P3(470, 95), P3(470, 406), P3(470, 490), P3(1375, 490), P3(1375, 32)];

        const dl3B = F.el(vE, 'path', { d: '', fill: 'none', stroke: C.navy, 'stroke-width': 3, 'stroke-linejoin': 'miter', 'stroke-miterlimit': 10, 'stroke-linecap': 'butt' });
        const pulse3 = F.el(vE, 'path', { d: '', fill: 'none', stroke: C.white, 'stroke-width': 3, 'stroke-linejoin': 'miter', 'stroke-linecap': 'butt' });
        const seats = seatIdx.map(() => {
          const g = F.el(vE, 'g', { style: 'display:none' });
          const a = F.el(g, 'rect', { width: 16, height: 16, fill: C.white, 'shape-rendering': 'crispEdges' });
          const b = F.el(g, 'rect', { width: 8, height: 8, fill: C.navy, 'shape-rendering': 'crispEdges' });

        });
        // One constant speed (ease none, because reading is a process), set so the path reaches the action on "action".
        const PATH3 = { t0: B.path, t1: WD.action };
        PATH3.speed = path3.total / (PATH3.t1 - PATH3.t0);
        const PULSE3 = { t0: WD.action + 0.3, d: 0.8, len: 160 };
        function drawPath(t, cam) {
          const on = t >= PATH3.t0 && t < B.card;
          show(vE, on);
          if (!on) return;
          const map = (p) => camPt(cam, p);

          const d = mp.sub(L);

          seats.forEach((s, i) => {
            const vis = L >= seatL[i] * cam.k - 0.01;
            s.g.style.display = vis ? '' : 'none';
            if (vis) {
              const [x, y] = map(PATH3PTS[seatIdx[i]]);
              s.a.setAttribute('x', Math.round(x - 8)), s.a.setAttribute('y', Math.round(y - 8));
              s.b.setAttribute('x', Math.round(x - 8) + 4), s.b.setAttribute('y', Math.round(y - 8) + 4);
            }

        }

        /* ---------------- the page's styles after the writing (lines 8 to 10) ---------------- */
        function mutedStyle(t, cam) {
          // The furniture, the page's text and the ground tone back in over the pull-out's first 0.4 s; on "same" the text
          // bars mix to #86a8ff in place (0.6 s) and back as the page moves into the page box; on "action" Get a Demo
          // mixes to white.
          const inn = smooth(B.out, B.out + 0.4, t);
          const textMix = s01(prog(t, STEP.t0, STEP.d)) * (1 - s01(prog(t, B.tobox, 0.6)));
          const act = s01(prog(t, WD.action, 0.3));
          return cleanStyle(inn, { textMix, action: act, frame: (id) => (id === 'bottom' && cam.k > 0.9 ? null : { tone: inn }) });
        }
        function drawPage(t, cam) {
          // Hidden while only the writing is up: from the last content piece's hand-over to the pull-out.
          const on = t >= B.land && !(t >= LINE7(LINES7.length - 1) + 0.35 && t < B.out);
          show(vP, on);
          if (!on) return;
          const style = t < B.push ? pileStyle(t) : t < B.out ? litStyle(t, cam) : mutedStyle(t, cam);
          pageV.draw(cam, style);
          const bt = boxTone(cam);
          pbX.forEach((x) => {
            x.style.display = bt > 0 ? '' : 'none';
            if (bt > 0) x.setAttribute('stroke', tonePat(vP, C.lift, bt));
          });
        }

        /* ---------------- the readers (lines 1, 2 and 10) ---------------- */
        /*
         * 28 nodes in 4 columns (x 1500 to 1710, 70 px apart) and 7 rows (threads at y 505 to 985, 80 px apart): 24 agents
         * (Heroicons cpu-chip) and 4 humans (Heroicons user), 44 px icons on 52 px navy plates. Seven row threads leave
         * the page's right edge (x 1056) at their rows' heights; each node hangs on a 20 px 45 degree stub below its
         * thread. Doubled lines on 17 px navy casings, so they carve their own channel through the smoke; every piece
         * enters and leaves by tone on the film's one grid.
         */
        const cgc = $('cg');
        const cg = cgc.getContext('2d');
        const RG = { x0: Math.round(camPt(OPEN, [PG.x3, 0])[0]), rows: [0, 1, 2, 3, 4, 5, 6].map((r) => 505 + 80 * r), cols: [1500, 1570, 1640, 1710], humans: [[0, 3], [2, 1], [4, 2], [6, 0]], stub: 20, off: 43, plate: 52, icon: 44 };
        const NODES = [];
        RG.rows.forEach((y, r) =>
          RG.cols.forEach((x, c) => {
            const human = RG.humans.some(([a, b]) => a === r && b === c);
            const bx = x - RG.off;
            const route = F.poly([[RG.x0, y + 0.5], [bx, y + 0.5], [bx + RG.stub, y + 0.5 + RG.stub]]);
            NODES.push({ r, c, human, x, y, bx, route, d: bx - RG.x0, cx: x, cy: y + RG.off });
          })
        );
        const ROWLEN = RG.cols[3] - RG.off + RG.stub * Math.SQRT2 - RG.x0; // a row's drawn length (to the last stub's end)
        // The draw-out at frame 0 and again in line 10: each row's thread out of the page's edge (expo.out, 30 ms apart,
        // top to bottom), the stubs as its continuation, each node's tone rising (0.2 s) as its stub arrives.
        const GRID = { open: { t0: 0, d: 0.6 }, close: { t0: B.back + 0.9, d: 0.42 } };
        const rowDraw = (t, r, D) => ROWLEN * ease.expoOut(prog(t, D.t0 + 0.03 * r, D.d));
        const nodeArrive = (n, D) => {
          const f = Math.min(0.999, (n.d + RG.stub * Math.SQRT2) / ROWLEN);
          return D.t0 + 0.03 * n.r + (D.d * -Math.log2(1 - f)) / 10;
        };
        // White agent pulses, 3 by 60 px at 450 px a second: one train per thread, each pulse to the row's next agent, a
        // second train on "agents"; from the page to the agents only.
        const PULSE = { v: 450, len: 60, t0: 0.8, t1: B.back + 1.5 };
        const rngP = GTDither.rng(9);
        const ROWA = RG.rows.map((y, r) => NODES.filter((n) => n.r === r && !n.human));
        const TRAIN = RG.rows.map(() => {
          const P = 1.62 + 0.3 * rngP();
          return { P, ph: rngP() * P };
        });
        function pulsesAt(t, t0, t2) {
          const out = [];
          RG.rows.forEach((y, r) => {
            const ag = ROWA[r];
            const { P, ph } = TRAIN[r];
            const trains = [[t0, ph, 0]];
            if (t >= t2) trains.push([t2, ph + P / 2, 2]);
            for (const [ts, off, shift] of trains) {
              if (t < ts) continue;
              const j0 = Math.floor((t - ts - off) / P);
              for (let j = j0; j >= j0 - 1; j--) {
                const te = ts + off + j * P;
                if (te < ts) continue;
                const n = ag[(((j + shift + r) % ag.length) + ag.length) % ag.length];
                const s = (t - te) * PULSE.v;
                if (s > 0 && s < n.route.total + PULSE.len) out.push({ n, a: Math.max(0, s - PULSE.len), b: Math.min(n.route.total, s) });
              }
            }
          });
          return out;
        }
        // The agents leave on "Humans" by tone from the node ends back toward the page (0.5 s, to 4.48).
        const XFAR = RG.cols[3] + RG.plate / 2;
        const agentsGone = (t, x) => (t < WD.humans || t >= GRID.close.t0 ? 1 : 1 - s01((t - (WD.humans + (0.25 * (XFAR - x)) / (XFAR - RG.x0))) / 0.25));
        // The reader's path continues in line 10: out of the lit action, out of the page's right edge, along row 1's
        // thread and into row 1's white human, at the path's own speed.
        const actionClose = camPt(OPEN, P3(1375, 32));
        const humanR1 = NODES.find((n) => n.r === 0 && n.human);
        const contY = RG.rows[0] + 0.5;
        const CONT = F.poly([actionClose, [actionClose[0] + (contY - actionClose[1]), contY], [humanR1.bx, contY], [humanR1.bx + RG.stub, contY + RG.stub]]);
        const CONT0 = B.back + 1.6;
        function drawGrid(t) {
          const opening = t < WD.product + 0.35;
          const closing = t >= GRID.close.t0;
          show(cgc, opening || closing);
          if (!opening && !closing) return;
          const ctx = cg;
          ctx.clearRect(0, 0, W, H);
          const D = opening ? GRID.open : GRID.close;
          const outP = opening ? 1 - lin(WD.product, WD.product + 0.3, t) : 1;
          const white = opening ? s01(prog(t, WD.evaluate, 0.3)) : s01(prog(t, WD.team, 0.3));
          const rowLen = (r) => rowDraw(t, r, D);
          const BOX = [RG.x0 - 12, RG.rows[0] - 14, XFAR + 4, RG.rows[6] + RG.off + RG.plate / 2 + 4];
          const pieces = [];
          RG.rows.forEach((y, r) => {
            const L = Math.min(rowLen(r), RG.cols[3] - RG.off - RG.x0);
            if (L > 0.5) pieces.push({ tone: outP, runs: [[[RG.x0, y + 0.5], [RG.x0 + L, y + 0.5]]], ink: C.blue, box: [RG.x0 - 9, y - 9, RG.x0 + L + 9, y + 10] });
          });
          NODES.forEach((n) => {
            const sl = clamp(rowLen(n.r) - n.d, 0, RG.stub * Math.SQRT2) / Math.SQRT2;
            const tone = n.human ? outP : outP * agentsGone(t, n.bx + RG.stub);
            if (sl > 0.3 && tone > 0) pieces.push({ tone, runs: [[[n.bx, n.y + 0.5], [n.bx + sl, n.y + 0.5 + sl]]], ink: n.human ? C.lift : C.blue, white: n.human ? white : 0, box: [n.bx - 12, n.y - 12, n.bx + RG.stub + 12, n.y + RG.stub + 12] });
          });
          for (const pass of ['case', 'ink', 'core']) {
            for (const p of pieces) {
              const w = pass === 'case' ? 17 : pass === 'ink' ? 7 : 3;
              const col = pass === 'ink' ? p.ink : C.navy;
              F.toneUniform(ctx, p.tone, (x) => F.strokeRuns(x, p.runs, col, w), p.box);
              if (pass === 'ink' && p.white > 0) F.toneUniform(ctx, Math.min(p.tone, p.white), (x) => F.strokeRuns(x, p.runs, C.white, 7), p.box);
            }
          }
          // The agent pulses.
          const pt0 = opening ? PULSE.t0 : PULSE.t1, pt2 = opening ? WD.agents : PULSE.t1;
          if (!opening || t < WD.humans + 0.5) {
            for (const q of pulsesAt(t, pt0, pt2)) {
              if (t < nodeArrive(q.n, D)) continue;
              const run = F.runPts(q.n.route, q.a, q.b);
              if (!run) continue;
              const v = opening ? agentsGone(t, run[run.length - 1][0]) : 1;
              if (v > 0) F.toneUniform(ctx, v, (x) => F.strokeRuns(x, [run], C.white, 3), BOX);
            }
          }
          // The path's continuation (line 10).
          if (closing && t >= CONT0) {
            const L = Math.min(CONT.total, (t - CONT0) * PATH3.speed * OPEN.k);
            const run = [F.runPts(CONT, 0, L)];
            F.strokeRuns(ctx, run, C.lift, 9);
            F.strokeRuns(ctx, run, C.navy, 3);
          }
          NODES.forEach((n) => {
            const tone = (n.human ? outP : outP * agentsGone(t, n.cx)) * lin(nodeArrive(n, D), nodeArrive(n, D) + 0.2, t);
            if (!(tone > 0)) return;
            const h = RG.plate / 2;
            F.toneUniform(ctx, tone, (x) => {
              x.fillStyle = C.navy;
              x.fillRect(n.cx - h, n.cy - h, RG.plate, RG.plate);
              F.iconAt(x, n.human ? F.ICON_USER : F.ICON_CPU, n.cx, n.cy, RG.icon, n.human ? C.white : C.lift);
            }, [n.cx - h, n.cy - h, n.cx + h, n.cy + h]);
          });
        }

        /* ---------------- the moving type (heading 1 into heading 2's first line) ---------------- */
        const mtc = $('mt');
        const ctxMT = mtc.getContext('2d');
        MT.move0 = 2 * MT.swap;
        MT.move1 = MT.d - 2 * MT.swap;
        MT.dur = MT.move1 - MT.move0 - 0.2;
        const mtImg = document.createElement('canvas');
        mtImg.width = COLS;
        mtImg.height = MT.rows;
        const mtCtx = mtImg.getContext('2d');
        const mtData = mtCtx.createImageData(COLS, MT.rows);
        const mtA = new Float32Array(COLS * MT.rows);
        const mtC = new Float32Array(COLS * MT.rows);
        // A one-line heading's 3 px cells (canvas face, the heading's own grid); acc: the cells of the accented first word.
        function headingCells(line, accWord) {
          const cv = document.createElement('canvas');
          cv.width = W;
          cv.height = MT.rows * CELL;
          const x = cv.getContext('2d', { willReadFrequently: true });
          x.font = '500 144px InterCanvas';
          x.letterSpacing = (-0.035 * 144).toFixed(3) + 'px';
          x.fontKerning = 'normal';
          x.fillStyle = '#fff';
          x.textBaseline = 'alphabetic';
          const m = x.measureText('Hg');
          const A = m.fontBoundingBoxAscent, D = m.fontBoundingBoxDescent, lh = 1.04 * 144;
          const top = 125 - MT.y0;
          x.fillText(line, 160, top + (lh - (A + D)) / 2 + A);
          const accX = accWord ? 160 + x.measureText(accWord).width : -1;
          const d = x.getImageData(0, 0, W, MT.rows * CELL).data;
          const out = [];
          for (let cy = 0; cy < MT.rows; cy++)
            for (let cx = 0; cx < COLS; cx++) {
              let a = 0;
              for (let yy = 0; yy < CELL; yy++) for (let xx = 0; xx < CELL; xx++) a += d[((cy * CELL + yy) * W + cx * CELL + xx) * 4 + 3];
              const cov = a / (9 * 255);
              if (cov > 0.04) out.push([cx * CELL, MT.y0 + cy * CELL, cx * CELL < accX ? 1 : 0, cov]);
            }
          return out;
        }
        // Matter is conserved: the old line's cells are paired in reading order with the new line's; the accent cells of
        // "Humans" mix to white along the move.
        function buildMT(a, accWord, b, seed) {
          const key = (p) => p[0] * 1000 + p[1];
          const pa = headingCells(a, accWord).sort((p, q) => key(p) - key(q));
          const pb = headingCells(b, null).sort((p, q) => key(p) - key(q));
          const rng = GTDither.rng(seed);
          const parts = [];
          const n = Math.max(pa.length, pb.length);
          for (let k = 0; k < n; k++) {
            const qa = pa[Math.floor((k * pa.length) / n)];
            const qb = pb[Math.floor((k * pb.length) / n)];
            const mid = (qa[0] + qb[0]) / 2;
            parts.push({ ax: qa[0], ay: qa[1], acc: qa[2], ca: qa[3], bx: qb[0], by: qb[1], cb: qb[3], delay: 0.18 * clamp01((mid - 160) / 1200) + 0.02 * rng(), lift: (rng() - 0.5) * 12 });
          }
          return { parts };
        }
        let MTP = null;
        function drawMT(t) {
          const on = MTP && t >= MT.t0 && t < MT.t0 + MT.d;
          show(mtc, !!on);
          if (!on) return;
          ctxMT.clearRect(0, 0, W, H);
          const lt = t - MT.t0;
          mtA.fill(0);
          mtC.fill(0);
          for (const q of MTP.parts) {
            const u = ease.p2io((lt - MT.move0 - q.delay) / MT.dur);
            const x = q.ax + (q.bx - q.ax) * u;
            const y = q.ay + (q.by - q.ay) * u + Math.sin(Math.PI * u) * q.lift;
            const gx = Math.round(x / CELL), gy = Math.round((y - MT.y0) / CELL);
            if (gx < 0 || gx >= COLS || gy < 0 || gy >= MT.rows) continue;
            const i = gy * COLS + gx;
            const c = q.ca + (q.cb - q.ca) * u;
            if (c > mtA[i]) {
              mtA[i] = c;
              mtC[i] = q.acc * (1 - u);
            }
          }
          const dd = mtData.data;
          const L = [134, 168, 255];
          for (let i = 0, k = 0; i < mtA.length; i++, k += 4) {
            const f = mtC[i];
            dd[k] = Math.round(255 + (L[0] - 255) * f);
            dd[k + 1] = Math.round(255 + (L[1] - 255) * f);
            dd[k + 2] = 255;
            dd[k + 3] = Math.round(mtA[i] * 255);
          }
          mtCtx.putImageData(mtData, 0, 0);
          ctxMT.globalAlpha = Math.min(lin(0, MT.swap, lt), 1 - lin(MT.d - MT.swap, MT.d, lt));
          ctxMT.imageSmoothingEnabled = false;
          ctxMT.drawImage(mtImg, 0, MT.y0, W, MT.rows * CELL);
          ctxMT.globalAlpha = 1;
        }

        /* ---------------- render ---------------- */
        function render(t) {
          if (t >= B.card) return;
          const cam = camF(t);
          drawPlanet(t);
          drawOpen(t);
          drawPage(t, cam);
          drawWall(t, cam);
          drawPile(t);
          drawDiag(t);
          drawWriting(t, cam);
          drawGuides(t);
          drawPath(t, cam);
          drawGrid(t);
          drawMT(t);
          drawField(t, cam);
        }

        /* ---------------- the timeline ---------------- */
        const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
        tl.to({ t: 0 }, { t: B.end, duration: B.end, ease: 'none' }, 0);
        // Each word: opacity 0 to 1 and a 12 px rise in 0.30 s (power2.out) from its own word start.
        const words = (id) => Array.from($(id).querySelectorAll('.ln')).map((ln) => Array.from(ln.querySelectorAll('.w')));
        for (const id of HEADS) {
          words(id).forEach((ws, li) =>
            ws.forEach((w, wi) => {
              const at0 = HW[id][li][wi];
              if (at0 != null) tl.fromTo(w, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' }, at0);
            })
          );
        }
        // Exits: the whole heading, opacity to 0 and 8 px up in 0.45 s (power2.inOut), in a pause or its own tail.
        for (const id of ['h2', 'h3', 'h4']) tl.fromTo(`#${id}`, { opacity: 1, y: 0 }, { opacity: 0, y: -8, duration: 0.45, ease: 'power2.inOut', immediateRender: false }, HX[id]);
        // The moving type's hand-overs: heading 1 fades off its cells once they are up, and heading 2's first line fades
        // onto its cells before they go; drawMT runs the cells' side.
        tl.fromTo('#h1', { opacity: 1 }, { opacity: 0, duration: MT.swap, ease: 'none', immediateRender: false }, MT.t0 + MT.swap);
        words('h2')[0].forEach((w) => tl.fromTo(w, { opacity: 0 }, { opacity: 1, duration: MT.swap, ease: 'none' }, MT.t0 + MT.d - 2 * MT.swap));
        window.__render = render;
        window.__dbg = { gems, FIELD, GEM7, gemCells, B, WD, O, MT, camera, camF, CAMS, CAM, LINE7, W7T, MOVES, WR, ease, ENV, envAt, inkBoxes, PATH3, path3, CONT, NODES, RG, DG, GY, PUSHX, CL, RED, pageRect };

        /* ---------------- the end card (kit/endcard, used as it is) ---------------- */
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        let cardReady;
        window.__hf.buildReady.endcard = new Promise((res) => (cardReady = res));
        function addCard() {
          const card = GTEndCard.addEndCard(tl, {
            palette: 'blue',
            title: ['Designing docs', 'for humans'],
            url: 'generaltranslation.com/blog/designing-docs-for-humans',
            start: B.card,
          });
          card.ready.then(cardReady, (e) => {
            window.__filmError = String((e && e.stack) || e);
            cardReady();
          });
          window.__timelines = window.__timelines || {};
          window.__timelines['main'] = tl;
        }
        if (window.GTEndCard) addCard();
        else window.addEventListener('gtendcard-ready', addCard, { once: true });

        /* ---------------- readiness: fonts, the gem mount, the envelopes, the type caches ---------------- */
        const canvasFace = new FontFace('InterCanvas', 'url(lib/fonts/InterCanvas.woff2)', { weight: '100 900' });
        document.fonts.add(canvasFace);
        const gemReady = new Promise((res) => (window.GTGem ? res() : window.addEventListener('gtgem-ready', res, { once: true })));
        const ready = Promise.all([canvasFace.load(), document.fonts.load('500 144px Inter'), gemReady])
          .then(() => document.fonts.ready)
          .then(() => GTGem.mount($('gemA'), { palette: 'blue', width: W, height: H, pixelRatio: 0.5, params: FIELD.params }))
          .then((a) => {
            gems.a = a;
            gemMode = 'field';
            buildEnvs();
            MTP = buildMT('Humans still read docs', 'Humans', 'General Translation', 77);
            render(tl.time());
            window.__filmReady = true;
          })
          .catch((e) => {
            window.__filmError = String((e && e.stack) || e);
          });
        window.__hf.buildReady.film = ready;
        render(0);
      })();
    </script>
  </body>
</html>
