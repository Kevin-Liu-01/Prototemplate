        }

        /* ------------------------------------------------------------ shots 3 and 5: the docs page */

        // The docs page, a vector object rebuilt from the post's two images
        // (kit/blog/fumadocs-landing.png, fumadocs-slider.png): raised-ink
        // panels with square corners and 2 px edges at 0.18 alpha, the
        // Fumadocs moon at 28 px in its nav, six bars in the sidebar, a white
        // title bar over five ember paragraph bars in the content, and a
        // table of contents of six short bars beside its curved line, which
        // jogs right at nested entries and carries a dot at its top; its
        // active stretch is sun and the rest ember. No text on it is readable.
        // Page space is the full size, 1600 x 480: nav 68 tall, sidebar 320,
        // content 920, table of contents 360 wide. v4 draws it thicker so it
        // reads at 0.6 scale: nav bars 10 px, the other bars 12 px, the title
        // bar 28 px, the table of contents' line 4 px with a 12 px dot.
        const PG = { w: 1600, h: 480, nav: 68, side: 320, toc: 1240 };
        const PARTS = {
          nav: { x: 0, y: 0, w: 1600, h: 68 },
          side: { x: 0, y: 68, w: 320, h: 412 },
          content: { x: 320, y: 68, w: 920, h: 412 },
          toc: { x: 1240, y: 68, w: 360, h: 412 },
        };
        const NAV_BARS = [[76, 92], [190, 58], [270, 76], [368, 70]];
        const SIDE_BARS = [150, 110, 176, 128, 164, 118];
        const CONTENT_BARS = [800, 760, 820, 700, 520];
        const TOC_LV = [0, 1, 0, 1, 0, 1];
        const TOC_W = [150, 118, 196, 84, 64, 104];
        function tocY(k) {
          return 52 + 58 * k; // entry centres, part space
        }
        function tocX(y) {
          // the line's x at height y (part space): level 0 at 32, nested at 46, an S-bend between entries
          let x = 32 + 14 * TOC_LV[0];
          for (let k = 0; k < 5; k++) {
            const b = (tocY(k) + tocY(k + 1)) / 2;
            const u = ss(b - 9, b + 9, y);
            if (u <= 0) break;
            x = lerp(32 + 14 * TOC_LV[k], 32 + 14 * TOC_LV[k + 1], u);
          }
          return x;
        }
        const TOC_TOP = 18;
        const TOC_BOT = tocY(5) + 30;
        // the active stretch for section a (a float): entries 2a and 2a + 1
        function activeSpan(a) {
          const y0 = tocY(0) - 24 + 116 * a;
          return [y0, y0 + 106];
        }
        // T: a transform to the screen, { s, x, y } with screen = (x + s px, y + s py)
        function R(T, x, y, w, h) {
          // a rect in page space, rounded to whole screen pixels
          const x0 = Math.round(T.x + T.s * x);
          const y0 = Math.round(T.y + T.s * y);
          const x1 = Math.round(T.x + T.s * (x + w));
          const y1 = Math.round(T.y + T.s * (y + h));
          return [x0, y0, Math.max(1, x1 - x0), Math.max(1, y1 - y0)];
        }
        function fillR(ctx, T, x, y, w, h, color) {
          const r = R(T, x, y, w, h);
          ctx.fillStyle = color;
          ctx.fillRect(r[0], r[1], r[2], r[3]);
        }
        function edge(ctx, r) {
          // a 2 px edge inside a rect
          ctx.strokeStyle = HEX.hair;
          ctx.lineWidth = 2;
          ctx.strokeRect(r[0] + 1, r[1] + 1, r[2] - 2, r[3] - 2);
        }
        function panel(ctx, T, part) {
          // a raised-ink panel and its 2 px edge
          const r = R(T, part.x, part.y, part.w, part.h);
          ctx.fillStyle = HEX.raised;
          ctx.fillRect(r[0], r[1], r[2], r[3]);
          edge(ctx, r);
        }
        const fdLogo = el('img-fdlogo');
        function navInk(ctx, T) {
          const p = PARTS.nav;
          const lr = R(T, p.x + 22, p.y + 20, 28, 28);
          ctx.drawImage(fdLogo, lr[0], lr[1], lr[2], lr[3]);
          NAV_BARS.forEach(function (b) {
            fillR(ctx, T, p.x + b[0], p.y + 29, b[1], 10, HEX.ember);
          });
          edge(ctx, R(T, p.x + 1224, p.y + 17, 236, 34));
          fillR(ctx, T, p.x + 1240, p.y + 29, 60, 10, HEX.ember);
          edge(ctx, R(T, p.x + 1500, p.y + 21, 26, 26));
        }
        function sideInk(ctx, T) {
          const p = PARTS.side;
          SIDE_BARS.forEach(function (w, k) {
            fillR(ctx, T, p.x + 32, p.y + 43 + 52 * k, w, 12, k === 1 ? HEX.white : HEX.ember);
          });
        }
        function contentInk(ctx, T) {
          const p = PARTS.content;
          fillR(ctx, T, p.x + 56, p.y + 48, 380, 28, HEX.white);
          CONTENT_BARS.forEach(function (w, k) {
            fillR(ctx, T, p.x + 56, p.y + 123 + 34 * k, w, 12, HEX.ember);
          });
        }
        // the table of contents' ink at (part-local) transform T, its active section a
        function tocInk(ctx, T, a) {
          const span = activeSpan(a);
          const lw = Math.max(2, Math.round(4 * T.s));
          function stroke(y0, y1, color) {
            if (y1 <= y0) return;
            ctx.strokeStyle = color;
            ctx.lineWidth = lw;
            ctx.beginPath();
            for (let y = y0, k = 0; y <= y1 + 0.01; y += 2, k++) {
              const sx = T.x + T.s * tocX(Math.min(y, y1));
              const sy = T.y + T.s * Math.min(y, y1);
              if (k) ctx.lineTo(sx, sy);
              else ctx.moveTo(sx, sy);
            }
            ctx.stroke();
          }
          stroke(TOC_TOP, TOC_BOT, HEX.ember);
          stroke(clamp(span[0], TOC_TOP, TOC_BOT), clamp(span[1], TOC_TOP, TOC_BOT), HEX.sun);
          const dr = Math.max(3, 6 * T.s);
          ctx.fillStyle = HEX.sun;
          ctx.beginPath();
          ctx.arc(T.x + T.s * tocX(TOC_TOP), T.y + T.s * TOC_TOP, dr, 0, 2 * Math.PI);
          ctx.fill();
          TOC_LV.forEach(function (lv, k) {
            const y = tocY(k);
            const on = y >= span[0] && y <= span[1];
            fillR(ctx, T, 32 + 14 * lv + 22, y - 6, TOC_W[k], 12, on ? HEX.sun : HEX.ember);
          });
        }
        // transforms: a part's own origin (partT) or the page's origin shifted (pageT), page px offsets
        function partT(G, part, dx, dy) {
          return { s: G.s, x: G.x + G.s * (part.x + dx), y: G.y + G.s * (part.y + dy) };
        }
        function pageT(G, dx, dy) {
          return { s: G.s, x: G.x + G.s * dx, y: G.y + G.s * dy };
        }

        // shot 3: the page at 0.6 scale above the held heap (x 160 to 1120, y 176 to 464)
        const PAGE3 = { x: 160, y: 176, s: 0.6 };
        const pageCanvas = el('page');
        const gctx = pageCanvas.getContext('2d');
        function group(draw, p) {
          // draw a group into L1 at tone p, then onto L2
          if (p <= 0) return;
          L1.x.setTransform(1, 0, 0, 1, 0, 0);
          L1.x.clearRect(0, 0, W, H);
          draw(L1.x);
          toneLayer(L1.x, p);
          L2.x.drawImage(L1.c, 0, 0);
        }
        function drawPage3(t) {
          L2.x.setTransform(1, 0, 0, 1, 0, 0);
          L2.x.clearRect(0, 0, W, H);
          // the raised-ink panels rise 16 px and raise their tone (0.5 s)
          const rise = (1 - EXPO(prog(t, PAGE3_AT, 0.5))) * 16;
          const G = { s: PAGE3.s, x: PAGE3.x, y: PAGE3.y + rise };
          const pPanel = ss(PAGE3_AT, PAGE3_AT + 0.5, t);
          group(function (ctx) {
            ['nav', 'side', 'content', 'toc'].forEach(function (n) {
              panel(ctx, pageT(G, 0, 0), PARTS[n]);
            });
          }, pPanel);
          // then the nav, the sidebar, the content and the table of contents fill, 60 ms apart, left to right, done by 26.14
          const f0 = PAGE3_AT + 0.46;
          group(function (ctx) {
            navInk(ctx, pageT(G, 0, 0));
          }, ss(f0, f0 + 0.16, t));
          group(function (ctx) {
            sideInk(ctx, pageT(G, 0, 0));
          }, ss(f0 + 0.06, f0 + 0.22, t));
          group(function (ctx) {
            contentInk(ctx, pageT(G, 0, 0));
          }, ss(f0 + 0.12, f0 + 0.28, t));
          group(function (ctx) {
            tocInk(ctx, partT(G, PARTS.toc, 0, 0), P2IO(prog(t, PAGE_STEP, 0.35)));
          }, ss(f0 + 0.18, f0 + 0.34, t));
          // the whole page leaves by a tone mix on "documentation"
          toneLayer(L2.x, 1 - ss(PAGE_OUT, PAGE_OUT + 0.6, t));
          gctx.setTransform(1, 0, 0, 1, 0, 0);
          gctx.clearRect(0, 0, W, H);
          gctx.drawImage(L2.c, 0, 0);
        }

        // shot 5: the page at full size (x 160 to 1760, y 472 to 952), its nav
        // seam on y 540, the line the moon's middle seam held a frame before
        // the cut. On "CLI" the sidebar seam (x 480) and the table of
        // contents' seam (x 1400) draw down out of crosses on the nav seam;
        // on "copy" the parts move apart; on "just" the page eases to 0.625
        // about (160, 540), so the nav seam stays on y 540, and its right edge
        // uncovers the code panel lying under it; on "of contents" the table
        // of contents lifts out, leaves a fire outline in its slot, and a
        // connector draws to the panel; after "Into your codebase" is set it
        // travels into the panel, whose rows part for it, and seats, and a sun
        // block runs down its curved line
        // fix round: the panel's top is y 568 (v4 first cut: 472), below the nav
        // seam, which now runs on above it to x 1768; 14 rows instead of 18
        const PANEL = { x0: 1340, y0: 568, x1: 1760, y1: 952 };
        const PANEL_N = 14;
        const PANEL_ROWS = [];
        function buildPanelRows() {
          const rnd = GTDither.rng(4417);
          const ind = [0, 1, 1, 2, 2, 1, 0, 0, 1, 2, 3, 2, 1, 0, 1, 1, 0, 0];
          for (let r = 0; r < PANEL_N; r++) {
            const y = PANEL.y0 + 36 + 24 * r; // the row's centre
            let x = PANEL.x0 + 28 + 24 * ind[r];
            const end = Math.min(PANEL.x1 - 28, x + 90 + Math.floor(rnd() * 220));
            const bars = [];
            let k = 0;
            while (x < end - 12) {
              const w = Math.min(end - x, 20 + Math.floor(rnd() * 70));
              bars.push({ x, w, c: k === 0 && rnd() < 0.55 ? HEX.white : HEX.ember });
              x += w + 9;
              k++;
            }
            PANEL_ROWS.push({ y, bars });
          }
        }
        function seamOff(t) {
          // the parts' offsets in page px: the nav up and the body down 12 each
          // (the nav seam between them stays on y 540), the sidebar left 36, the
          // table of contents right 36
          const e = snap(36 * P3(prog(t, COPY, 0.5))) / 36;
          return { nav: -12 * e, body: 12 * e, side: -36 * e, toc: 36 * e, e };
        }
        function page5G(t) {
          const s = lerp(1, 0.625, P2IO(prog(t, JUST, 0.7)));
          return { s, x: 160, y: 540 - 68 * s };
        }
        // the part's screen rect at t: lifted on "of contents", then along the connector into the panel
        function partRect(t) {
          const G = page5G(t);
          const o = seamOff(t);
          const lift = -24 * EXPO(prog(t, LIFT, 0.4));
          const T = partT(G, PARTS.toc, o.toc, o.body + lift);
          const w = G.s * PARTS.toc.w;
          const h = G.s * PARTS.toc.h;
          const seatX = (PANEL.x0 + PANEL.x1) / 2 - w / 2;
          const seatY = (PANEL.y0 + PANEL.y1) / 2 - h / 2;
          const u = P2IO(prog(t, TRAVEL0, TRAVEL_D));
          // fix round: as it enters the panel it drops into the opening, below the nav seam
          const v = P2IO(prog(t, SEAT0, 0.5));
          return { T: { s: T.s, x: lerp(T.x, seatX, u), y: lerp(T.y, seatY, v) }, x0: T.x, y0: T.y, w, h, u, seatY };
        }
        function drawPage5(t) {
          const G = page5G(t);
          const o = seamOff(t);
          LX = gctx;
          gctx.setTransform(1, 0, 0, 1, 0, 0);
          gctx.clearRect(0, 0, W, H);
          const pr = partRect(t);
          // the connector runs at the lifted part's middle; the panel opens at its seat's middle
          const gapY = pr.y0 + pr.h / 2;
          const openY = pr.seatY + pr.h / 2;
          // the code panel comes first, under the page: it is there from the
          // cut, and the shrinking page's right edge uncovers it
          const hullRight = G.x + G.s * (PG.w + o.toc);
          if (hullRight < PANEL.x1) {
            gctx.save();
            gctx.beginPath();
            gctx.rect(Math.max(PANEL.x0 - 16, Math.ceil(hullRight)), PANEL.y0 - 16, PANEL.x1 + 16 - Math.max(PANEL.x0 - 16, Math.ceil(hullRight)), PANEL.y1 - PANEL.y0 + 32);
            gctx.clip();
            const pr0 = [PANEL.x0, PANEL.y0, PANEL.x1 - PANEL.x0, PANEL.y1 - PANEL.y0];
            gctx.fillStyle = HEX.raised;
            gctx.fillRect(pr0[0], pr0[1], pr0[2], pr0[3]);
            edge(gctx, pr0);
            cross(PANEL.x0, PANEL.y0);
            // its 18 rows of 12 px bars, which part at the part's middle to open a gap its height
            const gap = (pr.h + 24) * P2IO(prog(t, ROWS_OPEN, 0.5));
            gctx.save();
            gctx.beginPath();
            gctx.rect(PANEL.x0 + 2, PANEL.y0 + 2, PANEL.x1 - PANEL.x0 - 4, PANEL.y1 - PANEL.y0 - 4);
            gctx.clip();
            PANEL_ROWS.forEach(function (row) {
              const dy = row.y < openY ? -gap / 2 : gap / 2;
              row.bars.forEach(function (bar) {
                gctx.fillStyle = bar.c;
                gctx.fillRect(bar.x, Math.round(row.y - 6 + dy), bar.w, 12);
              });
            });
            gctx.restore();
            gctx.restore();
          }
          // the nav, the sidebar and the content (the table of contents is drawn last, as the part)
          panel(gctx, partT(G, PARTS.nav, 0, o.nav), { x: 0, y: 0, w: PARTS.nav.w, h: PARTS.nav.h });
          navInk(gctx, pageT(G, 0, o.nav));
          panel(gctx, partT(G, PARTS.side, o.side, o.body), { x: 0, y: 0, w: PARTS.side.w, h: PARTS.side.h });
          sideInk(gctx, pageT(G, o.side, o.body));
          panel(gctx, partT(G, PARTS.content, 0, o.body), { x: 0, y: 0, w: PARTS.content.w, h: PARTS.content.h });
          contentInk(gctx, pageT(G, 0, o.body));
          // the seams: the nav seam on y 540 (carried over by the cut), and on
          // "CLI" the two vertical seams down out of crosses on it, in the
          // middle of the gaps the parting opens
          const ny = 540;
          const nxl = G.x + G.s * o.side - 24;
          // fix round: the seam keeps its length through the shrink, its right
          // cross easing from the page's edge to x 1768, the right cross of the
          // moon's middle seam, so the whole of that seam is on screen before
          // the cut back on "If" (it runs above the code panel)
          const nxr = lerp(G.x + PG.w + o.toc + 24, 1768, P2IO(prog(t, JUST, 0.7)));
          cross(nxl, ny);
          doubledH(nxl + 16, nxr - 16, ny);
          cross(nxr, ny);
          const vx = [G.x + G.s * (PG.side + o.side / 2), G.x + G.s * (PG.toc + o.toc / 2)];
          const vy1 = 540 + G.s * (o.body + 412) + 24;
          vx.forEach(function (x, k) {
            const t0 = CLI_SEAMS[k];
            if (t < t0) return;
            cross(x, ny, EXPO(prog(t, t0, 0.15)));
            const e = P3(prog(t, t0, SEAM_D));
            doubledV(x, ny + 5, lerp(ny + 5, vy1 - 16, e));
            if (e > 0.995) cross(x, vy1);
          });
          // the slot's 3 px fire outline, drawn once around the part's place on "of contents"
          if (t >= LIFT) {
            const slot = R(partT(G, PARTS.toc, o.toc, o.body), 0, 0, PARTS.toc.w, PARTS.toc.h);
            gctx.strokeStyle = HEX.fire;
            gctx.lineWidth = 3;
            gctx.lineJoin = 'miter';
            const x0 = slot[0] + 1.5;
            const y0 = slot[1] + 1.5;
            const x1 = slot[0] + slot[2] - 1.5;
            const y1 = slot[1] + slot[3] - 1.5;
            strokePrefix([[x0, y0], [x1, y0], [x1, y1], [x0, y1], [x0, y0]], EXPO(prog(t, LIFT, 0.5)));
          }
          // the connector, from a cross on the part's right edge to a cross at x 1324 (the panel's left edge, 16 px out)
          if (t >= CONN5) {
            const e = EXPO(prog(t, CONN5, 0.35));
            const cy = Math.round(gapY);
            const ca = Math.round(pr.x0 + pr.w + 8);
            const cb = PANEL.x0 - 16;
            cross(ca, cy, EXPO(prog(t, CONN5, 0.12)));
            doubledH(ca + 16, lerp(ca + 16, cb - 16, e), cy);
            if (e > 0.995) cross(cb, cy);
          }
          // the part itself, last: its panel and its table of contents; the
          // highlight runs down its curved line as it seats
          panel(gctx, pr.T, { x: 0, y: 0, w: PARTS.toc.w, h: PARTS.toc.h });
          tocInk(gctx, pr.T, 2 * prog(t, SUNRUN, 0.5));
          LX = ictx;
        }

        /* ------------------------------------------------------------ shot 7: the grant */

        // the connector from a cross under the GT mark (1594, 393) down to the
        // moon's centre line (y 700) and left to a cross at x 1306, 16 px out
        // from the moon's limb: one path with a square corner
        const CONN9 = { x: Math.round((MARK.x0 + MARK.x1) / 2), y0: Math.round(MARK.y1 + 24), y1: MOON9.y, x1: MOON9.x + MOON9.r + 16 };
        function drawGrant(t) {
          if (t < FIRST9) return;
          const pts = [[CONN9.x, CONN9.y0 + 16], [CONN9.x, CONN9.y1], [CONN9.x1 + 16, CONN9.y1]];
          const len = CONN9.y1 - CONN9.y0 - 16 + CONN9.x - CONN9.x1 - 16;
          const e = EXPO(prog(t, FIRST9, 0.5));
          // a 200 px fire pulse runs the connector, its head reaching the moon on "grantee"
          let pulse = null;
          if (t >= PULSE9) {
            const ph = len * prog(t, PULSE9, THICK9 - PULSE9);
            const tail = Math.max(0, ph - 200 + 200 * prog(t, THICK9, 0.2));
            if (ph - tail > 0.5) pulse = [tail, ph];
          }
          // it tones out on the 3 px grid over the 0.4 s before the card
          const out = 1 - ss(RECEDE9, CARD, t);
          L1.x.setTransform(1, 0, 0, 1, 0, 0);
          L1.x.clearRect(0, 0, W, H);
          LX = L1.x;
          cross(CONN9.x, CONN9.y0, EXPO(prog(t, FIRST9, 0.12)));
          doubledPath(pts, len * e, pulse);
          if (e > 0.995) cross(CONN9.x1, CONN9.y1);
          toneLayer(L1.x, out);
          LX = ictx;
          ictx.drawImage(L1.c, 0, 0);
        }

        /* ------------------------------------------------------------ shot 6: the glyph moon */

        const WORLD = [
          [['a', 'e', 'g', 'r', 's', 'G', 'T'], 'en'],
          [['λ', 'Ω', 'φ', 'ξ'], 'el'],
          [['Ж', 'я', 'ф', 'д'], 'ru'],
          [['א', 'ש', 'ל', 'ת'], 'he'],
          [['ب', 'ع', 'ق', 'ك', 'م'], 'ar'],
          [['क', 'ह', 'श', 'ज', 'त'], 'hi'],
          [['த', 'ழ', 'க', 'ம'], 'ta'],
          [['ಕ', 'ಗ', 'ಮ'], 'kn'],
          [['ক', 'ভ', 'ম'], 'bn'],
          [['ก', 'ญ', 'ม', 'ษ'], 'th'],
          [['ა', 'ღ', 'ქ'], 'ka'],
          [['Ա', 'Ֆ', 'Ջ'], 'hy'],
          [['ሀ', 'ጸ', 'ሰ'], 'am'],
          [['あ', 'ゆ', 'の'], 'ja'],
          [['カ', 'ネ', 'ト'], 'ja'],
          [['文', '字', '語', '言', '世', '界'], 'zh'],
          [['한', '글', '말'], 'ko'],
          [['{', '}', ';', '=', '(', ')', '<', '>', '/'], 'en'],
        ];
        // the glyph moon's light is read on a 5 px grid of the moon's smoke and
        // mapped as the print maps it, so the lit band the print showed is where
        // the white and sun glyphs stand
        const GS = 5;
        const GW = W / GS;
        const GH = H / GS;
        const glyphLum = new Float32Array(GW * GH);
        function glyphTone(l) {
          return clamp(Math.pow(l, 1.05) * 1.02);
        }
        function glyphInk(tn) {
          return tn > 0.9 ? HEX.white : tn > 0.7 ? HEX.sun : tn > 0.38 ? HEX.fire : HEX.ember;
        }
        // the moon fills in the light the print had (the frame on "scratch");
        // once its last row lands on "shape", the ink (never the size) follows
        // the moon's smoke again, its clock easing up to 0.08 shader seconds a
        // second; the glass moon of shot 7 keeps the same clock
        function sGlyph(t) {
          const u = Math.max(0, t - SHAPE);
          return sMoon(PRINT_OUT) + 0.08 * (u < 0.5 ? u * u : u - 0.25);
        }
        const GLYPH_FAMILY = "var(--font), 'Hiragino Sans', 'PingFang SC', 'Apple SD Gothic Neo', 'Geeza Pro', 'Kohinoor Devanagari', 'Tamil Sangam MN', 'Kannada Sangam MN', 'Bangla Sangam MN', Thonburi, Kefa, Mshtakan, 'Helvetica Neue', system-ui, sans-serif";
        const GLYPH_CELL = 36;
        const GLYPH_MAX = 30;
        const glyphRows = [];
        function buildGlyphs(lum) {
          const host = el('glyphs');
          const cell = GLYPH_CELL;
          const cols = Math.floor(W / cell);
          const rows = Math.floor(H / cell);
          const rnd = GTDither.rng(1988);
          for (let gy = 0; gy < rows; gy++) {
            const row = [];
            for (let gx = 0; gx < cols; gx++) {
              const pickS = rnd();
              const pickG = rnd();
              const cx = (gx + 0.5) * cell;
              const cy = (gy + 0.5) * cell;
              // centres at least half a cell inside the limb, and a glyph's ink never past it
              const dc = Math.hypot(cx - MOON.x, cy - MOON.y);
              if (dc > MOON.r - cell / 2) continue;
              const li = Math.floor(cy / GS) * GW + Math.floor(cx / GS);
              const tone = glyphTone(lum[li]);
              const size = Math.min(GLYPH_MAX, cell * (0.3 + 0.68 * Math.sqrt(0.12 + 0.88 * tone)), (MOON.r - dc) / 0.4);
              const script = WORLD[Math.floor(pickS * WORLD.length)];
              const ch = script[0][Math.floor(pickG * script[0].length)];
              const s = document.createElement('span');
              s.className = 'gl';
              s.textContent = ch;
              s.setAttribute('lang', script[1]);
              if (script[1] === 'he' || script[1] === 'ar') s.setAttribute('dir', 'rtl');
              s.style.left = gx * cell + 'px';
              s.style.top = gy * cell + 'px';
              s.style.fontSize = size.toFixed(1) + 'px';
              s.style.fontFamily = GLYPH_FAMILY;
              const ink = glyphInk(tone);
              s.style.color = ink;
              host.appendChild(s);
              row.push({ node: s, cx, gx, gy, li, ink0: ink, ink });
            }
            if (row.length) glyphRows.push(row);
          }
        }
        // the time each print cell of shot 6 leaves: the time the glyph moon's
        // block over it lands (its row's place in the fill, and its column's
        // place along the row, as the timeline sets the glyphs). Cells near the
        // limb that no glyph covers take their row's time at their column;
        // cells above the first glyph row or below the last take that row's
        const printGate = new Float32Array(COLS * ROWS).fill(Infinity);
        function buildPrintGate(per) {
          const byRow = {};
          let gyMin = Infinity;
          let gyMax = -Infinity;
          glyphRows.forEach(function (row, r) {
            let xa = 1e9;
            let xb = -1e9;
            row.forEach(function (g) {
              xa = Math.min(xa, g.cx);
              xb = Math.max(xb, g.cx);
            });
            byRow[row[0].gy] = { r, xa, xb };
            gyMin = Math.min(gyMin, row[0].gy);
            gyMax = Math.max(gyMax, row[0].gy);
          });
          for (let y = 0, i = 0; y < ROWS; y++) {
            let gy = clamp(Math.floor((y * CELL + 1.5) / GLYPH_CELL), gyMin, gyMax);
            while (!byRow[gy] && gy > gyMin) gy--;
            const q = byRow[gy];
            for (let x = 0; x < COLS; x++, i++) {
              if (discMask[i] <= 0) continue;
              const cx = (Math.floor((x * CELL + 1.5) / GLYPH_CELL) + 0.5) * GLYPH_CELL;
              const f = q.xb > q.xa ? clamp((cx - q.xa) / (q.xb - q.xa)) : 0;
              printGate[i] = GLYPH0 + per * (q.r + 0.85 * f);
            }
          }
        }
        // the glyphs' ink at film time t: the boot inks until the last row
        // lands, then re-read from the drifting smoke (mount B, hidden) until
        // the glass takes the disc
        function inkGlyphs(t) {
          const live = t >= SHAPE;
          if (live) {
            setMoonAt(MOON.x, MOON.y, MOON.r, 1);
            gems.b.at(sGlyph(t));
            readLum(gems.b.canvas, GW, GH, glyphLum);
          }
          for (let r = 0; r < glyphRows.length; r++) {
            const row = glyphRows[r];
            for (let k = 0; k < row.length; k++) {
              const g = row[k];
              const ink = live ? glyphInk(glyphTone(glyphLum[g.li])) : g.ink0;
              if (ink !== g.ink) {
                g.node.style.color = ink;
                g.ink = ink;
              }
            }
          }
        }

        /* ------------------------------------------------------------ the headings' left edge */

        // Each heading's first glyph's ink is seated on x 160, measured from
        // the loaded face, with the end card's overshoot for a round first
        // glyph (kit/endcard). The shift sits on the heading, never on the
        // spans the timeline moves.
        const HEADINGS = ['h-one', 'h-fuma', 'h-fd', 'h-into'];
        const ROUND_LEFT = 'acdeoqsCGOQS';
        function seatHeadings() {
          const mctx = document.createElement('canvas').getContext('2d');
          HEADINGS.forEach(function (id) {
            const h = el(id);
            const cs = getComputedStyle(h);
            const size = parseFloat(cs.fontSize);
            mctx.font = cs.fontWeight + ' ' + size + 'px ' + cs.fontFamily;
            const ch = h.textContent.charAt(0);
            const lsb = -mctx.measureText(ch).actualBoundingBoxLeft;
            const over = ROUND_LEFT.indexOf(ch) >= 0 ? 0.0125 * size : 0;
            h.style.left = (160 - lsb - over).toFixed(2) + 'px';
          });
        }

        /* ------------------------------------------------------------ draw */

        const hostB = el('gem-b');
        const hostC = el('gem-c');
        const CLIP762 = 'circle(' + (MOON.r + 1).toFixed(1) + 'px at ' + MOON.x + 'px ' + MOON.y + 'px)';
        function circleClip(x, y, r) {
          return 'circle(' + (r + 1).toFixed(2) + 'px at ' + x.toFixed(2) + 'px ' + y.toFixed(2) + 'px)';
        }
        function draw(t) {
          if (!gems.a || !gems.b || !gems.c) return;
          // mount B: shot 1's moon (read for its print from the moving type,
          // seen as glass from the pulse), shot 4's 762 px moon (glass until
          // its print is whole), shot 6's (read for the print, then for the
          // glyphs' ink), and shot 7's glass moon and its move into the grant
          let bVis = false;
          let clip = CLIP762;
          if (t >= MT0 && t < SHELF_OUT) {
            setMoonAt(SHELFMOON.x, SHELFMOON.y, SHELFMOON.r, 1 - ss(RECEDE, SHELF_OUT, t));
            gems.b.at(sMoon1(t));
            bVis = t >= GLASS1;
            // the glass ends at its limb: the shader's soft rim is clipped 1 px outside it
            clip = circleClip(SHELFMOON.x, SHELFMOON.y, SHELFMOON.r);
          } else if (t >= GLOW4 && t < CUT5) {
            // fix round: sine.inOut (v4 first cut: power3.out, half its glow in 0.15 s)
            setMoonAt(MOON.x, MOON.y, MOON.r, SIO(prog(t, GLOW4, GLOW4_D)));
            gems.b.at(sMoon(t));
            bVis = t < MIX4 + 0.5;
          } else if (t >= CUT6 && t < SHAPE) {
            setMoonAt(MOON.x, MOON.y, MOON.r, 1);
            gems.b.at(sMoon(t));
          } else if (t >= GLYPH_OUT && t < CARD) {
            const e = P2IO(prog(t, MOVE7, 0.8));
            const x = lerp(MOON.x, MOON9.x, e);
            const y = lerp(MOON.y, MOON9.y, e);
            const r = lerp(MOON.r, MOON9.r, e);
            // the glow rises from black in the glyph moon's disc; as the pulse
            // arrives the smoke thickens and settles; then it lowers to black for the card
            const lit = SIO(prog(t, GLYPH_OUT, GLYPH_OUT_D));
            const up = P3(prog(t, THICK9, 0.25));
            const down = P2IO(prog(t, THICK9 + 0.25, 0.42));
            setMoonAt(x, y, r, (lit + 0.4 * up * (1 - down)) * (1 - ss(RECEDE9, CARD, t)));
            gems.b.at(sGlyph(t));
            bVis = true;
            clip = circleClip(x, y, r);
          }
          hostB.style.visibility = bVis ? 'visible' : 'hidden';
          hostB.style.clipPath = clip;
          // mount C: shot 7's GT mark in the end card's box, forming on
          // "General" and easing to the card's opening density 0.4
          if (t >= GT9 && t < CARD) {
            const form = P3(prog(t, GT9, 0.8));
            const toCard = P2IO(prog(t, RECEDE9, CARD - RECEDE9));
            gems.c.mount.setUniformValues({ u_innerGlow: lerp(form, 0.4, toCard), u_outerGlow: 0 });
            gems.c.at(sGT(t));
            hostC.style.visibility = 'visible';
          } else {
            hostC.style.visibility = 'hidden';
          }
          // the field, behind every scene until the end card
          if (t < CARD) {
            fieldCanvas.style.visibility = 'visible';
            drawField(t);
          } else {
            fieldCanvas.style.visibility = 'hidden';
          }
          // shots 2 and 3: the heap, its light drifting after the crest, then the file it builds
          if (t >= NAME_MT0 && t < FILE_END) {
            if (t > HEAP_DRIFT && t < SORT0) {
              setHeapLight();
              gems.a.at(14 + 0.05 * (t - HEAP_DRIFT));
              readLum(gems.a.canvas, HEAP_COLS, HEAP_ROWS, heapLumT);
            }
            if (t >= SORT0) {
              setFileLight();
              gems.a.at(sFile(t));
              readLum(gems.a.canvas, COLS, ROWS, lumGrid);
              inkFile();
            }
            heapCanvas.style.visibility = 'visible';
            drawHeap(t);
          } else {
            heapCanvas.style.visibility = 'hidden';
          }
          // the prints
          if (t >= MT0 && t < GLASS1 + 0.45) {
            printCanvas.style.visibility = 'visible';
            drawMoonPrint1(t);
          } else if (t >= NAME_MT0 && t < NAME_END) {
            printCanvas.style.visibility = 'visible';
            drawNameCells(t);
          } else if ((t >= MIX4 && t < CUT5) || (t >= CUT6 && t < SHAPE)) {
            printCanvas.style.visibility = 'visible';
            drawMoonPrint(t);
          } else {
            printCanvas.style.visibility = 'hidden';
          }
          // the docs page
          if (t >= PAGE3_AT && t < PAGE_OUT + 0.6) {
            pageCanvas.style.visibility = 'visible';
            drawPage3(t);
          } else if (t >= CUT5 && t < CUT6) {
            pageCanvas.style.visibility = 'visible';
            drawPage5(t);
          } else {
            pageCanvas.style.visibility = 'hidden';
          }
          // shot 6: the glyph moon's ink follows the smoke until the glass takes the disc
          if (t >= SHAPE && t < GLYPH_OUT) inkGlyphs(t);
          // the line work
          LX = ictx;
          ictx.setTransform(1, 0, 0, 1, 0, 0);
          ictx.clearRect(0, 0, W, H);
          if (t < SHELF_OUT) drawShelf(t);
          else if (t >= CROSS4 && t < CUT5) drawMoonLines4(t);
          else if (t >= CUT6 && t < CUT6 + 1) drawMoonLines6(t);
          else if (t >= FIRST9 && t < CARD) drawGrant(t);
        }

        /* ------------------------------------------------------------ the timeline */

        let card = null;
        // each rise unit of a heading rises out of its mask at its time
        function riseUnits(tl, id, times) {
          el(id)
            .querySelectorAll('.wm > span')
            .forEach(function (s, k) {
              tl.fromTo(s, { yPercent: 112 }, { yPercent: 0, duration: RISE, ease: 'power3.out' }, times[k]);
            });
        }
        function build() {
          const tl = gsap.timeline({ paused: true });
          const clock = { t: 0 };
          tl.to(clock, { t: END, duration: END, ease: 'none', onUpdate: function () { draw(tl.time()); } }, 0);
          // the four headings, word by word on the take's own times
          riseUnits(tl, 'h-one', H1_AT);
          riseUnits(tl, 'h-fuma', H2_AT);
          riseUnits(tl, 'h-fd', [H3_AT]);
          // fix round: "Fumadocs" leaves as the layers part (its floor ended at
          // 33.44), dropping back into its mask, so it is not on screen while
          // the rest of line 6 is said
          el('h-fd')
            .querySelectorAll('.wm > span')
            .forEach(function (sp) {
              tl.fromTo(sp, { yPercent: 0 }, { yPercent: 112, duration: 0.45, ease: 'power2.in', immediateRender: false }, H3_OUT);
            });
          riseUnits(tl, 'h-into', H4_AT);
          // the glyph moon fills row by row from the top, in reading order,
          // its last row landing on "shape"; it leaves in Bayer order of its
          // 36 px grid as the glass rises in the same disc
          const per = (SHAPE - GLYPH0) / glyphRows.length;
          buildPrintGate(per);
          glyphRows.forEach(function (row, r) {
            let xa = 1e9;
            let xb = -1e9;
            row.forEach(function (g) {
              xa = Math.min(xa, g.cx);
              xb = Math.max(xb, g.cx);
            });
            row.forEach(function (g) {
              const f = xb > xa ? (g.cx - xa) / (xb - xa) : 0;
              tl.set(g.node, { opacity: 1 }, GLYPH0 + per * (r + 0.85 * f));
              // fix round: off in Bayer order on sine.inOut over GLYPH_OUT_D, the share
              // switched off at each moment matching the glass's glow (lit, in draw)
              tl.set(g.node, { opacity: 0 }, GLYPH_OUT + (GLYPH_OUT_D * Math.acos(1 - 2 * th8(g.gx, g.gy))) / Math.PI);
            });
          });
          // shot 1: Fumadocs' count rises on "13"; each adopter's count rises
          // with its mark; every count drops into its mask as the shelf recedes
          tl.fromTo(fdCount.inner, { yPercent: 110 }, { yPercent: 0, duration: 0.4, ease: 'expo.out' }, COUNT_AT);
          marks.forEach(function (m) {
            tl.fromTo(m.count.inner, { yPercent: 110 }, { yPercent: 0, duration: 0.5, ease: 'expo.out' }, m.t);
          });
          [fdCount].concat(marks.map(function (m) { return m.count; })).forEach(function (c) {
            tl.fromTo(c.inner, { yPercent: 0 }, { yPercent: 110, duration: 0.4, ease: 'power2.in', immediateRender: false }, RECEDE);
          });
          // the series end card (kit/endcard): fire, the post's title, its link, silent
          card = GTEndCard.addEndCard(tl, {
            palette: 'fire',
            title: ['Fuma Nama: The philosophy', 'of an open-sourcerer'],
            url: 'generaltranslation.com/blog/fuma-nama',
            start: CARD,
          });
          return tl;
        }

        function boot() {
          const logos = ADOPTERS.map(function (a) {
            return el('logo-' + a.id).decode();
          });
          const ready = [
            GTGem.mount(el('gem-a'), { palette: 'fire', width: W, height: H, pixelRatio: 0.5, params: { scale: 0.9, offsetX: 0.25 } }),
            GTGem.mount(el('gem-b'), { palette: 'fire', width: W, height: H, image: 'kit/gem-shapes/fumadocs-moon.png', params: { scale: 1.1, offsetX: 0.36, offsetY: 0, innerGlow: 1, outerGlow: 0 } }),
            GTGem.mount(el('gem-c'), { palette: 'fire', width: W, height: H, image: 'kit/gem-shapes/gt-mark.png', params: GT_SMOKE }),
            document.fonts.load('500 160px Inter'),
            document.fonts.load('500 24px Inter'),
            document.fonts.load('500 64px Inter', '0123456789.k'),
            document.fonts.load('500 92px Inter', '0123456789.k'),
            shapes.moon.decode(),
            shapes.gt.decode(),
            el('img-fdlogo').decode(),
            loadInkFaces(),
          ].concat(logos);
          Promise.all(ready).then(function (r) {
            gems.a = r[0];
            gems.b = r[1];
            gems.c = r[2];
            seatHeadings();
            // the heap's light: the free smoke at one moment
            setHeapLight();
            gems.a.at(14);
            readLum(gems.a.canvas, HEAP_COLS, HEAP_ROWS, heapLum0);
            heapLumT.set(heapLum0);
            buildHeap();
            buildNameCells();
            buildFile();
            buildPanelRows();
            buildSwarm();
            // the glyph moon's light: the moon's smoke as the print leaves
            setMoonAt(MOON.x, MOON.y, MOON.r, 1);
            gems.b.at(sMoon(PRINT_OUT));
            readLum(gems.b.canvas, GW, GH, glyphLum);
            buildGlyphs(glyphLum);
            buildMarks();
            buildCounts();
            buildFieldZones();
            const tl = build();
            // registered once the card's smoke is mounted and its type seated
            card.ready.then(function () {
              window.__timelines['main'] = tl;
              draw(0);
            });
          });
        }
        if (window.GTEndCard) boot();
        else window.addEventListener('gtendcard-ready', boot, { once: true });
      })();
    </script>
  </body>
</html>
