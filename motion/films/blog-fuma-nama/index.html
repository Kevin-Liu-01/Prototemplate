      html,

        top: 0;

        height: 1080px;

      }
      canvas.cells {

      }
      .gemhost {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;

        margin: 0;
        color: #ffffff;

        letter-spacing: -0.035em;
        line-height: 1.02;
        white-space: nowrap;
        font-feature-settings: 'ss01' 0, 'cv11' 1;

      /* each spoken word (or phrase) rises out of its own mask */
      .h .wm {

        margin-bottom: -0.14em;

        height: 36px;

        margin: 0;

        padding: 0 0.05em 0.08em;

        left: 0;

        const fimage = foctx.createImageData(COLS, ROWS);
        const fpx32 = new Uint32Array(fimage.data.buffer);
        const fieldLum = new Float32Array(NCELL);
        const fieldS = new Float32Array(NCELL);
        const fieldLP = new Float32Array(NCELL);
        const fieldLP2 = new Float32Array(NCELL);
        const blurTmp = new Float32Array(NCELL);
        const fieldW = new Float32Array(NCELL);

        function boxBlurH(src, dst, r) {
          for (let y = 0; y < ROWS; y++) {
            const o = y * COLS;
            let s = 0;
            let n = 0;
            for (let x = 0; x < r && x < COLS; x++) {
              s += src[o + x];
              n++;
            }
            for (let x = 0; x < COLS; x++) {
              if (x + r < COLS) {
                s += src[o + x + r];
                n++;
              }
              if (x - r - 1 >= 0) {
                s -= src[o + x - r - 1];
                n--;
              }
              dst[o + x] = s / n;
            }
          }
        }
        function boxBlurV(src, dst, r) {
          for (let x = 0; x < COLS; x++) {
            let s = 0;
            let n = 0;
            for (let y = 0; y < r && y < ROWS; y++) {
              s += src[y * COLS + x];
              n++;
            }
            for (let y = 0; y < ROWS; y++) {
              if (y + r < ROWS) {
                s += src[(y + r) * COLS + x];
                n++;
              }
              if (y - r - 1 >= 0) {
                s -= src[(y - r - 1) * COLS + x];
                n--;
              }
              dst[y * COLS + x] = s / n;
            }
          }
        }
        function lowPass(src, dst, r) {
          boxBlurH(src, blurTmp, r);
          boxBlurV(blurTmp, dst, r);
          boxBlurH(dst, blurTmp, r);
          boxBlurV(blurTmp, dst, r);
        }

        // the exact Euclidean distance (css px, cell centre to cell centre)
        // from every cell to the nearest inked cell (Felzenszwalb and
        // Huttenlocher's two-pass transform of squared distances)
        const EDT_N = Math.max(COLS, ROWS);
        const edtF = new Float64Array(EDT_N);
        const edtD = new Float64Array(EDT_N);
        const edtV = new Int32Array(EDT_N);
        const edtZ = new Float64Array(EDT_N + 1);
        function edt1(n) {
          let k = 0;
          edtV[0] = 0;
          edtZ[0] = -1e30;
          edtZ[1] = 1e30;
          for (let q = 1; q < n; q++) {
            let s = (edtF[q] + q * q - (edtF[edtV[k]] + edtV[k] * edtV[k])) / (2 * q - 2 * edtV[k]);
            while (s <= edtZ[k]) {
              k--;
              s = (edtF[q] + q * q - (edtF[edtV[k]] + edtV[k] * edtV[k])) / (2 * q - 2 * edtV[k]);
            }
            k++;
            edtV[k] = q;
            edtZ[k] = s;
            edtZ[k + 1] = 1e30;
          }
          k = 0;
          for (let q = 0; q < n; q++) {
            while (edtZ[k + 1] < q) k++;
            edtD[q] = (q - edtV[k]) * (q - edtV[k]) + edtF[edtV[k]];
          }
        }
        function distanceFrom(occ) {
          const g = new Float64Array(NCELL);
          for (let i = 0; i < NCELL; i++) g[i] = occ[i] ? 0 : 1e20;
          for (let x = 0; x < COLS; x++) {
            for (let y = 0; y < ROWS; y++) edtF[y] = g[y * COLS + x];
            edt1(ROWS);
            for (let y = 0; y < ROWS; y++) g[y * COLS + x] = edtD[y];
          }
          for (let y = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++) edtF[x] = g[y * COLS + x];
            edt1(COLS);
            for (let x = 0; x < COLS; x++) g[y * COLS + x] = edtD[x];
          }
          const d = new Float32Array(NCELL);
          for (let i = 0; i < NCELL; i++) d[i] = Math.sqrt(g[i]) * CELL;
          return d;
        }

        // an object's ink on the cell grid: paint(ctx, occ) draws in css px on
        // a canvas the size of the cell grid (a cell is inked where its ink
        // covers a tenth of it) or marks cells directly
        const zcan = document.createElement('canvas');
        zcan.width = COLS;
        zcan.height = ROWS;
        const zctx = zcan.getContext('2d', { willReadFrequently: true });
        function inkCells(paint) {
          const occ = new Uint8Array(NCELL);
          zctx.setTransform(1, 0, 0, 1, 0, 0);
          zctx.clearRect(0, 0, COLS, ROWS);
          zctx.setTransform(1 / CELL, 0, 0, 1 / CELL, 0, 0);
          zctx.fillStyle = '#ffffff';
          zctx.strokeStyle = '#ffffff';
          paint(zctx, occ);
          const a = zctx.getImageData(0, 0, COLS, ROWS).data;
          for (let i = 0; i < NCELL; i++) if (a[i * 4 + 3] > 24) occ[i] = 1;
          return occ;
        }
        function cellsRow(occ, y, x0, x1) {
          const r = Math.floor(y / CELL);
          if (r < 0 || r >= ROWS) return;
          const c0 = Math.max(0, Math.floor(x0 / CELL));
          const c1 = Math.min(COLS - 1, Math.floor(x1 / CELL));
          for (let c = c0; c <= c1; c++) occ[r * COLS + c] = 1;
        }

        // the zones, each with its window: it clears over [c0, c1] and gives
        // the field back over [r0, r1] (a zone that holds from the first frame
        // has c0 = c1 = -Infinity; one that holds to the end card, r0 = r1 = Infinity)
        const zones = [];
        function addZone(name, paint, z, c0, c1, r0, r1) {
          const d = distanceFrom(inkCells(paint));
          const shift = z.shift === undefined ? SHIFT : z.shift;
          const reach = z.m0 + z.ramp + shift + 1;
          let x0 = COLS;
          let x1 = -1;
          let y0 = ROWS;
          let y1 = -1;
          for (let y = 0, i = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++, i++) {
              if (d[i] >= reach) continue;
              if (x < x0) x0 = x;
              if (x > x1) x1 = x;
              if (y < y0) y0 = y;
              if (y > y1) y1 = y;
            }
          }
          zones.push({ name, d, m0: z.m0, ramp: z.ramp, A: shift / FIELD.cap, reach, c0, c1, r0, r1, x0, x1, y0, y1 });
        }
        function held(z, t) {
          const c = z.c1 > z.c0 ? ss(z.c0, z.c1, t) : t >= z.c1 ? 1 : 0;
          if (c <= 0) return 0;
          const r = z.r1 > z.r0 ? ss(z.r0, z.r1, t) : t >= z.r1 ? 1 : 0;
          return c * (1 - r);
        }

        // the painters. The headings and the counts are painted in faces with
        // their own features (the headings' single-storey a, cv11; the
        // counts' tabular figures, tnum), loaded from the kit's own Inter file
        // at boot (a canvas cannot take font-feature-settings)
        const INK_FACES = [
          new FontFace('GTInkHead', 'url(kit/fonts/InterVariable.woff2)', { weight: '100 900', featureSettings: '"cv11" 1, "ss01" 0' }),
          new FontFace('GTInkCount', 'url(kit/fonts/InterVariable.woff2)', { weight: '100 900', featureSettings: '"tnum" 1' }),
        ];
        function loadInkFaces() {
          return Promise.all(
            INK_FACES.map(function (f) {
              return f.load().then(function (g) {
                document.fonts.add(g);
              });
            })
          );
        }
        const HEAD_SIZE = 160;
        const HEAD_BASE = 172 + 0.7275 * HEAD_SIZE; // 288.4
        function setHeadFont(ctx) {
          ctx.font = '500 ' + HEAD_SIZE + 'px GTInkHead';
          ctx.letterSpacing = (-0.035 * HEAD_SIZE).toFixed(2) + 'px';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'alphabetic';
        }
        // a heading's rise units (one mask each): its text, its colour and the
        // x of its first glyph's origin, from the seated left edge plus the
        // advance of everything before it (the DOM adds the letter spacing
        // after every character, spaces too, as the canvas does)
        const unitCtx = document.createElement('canvas').getContext('2d');
        function headingUnits(id) {
          const h = el(id);
          const left = parseFloat(h.style.left);
          setHeadFont(unitCtx);
          const units = [];
          let prefix = '';
          Array.prototype.forEach.call(h.childNodes, function (n) {
            if (n.nodeType === 1 && n.classList.contains('wm')) {
              units.push({ text: n.textContent, x: left + (prefix ? unitCtx.measureText(prefix).width : 0), fire: !!n.querySelector('.fire') });
            }
            prefix += n.textContent;
          });
          unitCtx.letterSpacing = '0px';
          return units;
        }
        function paintHeading(id) {
          return function (ctx) {
            setHeadFont(ctx);
            headingUnits(id).forEach(function (u) {
              ctx.fillText(u.text, u.x, HEAD_BASE);
            });
            ctx.letterSpacing = '0px';
          };
        }
        function paintCross(ctx, x, y) {
          ctx.fillRect(x - 12, y - 1, 25, 3);
          ctx.fillRect(x - 1, y - 12, 3, 25);
        }
        function paintDisc(ctx, cx, cy, r) {
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, 2 * Math.PI);
          ctx.fill();
        }
        // a count as makeCount sets it: the star at cap height, then the figure
        function paintCount(ctx, x, capTop, size, text) {
          const sh = size * 0.7275;
          const sw = (sh * 95.1) / 90.45;
          ctx.beginPath();
          for (let k = 0; k < 10; k++) {
            const ang = ((-90 + k * 36) * Math.PI) / 180;
            const rr = k % 2 ? 50 * 0.47 : 50;
            const px = x + ((50 + rr * Math.cos(ang) - 2.45) * sw) / 95.1;
            const py = capTop + ((52 + rr * Math.sin(ang) - 2) * sh) / 90.45;
            if (k) ctx.lineTo(px, py);
            else ctx.moveTo(px, py);
          }
          ctx.closePath();
          ctx.fill();
          ctx.font = '500 ' + size + 'px GTInkCount';
          ctx.letterSpacing = (-0.02 * size).toFixed(2) + 'px';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'alphabetic';
          ctx.fillText(text, x + sw + 0.24 * size, capTop + sh);
          ctx.letterSpacing = '0px';
        }
        // layer 3 as drawPiece sets it at (dx, dy, p): its cells
        function pieceCells(occ, dx, dy, p) {
          const top = lerp(CUTS[2] + dy, BLOCK.y0, p);
          const bottom = lerp(CUTS[3] + dy, BLOCK.y1, p);
          for (let y = top; y < bottom; y += CELL) {
            const v = (y - top) / (bottom - top);
            const hw = bandHalf(CUTS[2] + v * (CUTS[3] - CUTS[2]));
            cellsRow(occ, y, lerp(MOON.x + dx - hw, BLOCK.x0, p), lerp(MOON.x + dx + hw, BLOCK.x1, p));
          }
        }
        function paintPrint(ctx, occ) {
          // the printed moon with its layers at rest and spread, and the seams with their crosses past the limb
          const spread = [-42, -15, 15, 42];
          for (let b = 0; b < 4; b++) {
            for (let ys = CUTS[b]; ys < CUTS[b + 1]; ys += CELL) {
              const half = bandHalf(ys + 1.5) + 3;
              if (half <= 3) continue;
              for (let dy = Math.min(0, spread[b]); dy <= Math.max(0, spread[b]); dy += CELL) cellsRow(occ, ys + dy, MOON.x - half, MOON.x + half);
            }
          }
          for (let i = 1; i <= 3; i++) {
            const ya = CUTS[i];
            const yb = Math.round(CUTS[i] + (spread[i - 1] + spread[i]) / 2);
            ctx.fillRect(SEAM_X0 - 28, Math.min(ya, yb) - 12, SEAM_X1 - SEAM_X0 + 56, Math.abs(yb - ya) + 25);
          }
        }
        function paintSlide(ctx, occ) {
          // the piece's whole path (out of its slot, into the block, and home again) and the connector with its crosses
          for (let k = 0; k <= 90; k++) pieceCells(occ, (SLIDE * k) / 90, 15, 0);
          for (let k = 0; k <= 20; k++) pieceCells(occ, SLIDE, 15, k / 20);
          for (let k = 0; k <= 40; k++) pieceCells(occ, SLIDE * (1 - k / 40), 15 * (1 - k / 40), 1 - k / 40);
          const from = connFrom();
          ctx.fillRect(BLOCK.x1 + 24 - 24, CONN_Y - 12, from - BLOCK.x1 + 24, 25);
        }
        function paintRect(x0, y0, x1, y1) {
          return function (ctx) {
            ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
          };
        }

        const ALWAYS = -Infinity;
        const NEVER = Infinity;
        // fix round (the v4 critic): every zone clears and returns slowly (0.6
        // to 1.0 s, smoothstep) and inside a motion that is already running,
        // never on a start of its own in a hold. Each zone lists its four
        // times: clearing from c0 to c1, returning from r0 to r1 (equal times
        // switch it on a cut)
        function headZone(id, c0, c1, r0, r1) {
          addZone(id, paintHeading(id), HEAD_Z, c0, c1, r0, r1);
        }
        function objZone(name, paint, z, c0, c1, r0, r1) {
          addZone(name, paint, z, c0, c1, r0, r1);
        }
        function buildFieldZones() {
          // shot 1: the hook from the first frame (it gives way as its cells
          // travel to the moon), the moon (clearing as the cells leave), its
          // count, the shelves, the marks; all of them give the field back
          // through the recede
          headZone('h-one', ALWAYS, ALWAYS, MT0 + 0.2, MT_LAND + 0.3);
          objZone('moon1', function (ctx) {
            paintDisc(ctx, SHELFMOON.x, SHELFMOON.y, SHELFMOON.r + 1);
          }, OBJ_Z, MT0 - 0.2, MT0 + 0.5, RECEDE, RECEDE + 0.9);
          objZone('count', function (ctx) {
            paintCount(ctx, FD_COUNT.x, FD_COUNT.cap, FD_COUNT.size, ghCount(FUMADOCS_STARS));
          }, OBJ_Z, COUNT_AT - 0.6, COUNT_AT, RECEDE, RECEDE + 0.9);
          objZone('shelves', function (ctx) {
            SHELVES.forEach(function (s) {
              ctx.fillRect(s.x0, s.y - 4, s.x1 - s.x0, 9);
              paintCross(ctx, s.x0 - 16, s.y);
              paintCross(ctx, s.x1 + 16, s.y);
            });
          }, RULE_Z, SHELF_AT - 0.7, SHELF_AT, RECEDE, RECEDE + 0.9);
          marks.forEach(function (m) {
            objZone('mark-' + m.a.id, function (ctx) {
              ctx.drawImage(m.c, m.x, m.y, m.w, m.h);
              paintCount(ctx, m.x, m.cap, MARK_COUNT, ghCount(m.a.stars));
            }, OBJ_Z, m.t - 0.5, m.t + 0.05, RECEDE, RECEDE + 0.9);
          });
          // "Fuma Nama" clears during the pulse along shelf 2 and gives the
          // field back as the rain falls
          headZone('h-fuma', PULSE1, PULSE1 + 1.0, NAME_MT0 + 0.25, NAME_MT0 + 1.25);
          // the smoke's dark core rides the plume's lower edge here (a ring
          // about 100 px across, drifting from (1210, 352) at 19.5 s to (1150,
          // 325) at 25.0 s; v3 met it at the same film times, since the field's
          // clock is unchanged). The moon's zone hides it until the shelf
          // recedes and the docs page's zone from 24.54; between them this
          // zone holds the field off it, so the plume's edge curves into a dark
          // bay instead of carrying a ring beside the heap
          addZone('pile-core', function (ctx) {
            for (let k = 0; k <= 12; k++) paintDisc(ctx, lerp(1218, 1144, k / 12), lerp(360, 320, k / 12), 58);
          }, CORE_Z, RECEDE, RECEDE + 0.6, CREST_AT + 0.5, CREST_AT + 1.2);
          // shot 2: the heap's glyphs (the rain falls through the field; the
          // zone holds their cells), clearing with the name's dissolve
          objZone('heap', function (ctx) {
            heap.forEach(function (g) {
              paintDisc(ctx, g.cx, g.cy, 14);
            });
          }, OBJ_Z, NAME_MT0, NAME_MT0 + 0.9, SORT0 + 0.3, SORT1 + 0.3);
          // shot 3: the docs page's place, cleared while the crest settles and
          // given back as the page leaves; the file's glyphs
          objZone('page3', paintRect(PAGE3.x - 6, PAGE3.y - 6, PAGE3.x + 1600 * PAGE3.s + 6, PAGE3.y + 480 * PAGE3.s + 22), OBJ_Z, CREST_AT - 0.5, CREST_AT + 0.5, PAGE_OUT + 0.3, PAGE_OUT + 1.2);
          objZone('file', function (ctx) {
            slots.forEach(function (s) {
              paintDisc(ctx, s.x, s.y, 12);
            });
          }, OBJ_Z, PAGE_OUT + 0.2, SORT0 + 0.2, FILE_OUT + 0.3, FILE_END + 0.6);
          // shot 4: the glass moon (the printed smoke may almost touch it) and
          // the crosses at its limb, clearing with the file's tone-down; then
          // its print, the seams and the piece's path
          objZone('glass4', function (ctx) {
            paintDisc(ctx, MOON.x, MOON.y, MOON.r + 1);
            for (let i = 1; i <= 3; i++) paintCross(ctx, SEAM_X0 - 16, CUTS[i]);
          }, GLASS_Z, FILE_OUT, FILE_END + 0.1, MIX4 + 0.5, MIX4 + 1.0);
          // "Fumadocs" clears with the file's tone-down and returns as the layers finish parting
          headZone('h-fd', FILE_OUT, FILE_OUT + 0.85, H3_OUT + 0.3, H3_OUT + 1.3);
          addZone('print4', paintPrint, OBJ_Z, GLOW4, GLOW4 + 0.8, CUT5, CUT5);
          addZone('slide4', paintSlide, OBJ_Z, SLIDE0 - 0.45, SLIDE0 - 0.05, CUT5, CUT5);
          // shot 5: the page at full size from the cut, then the parted page at
          // 0.625 with its seam above the code panel, the connector, the part's
          // path and the panel; "Into your codebase" clears during the shrink.
          // After the cut back to the moon they hold the field off until the
          // pieces start returning, so the field comes back with that return
          addZone('page5a', paintRect(108, 432, 1836, 1004), OBJ_Z, CUT5, CUT5, JUST + 0.3, JUST + 1.3);
          addZone('page5b', function (ctx) {
            ctx.fillRect(108, 450, 1230 - 108, 400);
            ctx.fillRect(1180, 528, 1800 - 1180, 24);
            ctx.fillRect(1180, 528, 200, 270);
            ctx.fillRect(PANEL.x0 - 28, PANEL.y0 - 28, PANEL.x1 - PANEL.x0 + 56, PANEL.y1 - PANEL.y0 + 56);
          }, OBJ_Z, COPY, JUST, RETURN0, RETURN0 + 0.9);
          headZone('h-into', JUST, JUST + 1.0, RETURN0, RETURN0 + 0.9);
          // shot 6: the parted print and the piece's path home (from the cut back), then the moon's disc
          addZone('print6', paintPrint, OBJ_Z, CUT6, CUT6, RETURN0 + 0.4, RETURN0 + 1.3);
          addZone('slide6', paintSlide, OBJ_Z, CUT6, CUT6, RETURN0 + 0.3, RETURN0 + 1.2);
          addZone('disc6', function (ctx) {
            paintDisc(ctx, MOON.x, MOON.y, MOON.r + 1);
          }, OBJ_Z, CUT6, CUT6, MOVE7, MOVE7 + 0.6);
          // shot 7: the moon's path into the grant (clearing as the glass rises)
          // and its place there, the GT mark in the card's box (clearing during
          // the move), the connector (clearing as the mark forms)
          objZone('path9', function (ctx) {
            for (let k = 0; k <= 24; k++) {
              const e = k / 24;
              paintDisc(ctx, lerp(MOON.x, MOON9.x, e), lerp(MOON.y, MOON9.y, e), lerp(MOON.r, MOON9.r, e) + 1);
            }
          }, OBJ_Z, GLYPH_OUT, MOVE7, MOVE7 + 0.8, MOVE7 + 1.3);
          objZone('moon9', function (ctx) {
            paintDisc(ctx, MOON9.x, MOON9.y, MOON9.r + 1);
          }, OBJ_Z, MOVE7 + 0.4, MOVE7 + 0.8, NEVER, NEVER);
          objZone('gt9', function (ctx) {
            ctx.drawImage(el('logo-gt'), MARK.x0, MARK.y0, MARK.x1 - MARK.x0, MARK.y1 - MARK.y0);
          }, OBJ_Z, MOVE7 + 0.1, GT9, NEVER, NEVER);
          objZone('conn9', function (ctx) {
            ctx.fillRect(CONN9.x - 4, CONN9.y0, 9, CONN9.y1 - CONN9.y0 + 5);
            ctx.fillRect(CONN9.x1, CONN9.y1 - 4, CONN9.x - CONN9.x1 + 5, 9);
            paintCross(ctx, CONN9.x, CONN9.y0);
            paintCross(ctx, CONN9.x1, CONN9.y1);
          }, OBJ_Z, GT9 + 0.3, FIRST9, NEVER, NEVER);
        }

        // the weight at t: every zone in its window multiplies it, its
        // distance shifted by the smoke's plume-scale contrast
        function fieldWeights(t) {
          fieldW.fill(1);
          for (let k = 0; k < zones.length; k++) {
            const z = zones[k];
            const a = held(z, t);
            if (a <= 0) continue;
            const A = z.A;
            for (let y = z.y0; y <= z.y1; y++) {
              for (let x = z.x0, i = y * COLS + z.x0; x <= z.x1; x++, i++) {
                const d = z.d[i];
                if (d >= z.reach) continue;
                let w = 0;
                if (d > z.m0) {
                  const u = (d + A * (fieldLP[i] - fieldLP2[i]) - z.m0) / z.ramp;
                  w = u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u);
                }
                fieldW[i] *= 1 - a * (1 - w);
              }
            }
          }
        }
        // the film opens on the field at tone 0.35, full by 0.8 s in Bayer order;
        // it lowers its tone to 0 over the 0.4 s before the card
        function fieldAmount(t) {
          return (0.35 + 0.65 * ss(0, 0.8, t)) * (1 - ss(RECEDE9, CARD, t));
        }
        function drawField(t) {
          setFieldLook();
          gems.a.at(sField(t));
          readLum(gems.a.canvas, COLS, ROWS, fieldLum);
          for (let i = 0; i < NCELL; i++) {
            const s = Math.min(FIELD.cap, Math.pow(fieldLum[i], FIELD.gamma) * FIELD.gain);
            fieldS[i] = s * ss(KNEE[0], KNEE[1], s);
          }
          lowPass(fieldS, fieldLP, LP1);
          lowPass(fieldS, fieldLP2, LP2);
          fieldWeights(t);
          const amt = fieldAmount(t);
          for (let y = 0, i = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++, i++) {
              const w = fieldW[i];
              const v = (w >= 1 ? fieldS[i] : fieldS[i] - (1 - w) * BITE) * amt;
              if (v <= 0) {
                fpx32[i] = 0;
                continue;
              }
              const th = th8(x, y);
              fpx32[i] = FIELD_TONE[v * 2 > 1 + th ? 2 : v * 2 > th ? 1 : 0];
            }
          }
          foctx.putImageData(fimage, 0, 0);
          fctx.imageSmoothingEnabled = false;
          fctx.clearRect(0, 0, W, H);
          fctx.drawImage(foff, 0, 0, COLS * CELL, ROWS * CELL);
        }

        /* ------------------------------------------------------------ a heading's ink as 3 px cells */

        // the heading as the zones paint it, on the cell grid: every cell its

        function headingCells(id) {
          const cv = document.createElement('canvas');
          cv.width = W;
          cv.height = H;
          const cx = cv.getContext('2d', { willReadFrequently: true });
          setHeadFont(cx);
          headingUnits(id).forEach(function (u) {

          const d = cx.getImageData(0, by0 * CELL, W, (by1 - by0) * CELL).data;
          const src = [];
          for (let gy = by0; gy < by1; gy++) {
            for (let gx = 0; gx < COLS; gx++) {
              let a = 0;
              let g = 0;
              for (let j = 0; j < CELL; j++) {
                for (let i = 0; i < CELL; i++) {
                  const k = (((gy - by0) * CELL + j) * W + gx * CELL + i) * 4;
                  a += d[k + 3];
                  g += d[k + 1] * d[k + 3];

        /* ------------------------------------------------------------ shot 1: the moving type into the moon's print */

        // Moving type (MOTION.md transition d): once the hook's floor ends,
        // on "docs framework", its 3 px cells leave in reading order (0.2 s),
        // travel right on seeded paths (power2.inOut, 0.3 to 0.4 s each) and
        // land as the moon's Bayer print, a disc of r 270 at (1480, 522); the
        // disc's other cells raise their tone meanwhile. Each cell lands on one
        // of the disc's cells of lowest Bayer threshold, so the landed cells

        // the left of the disc. Every position is snapped to the cell grid.
        // The print is then the moon until the pulse lights it.
        const lockCells = [];
        for (let y = 0, i = 0; y < ROWS; y++) {

        const lockTone = new Float32Array(NCELL);
        const lockTarget = new Uint8Array(NCELL); // 1 where a hook cell lands
        let swarm = [];
        let swarmFrac = 0;
        function buildSwarm() {

            return th8(p % COLS, Math.floor(p / COLS)) - th8(q % COLS, Math.floor(q / COLS)) || p - q;
          });
          const tg = ranked.slice(0, src.length);

          });

            return p.x - q.x || p.y - q.y;
          });
          tg.sort(function (p, q) {
            return (p % COLS) - (q % COLS) || p - q;
          });
          const rnd = GTDither.rng(1307);
          let xmin = Infinity;
          let xmax = -Infinity;
          src.forEach(function (q) {
            xmin = Math.min(xmin, q.x);
            xmax = Math.max(xmax, q.x);
          });
          swarm = src.map(function (q, k) {
            const ti = tg[k];
            const bx = ti % COLS;
            const by = Math.floor(ti / COLS);
            const dx = bx - q.x;
            const dy = by - q.y;
            const len = Math.hypot(dx, dy) || 1;
            const bend = Math.sin(q.x / 63 + q.y / 43) * 11 + (rnd() - 0.5) * 6; // cells
            const mx = (q.x + bx) / 2 + (-dy / len) * bend;

          });
        }
        function drawMoonPrint1(t) {
          // the moon's print as its smoke lights it, the hook's cells in flight, and the print's mix into the glass
          readLum(gems.b.canvas, COLS, ROWS, lumGrid);
          for (let k = 0; k < lockCells.length; k++) {
            const i = lockCells[k];
            lockTone[i] = clamp(Math.pow(lumGrid[i], 1.05) * 1.02);
          }
          px32.fill(CLEAR);
          const rest = swarmFrac + (1 - swarmFrac) * ss(MT0 + 0.25, MT_LAND, t);
          const mix = ss(GLASS1, GLASS1 + 0.45, t);
          for (let k = 0; k < lockCells.length; k++) {
            const i = lockCells[k];
            if (lockTarget[i]) continue;
            const x = i % COLS;
            const y = (i - x) / COLS;
            const th = th8(x, y);
            if (th >= rest || th < mix) continue;
            px32[i] = STEP[stepOf(lockTone[i], th)];
          }
          for (let k = 0; k < swarm.length; k++) {
            const q = swarm[k];
            const u = clamp((t - q.leave) / q.fly);
            let gx = q.ax;
            let gy = q.ay;
            let c = q.c;
            if (u > 0) {
              const e = P2IO(u);
              const iv = 1 - e;
              gx = Math.round(iv * iv * q.ax + 2 * iv * e * q.mx + e * e * q.bx);
              gy = Math.round(iv * iv * q.ay + 2 * iv * e * q.my + e * e * q.by);
              if (u >= 0.5) {

            if (gx < 0 || gx >= COLS || gy < 0 || gy >= ROWS) continue;

        /* ------------------------------------------------------------ shot 2: the heap */

        // v3's glyph halftone at a larger grid (24 px, glyphs up to 26 px),
        // lowered 60 px so that it stands clear of the docs page's place
        const heapCanvas = el('heap');
        const hctx = heapCanvas.getContext('2d');
        const HEAP_CELL = 24;
        const HEAP_COLS = Math.ceil(W / HEAP_CELL);
        const HEAP_ROWS = Math.ceil(H / HEAP_CELL);
        const HEAP_LOWER = 60 / H;
        const heapLum0 = new Float32Array(HEAP_COLS * HEAP_ROWS);
        const heapLumT = new Float32Array(HEAP_COLS * HEAP_ROWS);
        const heap = [];
        // the docs page's place in shot 3 and its 60 px margin: no glyph lands there
        const KEEP_OUT = { x0: 100, x1: 1180, y0: 116, y1: 524 };
        const PUNCT = '{}()[];:=<>/*+.,\'"!&|_$'.split('');
        const LETTERS = 'constletfunctionreturnimportexport'.split('');
        function pickCode(r) {

        function buildHeap() {
          const rnd = GTDither.rng(611);
          let peakH = 0;

          for (let gy = 0; gy < HEAP_ROWS; gy++) {
            for (let gx = 0; gx < HEAP_COLS; gx++) {
              const pick = rnd();
              const rot = rnd();
              const jit = rnd();
              const u = (gx + 0.5) / HEAP_COLS;
              const v = (gy + 0.5) / HEAP_ROWS;
              const tp = 1 - hgt(u) + HEAP_LOWER;

              const cy = gy * HEAP_CELL + HEAP_CELL / 2;

              // most of the glyphs, land fastest (fix round: RAIN_CURVE 1.8, v4

              const hf = clamp((1 - v) / peakH);

        // Moving type again: "Fuma Nama" breaks into its 3 px cells, which
        // loosen over 0.24 s (each by up to 30 px, so the name is unreadable
        // by 20.70) and leave in reading order (20.46 to 20.66).
        // Each 24 px cluster of them falls on a seeded path that curves right
        // into the mound's left flank and base (power2.in, 0.5 to 0.8 s) and
        // resolves into one of the first glyphs to land there; the rest of the
        // rain follows from above.
        let nameClusters = [];
        let NAME_END = NAME_MT0;
        function buildNameCells() {
          const src = headingCells('h-fuma');
          const by = {};
          src.forEach(function (q) {
            const key = (q.x >> 3) + ',' + (q.y >> 3);
            (by[key] = by[key] || []).push(q);
          });
          const clusters = Object.keys(by).map(function (k) {
            const cs = by[k];
            let sx = 0;
            let sy = 0;
            cs.forEach(function (q) {
              sx += q.x;
              sy += q.y;
            });

            .slice(0, clusters.length)

          nameClusters = clusters.slice(0, flank.length).map(function (c, k) {
            const g = flank[k];
            const leave = NAME_MT0 + 0.2 * ((c.cx - x0) / (x1 - x0 || 1)) + rnd() * 0.015;
            const fly = 0.5 + 0.3 * rnd();
            g.fromName = true;

              ay: c.cy,

              const gy = Math.round(py + (q.oy + q.sy * brk) * keep);

            }
          }

        }

        /* ------------------------------------------------------------ shot 3: the file, built from the heap's glyphs */

        // v3's file layout (x 975 to 1736, top y 141, 30 px pitch, its
        // indentation and blank lines); each token bar is now a run of the
        // heap's own glyphs at 22 px on the bar's 21 px unit, at the bar's
        // place and length. It reads as code; no line is a real program.
        const FILE = { x0: 975, y0: 141, lh: 30, unit: 21, maxw: 762, size: 22 };
        const INDENT = [0, 0, 1, 1, 2, 2, 3, 3, 2, 1, -1, 0, 1, 1, 2, 3, 3, 4, 3, 2, 1, 0, -1, 0, 1, 1, 0];
        const slots = [];
        // the file's light: mount A at half rate, its lit band across the middle block through the hold
        function sFile(t) {
          return 3.77 + 0.5 * (t - (SORT1 + 0.5));
        }
        function buildFile() {
          const rnd = GTDither.rng(2016);
          let line = 0;
          for (let r = 0; r < INDENT.length; r++) {
            const ind = INDENT[r];
            if (ind < 0) continue; // a blank line between blocks
            let xx = FILE.x0 + ind * 2 * FILE.unit;
            const end = Math.min(FILE.x0 + FILE.maxw, xx + FILE.unit * Math.floor(6 + rnd() * 26));
            const y0 = FILE.y0 + r * FILE.lh;
            while (xx < end) {
              const w = FILE.unit * Math.max(1, Math.floor(1 + rnd() * 7));
              const x1 = Math.min(end, xx + w);
              if (x1 - xx < FILE.unit) break; // no slivers at a line's end
              const n = Math.max(1, Math.round((x1 - xx) / FILE.unit));
              for (let j = 0; j < n; j++) {
                const x = xx + FILE.unit * (j + 0.5);
                slots.push({ x, y: y0 + 11, line, gx: Math.round((x - FILE.x0) / FILE.unit), g: null, start: 0 });
              }
              xx = x1 + FILE.unit * (rnd() < 0.2 ? 1 : 0.5);
            }
            line++;
          }

          // takes the next run of them, left to right, so the top of the heap
          // lifts into the top of the file

            .filter(function (g) {

              return p.cx - q.cx;
            });
            k += row.length;
            row.forEach(function (s, j) {
              s.g = take[j];
              take[j].slot = s;
            });
          }
          const rnd2 = GTDither.rng(3301);
          slots.forEach(function (s, j) {
            s.start = SORT0 + (SORT1 - SORT0 - 0.55) * (j / (slots.length - 1));
            s.bend = (rnd2() - 0.5) * 60;

          // the file's light at each slot (mount A's lumGrid, read by draw)

        /* ------------------------------------------------------------ shots 4 and 6: the moon's print */

        function moonState(t) {

          const spread = [-42, -15, 15, 42];

          const st = moonState(t);

          // shot 6: each 36 px block of the print leaves as its glyph lands on it
          if (t >= GLYPH0 && t >= CUT6) {
            for (let i = 0, n = COLS * ROWS; i < n; i++) if (printGate[i] <= t) homeTone[i] = 0;
          }
          px32.fill(CLEAR);
          if (st.mix < 1) {
            // the glass turns to its print cell by cell, in Bayer order (outside the disc the print is clear)
            for (let y = 0, i = 0; y < ROWS; y++) {
              for (let x = 0; x < COLS; x++, i++) {
                if (discMask[i] <= 0) continue;
                const th = th8(x, y);
                if (th < st.mix) px32[i] = STEP[stepOf(homeTone[i], th)];

            blit();
            return;
          }
          // the layers, each printed at home and carried by its shift, so the print travels with its matter
          for (let b = 0; b < 4; b++) {
            if (b === 2 && st.detached) continue;
            const dy = st.sh[b] / CELL;
            for (let ys = CUTS[b] / CELL; ys < CUTS[b + 1] / CELL; ys++) {
              const yd = ys + dy;
              if (yd < 0 || yd >= ROWS) continue;
              const half = bandHalf(ys * CELL + 1.5) + 3;
              const x0 = Math.max(0, Math.floor((MOON.x - half) / CELL));
              const x1 = Math.min(COLS, Math.ceil((MOON.x + half) / CELL));
              for (let x = x0; x < x1; x++) {
                const tone = homeTone[ys * COLS + x];

        }
        // layer 3 as a piece: its band shape at displacement (dx, dy), turned
        // toward BLOCK by p; every cell reads the band's own tone, and the
        // Bayer tile is anchored to the piece, so at p = 0 it is the band itself
        function drawPiece(st) {
          const dy = st.sh[2];
          const dx = st.dx;
          const p = st.p;
          const by0 = CUTS[2];
          const by1 = CUTS[3];
          const top = lerp(by0 + dy, BLOCK.y0, p);
          const bottom = lerp(by1 + dy, BLOCK.y1, p);
          const dxc = dx / CELL;
          const dyc = dy / CELL;
          const r0 = Math.max(0, Math.floor(top / CELL));
          const r1 = Math.min(ROWS, Math.ceil(bottom / CELL));
          for (let oy = r0; oy < r1; oy++) {
            const v = (oy * CELL + 1.5 - top) / (bottom - top);
            if (v < 0 || v >= 1) continue;
            const ys = by0 + v * (by1 - by0);
            const hw = bandHalf(ys);
            const left = lerp(MOON.x + dx - hw, BLOCK.x0, p);
            const right = lerp(MOON.x + dx + hw, BLOCK.x1, p);
            if (right - left < 1) continue;
            const syc = Math.min(ROWS - 1, Math.floor(ys / CELL));
            const c0 = Math.max(0, Math.floor(left / CELL));
            const c1 = Math.min(COLS, Math.ceil(right / CELL));
            for (let ox = c0; ox < c1; ox++) {
              const u = (ox * CELL + 1.5 - left) / (right - left);
              if (u < 0 || u >= 1) continue;
              const xs = MOON.x - hw + u * 2 * hw;
              const sxc = Math.min(COLS - 1, Math.max(0, Math.floor(xs / CELL)));
              const tone = homeTone[syc * COLS + sxc];
              px32[oy * COLS + ox] = STEP[stepOf(tone, th8(ox - dxc, oy - dyc))];
            }
          }
        }
        // the piece's right edge at screen height y
        function pieceRight(st, y) {
          const top = lerp(CUTS[2] + st.sh[2], BLOCK.y0, st.p);
          const bottom = lerp(CUTS[3] + st.sh[2], BLOCK.y1, st.p);
          const v = clamp((y - top) / (bottom - top));
          const hw = bandHalf(CUTS[2] + v * (CUTS[3] - CUTS[2]));
          return lerp(MOON.x + st.dx + hw, BLOCK.x1, st.p);
        }

        /* ------------------------------------------------------------ the line work */

        const inkCanvas = el('ink');
        const ictx = inkCanvas.getContext('2d');
        // the context the line helpers draw into (the ink canvas, the page canvas or a tone layer)
        let LX = ictx;
        // the doubled line at video scale: a 9 px white gauge under a 3 px
        // black core, drawn as whole-pixel rows, so both threads are 3 px and
        // crisp. pulse: an optional [p0, p1] span drawn as a solid 9 px fire
        // band over the whole gauge (its core filled too) inside a soft fire
        // glow 8 px deep (fix round: v4's first cut turned only the two 3 px
        // threads fire, which a phone shrinks to under 1 px)
        function pulseGlow(x0, x1, y0, y1) {
          // the glow: eight 1 px rings of fire, fading out, around the band
          LX.fillStyle = HEX.fire;
          for (let k = 8; k >= 1; k--) {
            LX.globalAlpha = 0.07 + 0.05 * (8 - k);
            LX.fillRect(x0 - k, y0 - k, x1 - x0 + 2 * k, y1 - y0 + 2 * k);
          }
          LX.globalAlpha = 1;
        }
        function doubledH(x0, x1, y, pulse) {
          const a = Math.round(Math.min(x0, x1));
          const b = Math.round(Math.max(x0, x1));
          if (b - a < 1) return;
          const yr = Math.round(y);
          let p0 = 0;
          let p1 = 0;
          if (pulse) {

            p1 = Math.min(b, Math.round(pulse[1]));

          LX.fillStyle = HEX.black;
          LX.fillRect(a, yr - 1, b - a, 3);

          LX.fillRect(xr - 4, a, 9, b - a);
          LX.fillStyle = HEX.black;
          LX.fillRect(xr - 1, a, 3, b - a);

        // a doubled line along an axis-aligned path with square corners, drawn

        function doubledPath(pts, upto, pulse) {
          const segs = [];

            const len = Math.abs(pts[k][0] - pts[k - 1][0]) + Math.abs(pts[k][1] - pts[k - 1][1]);
            segs.push({ a: pts[k - 1], b: pts[k], s0: acc, s1: acc + len, len });

              const f0 = (u0 - sg.s0) / sg.len;

                xa -= dir * ext0;
                xb += dir * ext1;

                yb += dir * ext1;

          const lit = pulse && Math.min(upto, pulse[1]) - Math.max(0, pulse[0]) >= 1;
          if (lit) {

            for (let k = 8; k >= 1; k--) {

            }
            LX.globalAlpha = 1;
          }

          rects(0, upto, 1, HEX.black);

        }
        // a registration cross, 3 px arms, 25 px across; f (0..1) draws its arms out of its centre
        function cross(x, y, f) {

          if (a < 1) return;
          LX.fillStyle = HEX.white;
          LX.fillRect(Math.round(x) - a, Math.round(y) - 1, 2 * a + 1, 3);
          LX.fillRect(Math.round(x) - 1, Math.round(y) - a, 3, 2 * a + 1);
        }
        // the slot's outline: layer 3's band shape at home, as a polyline from
        // its upper left corner clockwise, drawn once as a 3 px fire line
        function slotPath(dy) {
          const pts = [];
          const y0 = CUTS[2] + dy - 1.5;
          const y1 = CUTS[3] + dy + 1.5;
          const hl = bandHalf(CUTS[2]);
          pts.push([MOON.x - hl, y0], [MOON.x + hl, y0]);
          for (let k = 1; k <= 24; k++) {
            const yy = lerp(y0, y1, k / 24);
            pts.push([MOON.x + bandHalf(yy - dy) + 1.5, yy]);
          }
          const hb = bandHalf(CUTS[3]);
          pts.push([MOON.x - hb, y1]);
          for (let k = 23; k >= 0; k--) {
            const yy = lerp(y0, y1, k / 24);

          }

        }
        function strokePrefix(pts, f) {
          let total = 0;
          for (let k = 1; k < pts.length; k++) total += Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]);

            const seg = Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]);

            } else {

            }

        }
        // the connector's slot end: 24 px left of the slot's edge on its centre line
        function connFrom() {
          return Math.round(MOON.x - bandHalf(CONN_Y - 15) - 24);
        }
        // shot 4: the crosses and seams on "that developers" (0.2 s apart),
        // then, as layer 3 slides on "and", the slot's fire outline and the
        // connector, whose free end follows the piece's right edge to the block
        function drawMoonLines4(t) {
          const st = moonState(t);
          for (let i = 1; i <= 3; i++) {
            const t0 = CROSS4 + CROSS4_GAP * (i - 1);
            if (t < t0) continue;
            const y = Math.round(CUTS[i] + (st.sh[i - 1] + st.sh[i]) / 2);
            cross(SEAM_X0 - 16, y, EXPO(prog(t, t0, 0.15)));
            // fix round: power3.out over 0.5 s (v4 first cut: expo.out 0.45)
            const e = P3(prog(t, t0, SEAM_D));

            if (e > 0.995) cross(SEAM_X1 + 16, y);
          }
          if (t >= SLIDE0) {
            const from = connFrom();
            const to = BLOCK.x1 + 24;
            if (t >= SLIDE0 + 0.1) {
              LX.strokeStyle = HEX.fire;
              LX.lineWidth = 3;
              LX.lineJoin = 'miter';
              strokePrefix(slotPath(st.sh[2]), EXPO(prog(t, SLIDE0 + 0.1, 0.5)));
            }
            const edgeX = pieceRight(st, CONN_Y);
            const head = clamp(edgeX + 24, to, from);
            // the slot's cross (x from + 4 to from + 28) opens as the piece's right edge clears it
            cross(from + 16, CONN_Y, clamp((from + 4 - edgeX) / 24));
            doubledH(head, from, CONN_Y);
            if (st.p > 0.995) cross(to - 16, CONN_Y);
          }
        }
        // shot 6: the seams, the slot's outline and the connector as shot 4
        // left them, toned out on "started" (0.3 s) as the pieces return
        function drawMoonLines6(t) {
          const p = 1 - ss(RETURN0, RETURN0 + 0.3, t);
          if (p <= 0) return;
          L1.x.setTransform(1, 0, 0, 1, 0, 0);
          L1.x.clearRect(0, 0, W, H);
          LX = L1.x;
          const sh = [-42, -15, 15, 42];
          for (let i = 1; i <= 3; i++) {
            const y = Math.round(CUTS[i] + (sh[i - 1] + sh[i]) / 2);
            cross(SEAM_X0 - 16, y);
            doubledH(SEAM_X0, SEAM_X1, y);
            cross(SEAM_X1 + 16, y);
          }
          LX.strokeStyle = HEX.fire;
          LX.lineWidth = 3;
          LX.lineJoin = 'miter';
          strokePrefix(slotPath(15), 1);
          const from = connFrom();
          const to = BLOCK.x1 + 24;
          cross(from + 16, CONN_Y);
          doubledH(to, from, CONN_Y);
          cross(to - 16, CONN_Y);
          toneLayer(L1.x, p);
          LX = ictx;
          ictx.drawImage(L1.c, 0, 0);
        }

        /* ------------------------------------------------------------ shot 1: the shelf */

        // two doubled-line shelves out of crosses at x 144; shelf 1 ends 44 px
        // short of the moon's limb at its centre height, shelf 2 runs under it
        const SHELVES = [
          { y: 532, x0: 160, x1: 1150 },
          { y: 822, x0: 160, x1: 1760 },
        ];
        // the adopters in a 3 by 2 grid: columns at x 160, 490 and 820; row 1's
        // marks stand on y 502 with their counts hanging from y 562, row 2's on y 792 and y 852
        const GRID_X = [160, 490, 820];
        const GRID_ROW = [
          { feet: 502, cap: 562 },
          { feet: 792, cap: 852 },
        ];
        const MARK_COUNT = 64;
        // the adopters in the post's order, their GitHub stars on 2026-10-02
        // (from Kevin), each mark's drawn height v3's optical size times 1.25;
        // ar is each SVG's viewBox aspect
        const ADOPTERS = [
          { id: 'turborepo', stars: 31159, h: 130, ar: 1, round: true },
          { id: 'shadcn-ui', stars: 124997, h: 122, ar: 1 },
          { id: 'better-auth', stars: 30152, h: 93, ar: 361 / 259 },
          { id: 'unkey', stars: 5456, h: 115, ar: 256 / 254 },
          { id: 'orama', stars: 10569, h: 122, ar: 1, round: true },
          { id: 'gt', stars: 1065, h: 110, ar: 1197 / 755 },

        // Fumadocs' own count, left-aligned on the moon's left limb, under shelf 2
        const FD_COUNT = { x: SHELFMOON.x - SHELFMOON.r, cap: 852, size: 92 };
        // GitHub's rounding: under 1,000 as is; to 100,000 one decimal and k; above, whole k
        function ghCount(n) {
          if (n < 1000) return String(Math.round(n));
          if (n < 100000) return (Math.round(n / 100) / 10).toFixed(1) + 'k';
          return Math.round(n / 1000) + 'k';
        }
        const marks = [];
        function buildMarks() {
          ADOPTERS.forEach(function (a, i) {
            const img = el('logo-' + a.id);
            const w = Math.round(a.h * a.ar);
            const c = document.createElement('canvas');
            c.width = w;
            c.height = a.h;
            c.getContext('2d').drawImage(img, 0, 0, w, a.h);
            const row = GRID_ROW[Math.floor(i / 3)];
            const x = GRID_X[i % 3];
            let ink = c;
            if (a.id === 'gt') {
              // the GT mark in the material's fire, the same drawing
              ink = document.createElement('canvas');
              ink.width = w;
              ink.height = a.h;
              const fx = ink.getContext('2d');
              fx.drawImage(c, 0, 0);
              fx.globalCompositeOperation = 'source-in';
              fx.fillStyle = HEX.fire;
              fx.fillRect(0, 0, w, a.h);
            }
            marks.push({ a, c: ink, w, h: a.h, x, y: row.feet - a.h + (a.round ? 3 : 0), cap: row.cap, t: MARK_AT[i], count: null });
          });
        }
        // a mark at tone p (0..1): cells of the frame's 3 px grid switch on in Bayer order as p rises
        const tmpC = document.createElement('canvas');
        const mskC = document.createElement('canvas');
        function toneMark(m, p) {
          if (p <= 0) return;
          if (p >= 1) {
            LX.drawImage(m.c, m.x, m.y);
            return;
          }
          const gx0 = Math.floor(m.x / CELL);
          const gy0 = Math.floor(m.y / CELL);
          const cols = Math.ceil((m.x + m.w) / CELL) - gx0;
          const rows = Math.ceil((m.y + m.h) / CELL) - gy0;
          mskC.width = cols;
          mskC.height = rows;
          const mx = mskC.getContext('2d');
          const id = mx.createImageData(cols, rows);
          for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) if (p > th8(gx0 + i, gy0 + j)) id.data[(j * cols + i) * 4 + 3] = 255;
          mx.putImageData(id, 0, 0);
          tmpC.width = cols * CELL;
          tmpC.height = rows * CELL;
          const tx = tmpC.getContext('2d');
          tx.clearRect(0, 0, tmpC.width, tmpC.height);
          tx.drawImage(m.c, m.x - gx0 * CELL, m.y - gy0 * CELL);

          tx.imageSmoothingEnabled = false;
          tx.drawImage(mskC, 0, 0, cols * CELL, rows * CELL);

        }
        // GitHub's star as a sharp five-point star in fire (the brand draws no rounded corners)
        function starSVG(px) {
          const R = 50;

            const ang = ((-90 + k * 36) * Math.PI) / 180;
            const rr = k % 2 ? r : R;
            pts.push((50 + rr * Math.cos(ang)).toFixed(2) + ' ' + (52 + rr * Math.sin(ang)).toFixed(2));
          }
          const sv = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          sv.setAttribute('viewBox', '2.45 2 95.1 90.45');
          sv.setAttribute('class', 'star');
          sv.style.height = px.toFixed(2) + 'px';
          sv.style.width = ((px * 95.1) / 90.45).toFixed(2) + 'px';
          sv.innerHTML = '<path fill="' + HEX.fire + '" d="M' + pts.join('L') + 'Z"/>';
          return sv;
        }
        // a count: the star at cap height, then the figure, left-aligned on x,

        function makeCount(x, capTop, size, text) {
          const d = document.createElement('div');
          d.className = 'count';
          d.setAttribute('data-layout-allow-overflow', ''); // the figure waits inside its mask until it rises
          d.style.left = (x - 0.05 * size).toFixed(2) + 'px';
          d.style.fontSize = size + 'px';

          inner.appendChild(starSVG(size * 0.7275));

          // "of his schoolwork": the marks and both shelves lower their tone to 0 in Bayer order
          const out = 1 - ss(RECEDE, SHELF_OUT, t);

            L1.x.clearRect(0, 0, W, H);
            LX = L1.x;
            const p = P3(prog(t, SHELF_AT, 0.9));
            const fc = EXPO(prog(t, SHELF_AT, 0.12));

            let pulse = null;

              const x0 = gt.x + gt.w / 2;

              if (p > 0.995) cross(s.x1 + 16, s.y);
