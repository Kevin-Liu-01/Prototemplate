<g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="4.64" font-weight="500" opacity="0.85"><text textLength="12.00" x="292.88" y="129.8" text-anchor="end">10.99</text><text textLength="11.63" x="308.15" y="137.53" text-anchor="middle">21.97</text><text textLength="9.14" x="352.55" y="52">7.56</text><text textLength="9.19" x="352.55" y="15.18">27.2</text><text textLength="11.99" x="369.39" y="47.72" text-anchor="middle" transform="rotate(-90 369.39 47.72)">12.96</text><text textLength="9.63" x="352.55" y="74.68">9.72</text><text textLength="5.78" x="348.42" y="106" text-anchor="middle" transform="rotate(-90 348.42 106)">28</text><text textLength="13.08" x="120.93" y="130.31" text-anchor="middle">32.04</text><text textLength="12.13" x="352.55" y="35.8">14.04</text><text textLength="7.77" x="379.36" y="61.58">120</text><text textLength="3.00" x="-1.01" y="1.55" text-anchor="end">0</text><text textLength="9.19" x="-1.01" y="28.75" text-anchor="end">27.2</text><text textLength="12.09" x="-1.01" y="42.79" text-anchor="end">41.24</text><text textLength="13.06" x="-1.01" y="48.19" text-anchor="end">46.64</text><text textLength="9.95" x="-1.01" y="55.75" text-anchor="end">54.2</text><text textLength="12.97" x="-1.01" y="69.79" text-anchor="end">68.24</text><text textLength="12.01" x="-1.01" y="79.51" text-anchor="end">77.96</text><text textLength="5.78" x="-1.01" y="93.55" text-anchor="end">92</text><text textLength="7.77" x="-2.35" y="122.32" text-anchor="end">120</text><text textLength="15.49" x="272.99" y="129.89" text-anchor="end">270.08</text><text textLength="15.70" x="334.33" y="-6.05" text-anchor="middle">336.83</text><text textLength="13.14" x="66.07" y="-6.16" text-anchor="middle">64.94</text><text textLength="12.54" x="80.79" y="-3.92">78.89</text><text textLength="13.64" x="102.7" y="-6.16" text-anchor="middle">101.57</text><text textLength="12.66" x="117.92" y="-5.95">115.61</text><text textLength="14.32" x="133.19" y="-6.6">129.74</text><text textLength="12.05" x="138.74" y="-12.22" text-anchor="middle">136.4</text><text textLength="13.59" x="162.91" y="-6.16" text-anchor="middle">161.78</text><text textLength="14.28" x="177.72" y="-3.92">175.82</text><text textLength="12.04" x="202.33" y="-6.16" text-anchor="middle">201.2</text><text textLength="12.80" x="31.32" y="-6.14" text-anchor="middle">29.92</text><text textLength="15.28" x="277.32" y="-6.14" text-anchor="middle">275.92</text><text textLength="15.89" x="351.56" y="-7.08" text-anchor="middle">349.92</text><text textLength="14.70" x="294.45" y="-8.78">24.27°</text><text textLength="12.09" x="178.33" y="134.28">11.31°</text><text textLength="6.97" x="2.09" y="130.06">14°</text><text textLength="6.57" x="21.77" y="13.72" text-anchor="end">r12</text><text textLength="13.58" x="59.86" y="126.89" text-anchor="middle">r13.32</text><text textLength="32.98" x="97.93" y="137.72" text-anchor="middle">rx13.41 ry13.32</text><text textLength="178.57" x="-2.97" y="148.88">hatching: 6 lines 10.99 thick every 21.97, lines 270.08 (at y 120) to 336.83 (at y 0)</text><text textLength="265.89" x="-2.97" y="154.55">A slanted line is labelled with its x at y 0, the top of the ink, or at y 120, the bottom, where the line does not reach the top.</text><text textLength="351.09" x="-2.97" y="160.22">Plate: W 320 by H 120, corners R 12 in 12 steps on the four circles drawn here, skewed about its bottom edge by x − K y + K H with K = tan 14° (K H = 29.92), so</text><text textLength="294.40" x="-2.97" y="165.89">its sides lean 14° and upright x 0, 246 and 320 cross y 0 at 29.92, 275.92 and 349.92 (Prototemplate scripts/build/speed-marks.mjs).</text><text textLength="344.53" x="-2.97" y="171.56">Stripes: bars 9 wide every 18, turned 35° in the upright plate, kept to x 246 to 320 and to the plate. The skew keeps horizontal runs: 9 / cos 35° = 10.99 wide</text><text textLength="118.11" x="-2.97" y="177.23">every 18 / cos 35° = 21.97, at 24.27° from the vertical.</text><text textLength="350.67" x="-2.97" y="182.91">Letters: GT in Orbitron (orbitron-900.woff2) at size 90 from x 30 on the baseline y 92, cap height 64.8 (capHeight 720 of 1000 units in orbitron-900.woff2), cut</text><text textLength="351.70" x="-2.97" y="188.58">out by a mask under matrix(1 0 -0.2 1 29.9 0): the generator writes −K as -0.2 and K H as 29.9, so the letters lean 11.31° (atan 0.2) where the plate leans 14°, and</text><text textLength="85.45" x="-2.97" y="194.25">a letter's x at y 0 is its own x plus 29.9.</text><text textLength="341.22" x="-2.97" y="199.92">The G's outer corners (orbitron-900.woff2, font units): two quarter circles of radius 148 about (204, 148) and (204, 572), r 13.32 at size 90 and two quarter</text><text textLength="341.26" x="-2.97" y="205.59">ellipses 149 across and 148 down about (627, 572) and (627, 148), rx 13.41 and ry 13.32 at size 90. They are drawn under the letters' matrix; the path writes</text><text textLength="119.52" x="-2.97" y="211.27">each corner as three quadratic curves to one decimal.</text><text textLength="351.44" x="-2.97" y="216.94">These labels are the generator's values where the path, written to one decimal, reads otherwise (its reading in brackets): 29.92 (29.89), 275.92 (275.9), 349.92</text><text textLength="344.35" x="-2.97" y="222.61">(349.89), 270.08 (270.1), 336.83 (336.84); 14° (13.99°); 10.99 and 21.97 (11 and 22). The letters' edges and the widths between them carry the font's values:</text><text textLength="305.97" x="-2.97" y="228.28">each glyph's outline in font units × size / unitsPerEm, placed as type() places it; the path writes them to one decimal (41.24 is written 41.2).</text></g>
</svg>
