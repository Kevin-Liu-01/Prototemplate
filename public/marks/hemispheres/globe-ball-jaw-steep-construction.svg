<g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="500" opacity="0.85"><text textLength="18.92" x="50.92" y="49.93" text-anchor="end">r104</text><text textLength="15.08" x="184.99" y="10.16" text-anchor="middle">52°</text><text textLength="11.44" x="89.76" y="238.8" text-anchor="middle">30</text><text textLength="9.41" x="18.35" y="148.49" text-anchor="end">16</text><text textLength="20.09" x="25.69" y="88.48" text-anchor="end">x120</text><text textLength="20.05" x="28.79" y="180.88" text-anchor="end">x136</text><text textLength="16.48" x="92.28" y="22.96" text-anchor="middle">x90</text><text textLength="20.11" x="178.96" y="233.14" text-anchor="middle">y128</text><text textLength="19.98" x="56.14" y="217.95" text-anchor="end">y158</text><text textLength="14.00" x="208.99" y="209.09">r74</text><text textLength="35.14" x="219.59" y="193.73">flat r104</text><text textLength="19.95" x="60.93" y="15.64" text-anchor="middle">x128</text><text textLength="236.80" x="4" y="251.34">sphere seen by an orthographic camera: pitch 22°, yaw</text><text textLength="166.96" x="4" y="262.34">18°, roll 52° (sketch/src/globe/gen.mjs)</text><text textLength="228.96" x="4" y="273.34">the circle r104 is fitted to the path's vertices: the path</text><text textLength="137.17" x="4" y="284.34">draws it as short straight pieces</text><text textLength="227.25" x="4" y="295.34">paint: t-west-jaw on the sphere's half facing pitch 0°,</text><text textLength="240.05" x="4" y="306.34">yaw 0°: flat x = c lies in the plane x = (c - 128)/104, y = c</text><text textLength="243.38" x="4" y="317.34">in y = (128 - c)/104, r74 in z = √(1 - (74/104)²); y128 is the</text><text textLength="149.56" x="4" y="328.34">equator; flat r104 is the half's edge</text><text textLength="237.36" x="4" y="339.34">far half: ink except the split, -8/104 &lt; x &lt; 8/104 (x120 to</text><text textLength="217.27" x="4" y="350.34">x136, 8 either side of x128, the split's centre plane)</text>