text><text textLength="204.88" x="4" y="328.63">them 240.003 to 240.006 and −1.997 to −1.995.</text><text textLength="240.71" x="4" y="339.63">sketch/src/studs/gen.mjs studs-thin-eq: G_THIN(128) (a</text><text textLength="237.90" x="4" y="350.63">bar y 128 to 146 from the gap to x 78, a stem x 78 to 96)</text><text textLength="242.11" x="4" y="361.63">and T_THIN(128) (a prong y 110 to 128 stopping at x 183),</text><text textLength="202.58" x="4" y="372.63">ring 18 (r104, r86), gap 24 (x 116 to 140), turned</text><text textLength="174.32" x="4" y="383.63">SKETCH_TILT 37° clockwise about C 128</text><text textLength="239.79" x="4" y="394.63">studs (VERSIONS['studs-thin-eq'].stud): 24 wide on the</text><text textLength="232.75" x="4" y="405.63">turned axis, from r0 112 to r1 130, so y 16 and −2 north,</text><text textLength="81.14" x="4" y="416.63">240 and 258 south</text></g>
