ntre the path's arcs fit, 112.695,</text><text textLength="293.25" x="2" y="348.33">112.696, and about 112.69, 112.70, where the circles are drawn, along</text><text textLength="271.02" x="2" y="359.33">either turned axis; each label keeps the decimals every reading</text><text textLength="45.34" x="2" y="370.33">agrees on.</text><text textLength="291.14" x="2" y="381.33">120.6, 112.7 and 142.3 are given to one decimal: the path reads them</text><text textLength="269.57" x="2" y="392.33">120.594 to 120.595, 112.695 to 112.700 and 142.323 to 142.328.</text><text textLength="257.19" x="2" y="403.33">the base t-west-jaw is built by lower-t/r2/src/west/build.mjs</text><text textLength="187.78" x="2" y="414.33">base x 90, 120, 136 read 75.17, 104.80, 120.6</text><text textLength="137.45" x="2" y="425.33">base y 128, 158 read 112.7, 142.3</text><text textLength="251.74" x="2" y="436.33">base r 74, 104, 117, 135 give r73.07, r102.69, r115.53, r133.31</text><text textLength="259.14" x="2" y="447.33">the generator makes the rim and the strokes one width, 30 ×</text><text textLength="276.99" x="2" y="458.33">0.98745 = 29.6235; the path's written radii read the rim as 29.62</text><text textLength="168.83" x="2" y="469.33">and its edges read the strokes as 29.63</text></g>
