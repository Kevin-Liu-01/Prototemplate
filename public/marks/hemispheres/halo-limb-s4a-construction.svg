<g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="500" opacity="0.85"><text textLength="24.77" x="234.23" y="216.34" text-anchor="middle">29.63</text><text textLength="22.89" x="-4.14" y="219.44" text-anchor="end">15.80</text><text textLength="30.16" x="-24.51" y="92.01" text-anchor="end">r133.31</text><text textLength="29.81" x="-18.27" y="68.72" text-anchor="end">r115.53</text><text textLength="32.38" x="-8.09" y="46.87" text-anchor="end">r102.69</text><text textLength="27.16" x="6.74" y="22.79" text-anchor="end">r73.07</text><text textLength="26.83" x="-26.74" y="-27.74" text-anchor="end">112.69</text><text textLength="16.78" x="11.16" y="-31.74" text-anchor="end">83.1</text><text textLength="21.05" x="203.06" y="-31.74">75.17</text><text textLength="29.09" x="244.96" y="-31.74">104.80</text><text textLength="23.00" x="253.63" y="-12.24">120.6</text><text textLength="24.67" x="226.69" y="22.91">29.62</text><text textLength="20.98" x="102.3" y="-24.99" text-anchor="end">17.78</text><text textLength="23.34" x="66.13" y="-17.75" text-anchor="end">12.84</text><text textLength="15.42" x="173.66" y="-35.49" text-anchor="middle">45°</text><text textLength="19.31" x="253.33" y="148.26">190°</text><text textLength="282.12" x="2" y="262.01">sketch/src/halo/gen.mjs: t-west-limb with a halo 13 outside its rim</text><text textLength="285.30" x="2" y="273.01">r104, 18 wide, spanning 190° centred on the mark's east; all turned</text><text textLength="124.80" x="2" y="284.01">45° clockwise about 128, 128</text><text textLength="285.16" x="2" y="295.01">then scaled by 0.98745 and centred on 112.6947, 112.6947 to sit 10</text><text textLength="245.99" x="2" y="306.01">inside the box: each length is the base's times 0.98745; a</text><text textLength="266.10" x="2" y="317.01">turned-frame coordinate is 112.6947 + (base − 128) × 0.98745</text><text textLength="281.26" x="2" y="328.01">Turned lines are read about the centre the path's arcs fit, 112.694,</text><text textLength="267.87" x="2" y="339.01">112.694, and about 112.69, 112.69, where the circles are drawn,</text><text textLength="262.23" x="2" y="350.01">along either turned axis; each label keeps the decimals every</text><text textLength="80.31" x="2" y="361.01">reading agrees on.</text><text textLength="292.16" x="2" y="372.01">83.1 and 120.6 are given to one decimal: the path reads them 83.062</text><text textLength="145.94" x="2" y="383.01">to 83.067 and 120.594 to 120.595.</text><text textLength="260.44" x="2" y="394.01">the base t-west-limb is built by lower-t/r2/src/west/build.mjs</text><text textLength="187.79" x="2" y="405.01">base x 90, 120, 136 read 75.17, 104.80, 120.6</text><text textLength="134.68" x="2" y="416.01">base y 98, 128 read 83.1, 112.69</text><text textLength="251.74" x="2" y="427.01">base r 74, 104, 117, 135 give r73.07, r102.69, r115.53, r133.31</text><text textLength="259.15" x="2" y="438.01">the generator makes the rim and the strokes one width, 30 ×</text><text textLength="276.99" x="2" y="449.01">0.98745 = 29.6235; the path's written radii read the rim as 29.62</text><text textLength="168.83" x="2" y="460.01">and its edges read the strokes as 29.63</text></g>
