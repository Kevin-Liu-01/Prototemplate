<g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="500" opacity="0.85"><text textLength="24.78" x="253.83" y="173.71">26.92</text><text textLength="22.97" x="23.77" y="241.02" text-anchor="end">26.91</text><text textLength="17.95" x="56.02" y="266.52" text-anchor="middle">14.4</text><text textLength="25.89" x="-8.72" y="160.86" text-anchor="end">r121.11</text><text textLength="32.59" x="-12.54" y="139.21" text-anchor="end">r104.96</text><text textLength="22.72" x="-12.54" y="117.23" text-anchor="end">r93.3</text><text textLength="28.31" x="-8.72" y="95.58" text-anchor="end">r66.39</text><text textLength="28.56" x="-13.77" y="67.95" text-anchor="middle">124.89</text><text textLength="19.42" x="-14.77" y="43.44" text-anchor="end">98.0</text><text textLength="23.25" x="136.49" y="-13.48" text-anchor="middle">80.01</text><text textLength="28.77" x="165.82" y="-13.48" text-anchor="middle">106.92</text><text textLength="26.41" x="180.58" y="-3.64">121.27</text><text textLength="20.20" x="104.34" y="-0.61" text-anchor="end">16.15</text><text textLength="21.28" x="67.49" y="7.28" text-anchor="end">11.66</text><text textLength="29.39" x="109.34" y="-24.19" text-anchor="end">23.44°</text><text textLength="19.31" x="206.83" y="232.54">190°</text><text textLength="265.93" x="2" y="279.06">sketch/src/halo/gen.mjs: t-west-limb with a halo 13 outside its</text><text textLength="270.80" x="2" y="290.06">rim r104, 18 wide, spanning 190° centred on the mark's east; all</text><text textLength="169.49" x="2" y="301.06">turned 23.44° clockwise about 128, 128</text><text textLength="260.80" x="2" y="312.06">then scaled by 0.89711 and centred on 114.0949, 124.8909 to</text><text textLength="266.82" x="2" y="323.06">sit 10 inside the box: each length is the base's times 0.89711; a</text><text textLength="263.18" x="2" y="334.06">turned-frame x is 114.0949 + (base x − 128) × 0.89711 and a y</text><text textLength="163.77" x="2" y="345.06">is 124.8909 + (base y − 128) × 0.89711</text><text textLength="243.80" x="2" y="356.06">Turned lines are read about the centre the path's arcs fit,</text><text textLength="260.91" x="2" y="367.06">114.092, 124.890, and about 114.09, 124.89, where the circles</text><text textLength="242.85" x="2" y="378.06">are drawn, along either turned axis; each label keeps the</text><text textLength="147.77" x="2" y="389.06">decimals every reading agrees on.</text><text textLength="256.79" x="2" y="400.06">98.0 and 14.4 are given to one decimal: the path reads them</text><text textLength="163.16" x="2" y="411.06">97.972 to 97.975 and 14.353 to 14.356.</text><text textLength="260.44" x="2" y="422.06">the base t-west-limb is built by lower-t/r2/src/west/build.mjs</text><text textLength="194.43" x="2" y="433.06">base x 90, 120, 136 read 80.01, 106.92, 121.27</text><text textLength="138.82" x="2" y="444.06">base y 98, 128 read 98.0, 124.89</text><text textLength="242.58" x="2" y="455.06">base r 74, 104, 117, 135 give r66.39, r93.3, r104.96, r121.11</text><text textLength="266.99" x="2" y="466.06">the generator makes the rim, the stroke 124.89 to 98.0 and the</text><text textLength="262.12" x="2" y="477.06">stroke 80.01 to 106.92 one width, 30 × 0.89711 = 26.9132; the</text><text textLength="269.69" x="2" y="488.06">path's written radii read the rim as 26.91 and its edges read the</text><text textLength="261.16" x="2" y="499.06">stroke 124.89 to 98.0 as 26.92 and the stroke 80.01 to 106.92</text><text textLength="35.31" x="2" y="510.06">as 26.91</text></g>
