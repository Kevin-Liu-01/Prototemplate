<g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="500" opacity="0.85"><text textLength="24.11" x="203.02" y="248.11">26.73</text><text textLength="17.47" x="227.17" y="212.06">14.3</text><text textLength="32.08" x="-26.74" y="127.78" text-anchor="end">r133.63</text><text textLength="30.42" x="-26.74" y="103.62" text-anchor="end">r106.91</text><text textLength="28.27" x="-22.54" y="79.82" text-anchor="end">r92.65</text><text textLength="28.28" x="-14.27" y="57.11" text-anchor="end">r65.93</text><text textLength="22.25" x="-27.38" y="19.5" text-anchor="end">78.51</text><text textLength="28.75" x="-31.63" y="-22.55" text-anchor="end">105.24</text><text textLength="26.73" x="-21.3" y="-32.38" text-anchor="end">119.50</text><text textLength="26.28" x="-27.36" y="258.78" text-anchor="end">112.37</text><text textLength="20.47" x="10.44" y="258.78" text-anchor="end">139.1</text><text textLength="24.16" x="188.48" y="-10.44" text-anchor="middle">26.72</text><text textLength="23.27" x="153.19" y="-22.16" text-anchor="middle">14.26</text><text textLength="15.42" x="51.28" y="-36.11" text-anchor="middle">45°</text><text textLength="19.31" x="247.46" y="167.17">190°</text><text textLength="278.89" x="2" y="271.32">sketch/src/halo/gen.mjs: t-west-jaw with a halo 16 outside its rim</text><text textLength="293.14" x="2" y="282.32">r104, 30 wide, spanning 190° centred on the mark's south; all turned</text><text textLength="140.63" x="2" y="293.32">45° anticlockwise about 128, 128</text><text textLength="287.63" x="2" y="304.32">then scaled by 0.89088 and centred on 112.3682, 112.3682 to sit 10</text><text textLength="247.03" x="2" y="315.32">inside the box: each length is the base's times 0.89088; a</text><text textLength="267.28" x="2" y="326.32">turned-frame coordinate is 112.3682 + (base − 128) × 0.89088</text><text textLength="279.64" x="2" y="337.32">Turned lines are read about the centre the path's arcs fit, 112.367,</text><text textLength="290.89" x="2" y="348.32">112.369, and about 112.37, 112.37, where the circles are drawn, along</text><text textLength="271.02" x="2" y="359.32">either turned axis; each label keeps the decimals every reading</text><text textLength="45.34" x="2" y="370.32">agrees on.</text><text textLength="293.89" x="2" y="381.32">139.1 and 14.3 are given to one decimal: the path reads them 139.095</text><text textLength="136.69" x="2" y="392.32">to 139.100 and 14.253 to 14.256.</text><text textLength="257.19" x="2" y="403.32">the base t-west-jaw is built by lower-t/r2/src/west/build.mjs</text><text textLength="193.44" x="2" y="414.32">base x 90, 120, 136 read 78.51, 105.24, 119.50</text><text textLength="140.17" x="2" y="425.32">base y 128, 158 read 112.37, 139.1</text><text textLength="255.96" x="2" y="436.32">base r 74, 104, 120, 150 give r65.93, r92.65, r106.91, r133.63</text><text textLength="290.13" x="2" y="447.32">the generator makes the rim, the halo and the strokes one width, 30</text><text textLength="281.66" x="2" y="458.32">× 0.89088 = 26.7264; the path's written radii read the rim and the</text><text textLength="227.67" x="2" y="469.32">halo as 26.72 and its edges read the strokes as 26.73</text><text textLength="287.60" x="2" y="480.32">the generator makes the halo's gap to the rim and the meridian gap</text><text textLength="286.75" x="2" y="491.32">one width, 16 × 0.89088 = 14.2541; the path's written radii read the</text><text textLength="294.00" x="2" y="502.32">halo's gap to the rim as 14.26 and its edges read the meridian gap as</text><text textLength="17.47" x="2" y="513.32">14.3</text></g>
