<g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="500" opacity="0.85"><text textLength="24.78" x="174.81" y="254.9" text-anchor="middle">26.92</text><text textLength="22.97" x="264.63" y="71.94">26.91</text><text textLength="17.95" x="190.41" y="240.97">14.4</text><text textLength="25.89" x="2.08" y="84.78" text-anchor="end">r121.11</text><text textLength="32.59" x="9.6" y="64.13" text-anchor="end">r104.96</text><text textLength="22.72" x="20.59" y="45.09" text-anchor="end">r93.3</text><text textLength="28.31" x="35.72" y="23.92" text-anchor="end">r66.39</text><text textLength="19.41" x="30.55" y="-18.77" text-anchor="middle">90.8</text><text textLength="19.17" x="57.5" y="-24.27" text-anchor="middle">117.7</text><text textLength="28.16" x="73.06" y="-23.61">132.07</text><text textLength="24.53" x="-3.97" y="172.86" text-anchor="end">114.10</text><text textLength="25.16" x="-3.97" y="202.19" text-anchor="end">141.01</text><text textLength="20.20" x="214.77" y="23.21">16.15</text><text textLength="21.28" x="195.64" y="8.61">11.66</text><text textLength="29.39" x="128.89" y="-33.69">23.44°</text><text textLength="19.31" x="123.61" y="252.86" text-anchor="middle">190°</text><text textLength="262.68" x="2" y="267.44">sketch/src/halo/gen.mjs: t-west-jaw with a halo 13 outside its</text><text textLength="264.55" x="2" y="278.44">rim r104, 18 wide, spanning 190° centred on the mark's south;</text><text textLength="197.35" x="2" y="289.44">all turned 23.44° anticlockwise about 128, 128</text><text textLength="260.80" x="2" y="300.44">then scaled by 0.89711 and centred on 124.8909, 114.0949 to</text><text textLength="266.82" x="2" y="311.44">sit 10 inside the box: each length is the base's times 0.89711; a</text><text textLength="264.63" x="2" y="322.44">turned-frame x is 124.8909 + (base x − 128) × 0.89711 and a y</text><text textLength="162.32" x="2" y="333.44">is 114.0949 + (base y − 128) × 0.89711</text><text textLength="243.80" x="2" y="344.44">Turned lines are read about the centre the path's arcs fit,</text><text textLength="260.54" x="2" y="355.44">124.892, 114.095, and about 124.89, 114.09, where the circles</text><text textLength="242.85" x="2" y="366.44">are drawn, along either turned axis; each label keeps the</text><text textLength="147.77" x="2" y="377.44">decimals every reading agrees on.</text><text textLength="256.63" x="2" y="388.44">90.8, 117.7 and 14.4 are given to one decimal: the path reads</text><text textLength="262.51" x="2" y="399.44">them 90.793 to 90.797, 117.711 to 117.716 and 14.352 to 14.355.</text><text textLength="257.19" x="2" y="410.44">the base t-west-jaw is built by lower-t/r2/src/west/build.mjs</text><text textLength="181.43" x="2" y="421.44">base x 90, 120, 136 read 90.8, 117.7, 132.07</text><text textLength="144.00" x="2" y="432.44">base y 128, 158 read 114.10, 141.01</text><text textLength="242.58" x="2" y="443.44">base r 74, 104, 117, 135 give r66.39, r93.3, r104.96, r121.11</text><text textLength="257.58" x="2" y="454.44">the generator makes the rim, the stroke 90.8 to 117.7 and the</text><text textLength="259.79" x="2" y="465.44">stroke 114.10 to 141.01 one width, 30 × 0.89711 = 26.9132; the</text><text textLength="269.69" x="2" y="476.44">path's written radii read the rim as 26.91 and its edges read the</text><text textLength="261.77" x="2" y="487.44">stroke 90.8 to 117.7 as 26.92 and the stroke 114.10 to 141.01 as</text><text textLength="22.97" x="2" y="498.44">26.91</text></g>
