">gap 11.16 = line 12.5 × 54 / 60.5, the GT monogram's ratio</text><text textLength="196.74" x="4" y="307.54">98.76 = 109.92 − 11.16, one gap west of stem 1</text><text textLength="170.80" x="4" y="318.54">72.48: one gap in from r67.84 at y 140.5</text><text textLength="179.96" x="4" y="329.54">globe r70.72 = 0.68 × 104, centre 182, 160</text><text textLength="235.35" x="4" y="340.54">land room (dashed): the disc r92.84 (r104 less one gap</text><text textLength="144.71" x="4" y="351.54">11.16) less the base grown by 11.16</text><text textLength="226.60" x="4" y="362.54">(land/src/double/cells.mjs roomFor, K.g in cues.mjs).</text><text textLength="229.48" x="4" y="373.54">The land is one gap clear of every line and of the limb</text><text textLength="226.54" x="4" y="384.54">except where it comes 11.13 to the corner 195.84, 128</text><text textLength="236.84" x="4" y="395.54">(0.03 inside one gap), which the scan allows: it keeps a</text><text textLength="231.82" x="4" y="406.54">place with at most 0.3 square units of land outside the</text><text textLength="163.07" x="4" y="417.54">room (land/src/double/cells.mjs scan)</text><text textLength="239.38" x="4" y="428.54">nearest approach of the land, measured from the paths:</text><text textLength="234.68" x="4" y="439.54">11.13 to the corner 195.84, 128, 11.75 to x 146.08, 12.7 to</text><text textLength="55.53" x="4" y="450.54">the limb r104</text><text textLength="224.29" x="4" y="461.54">placed by the generator's scan: scale 0.7, then 0.68;</text><text textLength="244.29" x="4" y="472.54">centres x 170 to 196 by 1, westmost first, and y 146 to 172</text><text textLength="226.60" x="4" y="483.54">by 2, northmost first; the first centre with at most 0.3</text><text textLength="227.46" x="4" y="494.54">square units of land outside the room is kept: none at</text><text textLength="220.57" x="4" y="505.54">0.7, 182, 160 at 0.68 (land/src/double/build.mjs cell,</text><text textLength="238.62" x="4" y="516.54">cells.mjs scan; re-running the scan gives the same land</text><text textLength="22.55" x="4" y="527.54">path)</text></g>
