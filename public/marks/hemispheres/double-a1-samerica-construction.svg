">gap 11.16 = line 12.5 × 54 / 60.5, the GT monogram's ratio</text><text textLength="196.74" x="4" y="307.54">98.76 = 109.92 − 11.16, one gap west of stem 1</text><text textLength="170.80" x="4" y="318.54">72.48: one gap in from r67.84 at y 140.5</text><text textLength="181.21" x="4" y="329.54">globe r68.64 = 0.66 × 104, centre 182, 166</text><text textLength="235.35" x="4" y="340.54">land room (dashed): the disc r92.84 (r104 less one gap</text><text textLength="243.26" x="4" y="351.54">11.16) less the base grown by 11.16, so the land is one gap</text><text textLength="143.15" x="4" y="362.54">clear of every line and of the limb</text><text textLength="223.87" x="4" y="373.54">(land/src/double/cells.mjs roomFor, K.g in cues.mjs)</text><text textLength="239.38" x="4" y="384.54">nearest approach of the land, measured from the paths:</text><text textLength="240.62" x="4" y="395.54">11.42 to x 146.08, 12.2 to the corner 195.84, 128, 13.89 to</text><text textLength="55.53" x="4" y="406.54">the limb r104</text><text textLength="231.01" x="4" y="417.54">placed by the generator's scan: scale 0.66, then 0.65;</text><text textLength="243.93" x="4" y="428.54">centres x 170 to 196 by 1, westmost first, and y 150 to 176</text><text textLength="226.60" x="4" y="439.54">by 2, northmost first; the first centre with at most 0.3</text><text textLength="240.95" x="4" y="450.54">square units of land outside the room is kept: 182, 166 at</text><text textLength="221.10" x="4" y="461.54">0.66 (land/src/double/build.mjs cell, cells.mjs scan;</text><text textLength="197.65" x="4" y="472.54">re-running the scan gives the same land path)</text></g>
