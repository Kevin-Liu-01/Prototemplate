<g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="500" opacity="0.85"><text textLength="24.11" x="-14.82" y="217.24" text-anchor="end">26.73</text><text textLength="17.47" x="19.56" y="241.72">14.3</text><text textLength="32.08" x="-25.16" y="91.62" text-anchor="end">r133.63</text><text textLength="30.42" x="-18.9" y="68.28" text-anchor="end">r106.91</text><text textLength="28.27" x="-8.69" y="46.38" text-anchor="end">r92.65</text><text textLength="28.28" x="6.17" y="22.25" text-anchor="end">r65.93</text><text textLength="21.64" x="-27.39" y="-28.39" text-anchor="end">112.4</text><text textLength="19.02" x="253.44" y="220.48" text-anchor="end">85.6</text><text textLength="24.06" x="208.24" y="-32.39">78.52</text><text textLength="23.00" x="246.04" y="-32.39">105.2</text><text textLength="26.74" x="256.36" y="-22.54">119.50</text><text textLength="24.16" x="101.96" y="-25.64" text-anchor="end">26.72</text><text textLength="23.27" x="65.7" y="-18.39" text-anchor="end">14.26</text><text textLength="15.42" x="173.45" y="-36.11" text-anchor="middle">45°</text><text textLength="19.31" x="247.46" y="167.17">190°</text><text textLength="282.15" x="2" y="261.99">sketch/src/halo/gen.mjs: t-west-limb with a halo 16 outside its rim</text><text textLength="287.35" x="2" y="272.99">r104, 30 wide, spanning 190° centred on the mark's east; all turned</text><text textLength="124.80" x="2" y="283.99">45° clockwise about 128, 128</text><text textLength="287.63" x="2" y="294.99">then scaled by 0.89088 and centred on 112.3682, 112.3682 to sit 10</text><text textLength="247.04" x="2" y="305.99">inside the box: each length is the base's times 0.89088; a</text><text textLength="267.29" x="2" y="316.99">turned-frame coordinate is 112.3682 + (base − 128) × 0.89088</text><text textLength="280.84" x="2" y="327.99">Turned lines are read about the centre the path's arcs fit, 112.365,</text><text textLength="293.79" x="2" y="338.99">112.364, and about 112.36, 112.36, where the circles are drawn, along</text><text textLength="271.02" x="2" y="349.99">either turned axis; each label keeps the decimals every reading</text><text textLength="45.35" x="2" y="360.99">agrees on.</text><text textLength="285.84" x="2" y="371.99">112.4, 85.6, 105.2 and 14.3 are given to one decimal: the path reads</text><text textLength="286.63" x="2" y="382.99">them 112.360 to 112.365, 85.634 to 85.640, 105.243 to 105.246 and</text><text textLength="72.78" x="2" y="393.99">14.253 to 14.255.</text><text textLength="260.45" x="2" y="404.99">the base t-west-limb is built by lower-t/r2/src/west/build.mjs</text><text textLength="189.80" x="2" y="415.99">base x 90, 120, 136 read 78.52, 105.2, 119.50</text><text textLength="131.43" x="2" y="426.99">base y 98, 128 read 85.6, 112.4</text><text textLength="255.96" x="2" y="437.99">base r 74, 104, 120, 150 give r65.93, r92.65, r106.91, r133.63</text><text textLength="290.13" x="2" y="448.99">the generator makes the rim, the halo and the strokes one width, 30</text><text textLength="281.67" x="2" y="459.99">× 0.89088 = 26.7264; the path's written radii read the rim and the</text><text textLength="227.68" x="2" y="470.99">halo as 26.72 and its edges read the strokes as 26.73</text><text textLength="287.60" x="2" y="481.99">the generator makes the halo's gap to the rim and the meridian gap</text><text textLength="286.76" x="2" y="492.99">one width, 16 × 0.89088 = 14.2541; the path's written radii read the</text><text textLength="294.01" x="2" y="503.99">halo's gap to the rim as 14.26 and its edges read the meridian gap as</text><text textLength="17.47" x="2" y="514.99">14.3</text></g>
