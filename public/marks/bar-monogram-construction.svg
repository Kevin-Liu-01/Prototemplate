<text textLength="8.72" x="92.66" y="34.03" text-anchor="middle">91.5</text><text textLength="10.59" x="182.66" y="34.03" text-anchor="middle">181.5</text><text textLength="11.34" x="217.66" y="34.03" text-anchor="middle">216.5</text><text textLength="11.90" x="275.66" y="34.03" text-anchor="middle">274.5</text><text textLength="12.48" x="309.66" y="34.03" text-anchor="middle">308.5</text><text textLength="12.36" x="387.66" y="34.03" text-anchor="middle">386.5</text><text textLength="6.70" x="362.07" y="173.85">12°</text><text textLength="128.05" x="-108.1" y="190.27">A slanted line is labelled with its x at y 40, the top of the ink.</text><text textLength="497.18" x="-108.1" y="195.77">Ten rectangles (MONOGRAM_RECTS in Prototemplate scripts/build/speed-marks.mjs) set upright and skewed by x − y tan 12° (SKEW) about y 0, so an edge's x at y 40 is its upright x minus 8.5: the G at 0, 30, 100 and 190, the bars at</text><text textLength="115.41" x="-108.1" y="201.27">−20, −50 and −80 and the T at 225, 283, 317 and 395.</text><text textLength="246.77" x="-108.1" y="206.77">CUT = [96, 104] takes y 96 to 104 out of every rectangle. The middle speed bar is 36 high, 82 to 118, before the cut.</text><text textLength="438.19" x="-108.1" y="212.27">Not in the outline: the speed bars run 2 into the G's stem, to x 2; the G's right stem (x 160 to 190, y 100 to 160) lies inside the G's chin (x 100 to 190, y 100 to 130) and the G's bottom (x 0 to 190, y 130 to 160).</text><text textLength="417.62" x="-108.1" y="217.77">These labels are the generator's values where the path, written to one decimal, reads otherwise (its reading in brackets): -58.5 (-58.49), -28.5 (-28.51), 91.5 (91.51), 216.5 (216.49), 386.5 (386.49).</text></g>
