xtLength="10.40" x="24" y="259.55" text-anchor="middle">48</text><text textLength="8.58" x="963.88" y="7.75">10</text><text textLength="10.32" x="987.24" y="42.75">80</text><text textLength="24.41" x="965.39" y="110.33">107.33</text><text textLength="25.28" x="965.39" y="125.66">122.67</text><text textLength="65.84" x="0" y="-16.4">MONO.x −105.08</text><text textLength="70.23" x="960" y="-16.4" text-anchor="end">MONO.right 386.5</text><text textLength="24.47" x="693.26" y="242.13">12.22°</text><text textLength="3.36" x="-1.8" y="270.21" text-anchor="end">1</text><text textLength="5.22" x="-1.8" y="302.56" text-anchor="end">0</text><text textLength="15.20" x="955.8" y="292.84">0.18</text><text textLength="25.79" x="314.82" y="265.87" text-anchor="middle">314.82</text><text textLength="13.52" x="318" y="307.34" text-anchor="middle">318</text><text textLength="602.87" x="1.8" y="318.61">text grid: 160 × 23 characters in cells of 6 × 10 (font size 10, rows 960 long), 1427 printed; screen 8 × 8 Bayer (Prototemplate scripts/build/speed-marks.mjs)</text><text textLength="953.50" x="1.8" y="328.49">Cells: the monogram's box (MONO, 491.58 by 120) in 160 columns of 3.072 at a character's aspect of 0.6, so round(120 / 5.121) = 23 rows of 5.217. Each cell is set 6 by 10, one @ per printed cell, each row forced to 960 by textLength, so a point (x, y)</text><text textLength="277.00" x="1.8" y="338.38">of the monogram lies at (6 (x + 105.08) / 3.072, 10 (y − 40) / 5.217) here.</text><text textLength="677.29" x="1.8" y="348.26">A cell prints when more than half of its 4 × 4 samples fall in the monogram and the density is above (B + 0.5) / 64, B being the 8 × 8 screen's entry at row mod 8, column mod 8.</text><text textLength="950.51" x="1.8" y="358.14">Drawn over the cells: the monogram the cells sample (MONOGRAM_RECTS under SKEW, less CUT = [96, 104]), its cut at y 96 to 104, which is 107.33 to 122.67 here, and its box from x −105.08 to 386.5, the grid's sides. A cell is 3.072 wide and 5.217</text><text textLength="430.89" x="1.8" y="368.02">high in the monogram and 6 by 10 here, so SKEW's 12° draws at atan(tan 12° × 6 × 5.217 / (10 × 3.072)) = 12.22°.</text><text textLength="774.12" x="1.8" y="377.91">Density, drawn under the grid at each column's left edge: 1 up to column 0.33 × 159 = 52.47 (x 314.82), so column 53 is the first below 1 (x 53 × 6 = 318); then a straight fall to 0.18 at column 159 (x 954).</text></g>
