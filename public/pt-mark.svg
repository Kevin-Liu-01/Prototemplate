<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .ink { stroke: #0f1113; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #ffffff; }
    }
  </style>
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse">
      <line class="ink" x1="0" y1="0" x2="0" y2="4" stroke-width="1.6" opacity="0.6" />
    </pattern>
  </defs>
  <rect x="9" y="9" width="14" height="14" fill="url(#hatch)" />
  <g class="ink" stroke-width="2">
    <line x1="0" y1="9" x2="32" y2="9" />
    <line x1="0" y1="23" x2="32" y2="23" />
    <line x1="9" y1="0" x2="9" y2="32" />
    <line x1="23" y1="0" x2="23" y2="32" />
  </g>
</svg>
