    <!-- mood babel -->
    <section class="slide mood s-mood s-mood-babel">
      <style>
        .s-mood .mood-img { position: absolute; inset: -57px; z-index: -1; width: 1600px; height: 900px; object-fit: cover; display: block; }
        /* solid paper chips under the viewer's wordmark (stage 72,864, 28 by 18) and counter (right 72, bottom 22), the same plate treatment the openers use; scoped to the stage so thumbnails, which carry no chrome, stay clean */
        #stage > .s-mood::after { content: ''; position: absolute; inset: -57px; z-index: -1; pointer-events: none; background: linear-gradient(var(--paper), var(--paper)) 66px 858px / 40px 30px no-repeat, linear-gradient(var(--paper), var(--paper)) 1474px 856px / 60px 28px no-repeat; }
        /* the plate names the picture, says why it is in the deck, and credits it; lower right, so it never meets the openers' lower-left plate as a pattern */
        .s-mood .mood-plate { position: absolute; right: 0; bottom: 0; width: fit-content; max-width: 560px; padding: 22px 26px 20px; background: var(--paper); color: var(--ink); }
        .s-mood .mood-plate .title { font-size: 44px; line-height: 1.08; color: var(--ink); }
        .s-mood .mood-plate p { margin-top: 12px; color: var(--ink); }
        .s-mood .mood-plate .credit { margin-top: 12px; font-size: 15px; line-height: 1.45; letter-spacing: 0.01em; color: var(--titanium); }
      </style>
      <img class="mood-img" src="shots/mood-babel-light.jpg" data-dark="shots/mood-babel.jpg" alt="The Tower of Babel by Pieter Bruegel the Elder, 1563, rendered as a two-tone dither">
      <div class="in">
        <div class="mood-plate">
          <div class="big title">The Tower of Babel</div>
          <p>Bruegel painted one project split across languages. That split is the cost General Translation removes.</p>
          <div class="credit">Painting: Pieter Bruegel the Elder, 1563, public domain</div>
        </div>
      </div>
    </section>
