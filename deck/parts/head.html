<title>GT Brand Deck</title>
<!--FONTS-->
<style>
  :root {
    --paper: #ffffff;
    --ink: #070707;
    --ink-2: #3a3d44;
    --titanium: #8a8f98;
    --hair: rgba(7, 7, 7, 0.18);
    --hair-soft: rgba(7, 7, 7, 0.09);
    --plate: rgba(7, 7, 7, 0.035);
    --cross: rgba(7, 7, 7, 0.38);
    --display: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    --switzer: 'Switzer', 'Helvetica Neue', Arial, sans-serif;
    --text: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --cjk: 'Hiragino Sans', 'Noto Sans CJK JP', 'Noto Sans JP', 'PingFang SC', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    --arabic: 'Noto Naskh Arabic', 'Geeza Pro', 'Noto Sans Arabic', sans-serif;
    --indic: 'Noto Sans Devanagari', 'Kohinoor Devanagari', 'Devanagari Sangam MN', sans-serif;
  }
    :root[data-theme="dark"] {
    --paper: #070707; --ink: #f2f2f0; --ink-2: #b9bcc3; --titanium: #8a8f98;
    --hair: rgba(242, 242, 240, 0.22); --hair-soft: rgba(242, 242, 240, 0.1); --plate: rgba(242, 242, 240, 0.05); --cross: rgba(255, 255, 255, 0.34);
  }

  * { box-sizing: border-box; }

  /* the stage: a fixed 1600 x 900 sheet, scaled to the window */

  /* edge grid: two rails and two rules that run to the edge of the sheet, crosses where they meet */
  .frame { position: absolute; inset: 0; pointer-events: none; }
  .frame::before, .frame::after { content: ''; position: absolute; top: 0; bottom: 0; width: 1px; background: var(--hair); }
  .frame::before { left: 56px; } .frame::after { right: 56px; }
  .frame .rule { position: absolute; left: 0; right: 0; height: 1px; background: var(--hair); }
  .frame .rule.top { top: 56px; } .frame .rule.bottom { bottom: 56px; }
  .frame .cross { position: absolute; width: 11px; height: 11px;
    background:
      linear-gradient(var(--cross), var(--cross)) 5px 0 / 1px 11px no-repeat,
      linear-gradient(var(--cross), var(--cross)) 0 5px / 11px 1px no-repeat; }
  .frame .cross.tl { left: 51px; top: 51px; } .frame .cross.tr { right: 51px; top: 51px; }
  .frame .cross.bl { left: 51px; bottom: 51px; } .frame .cross.br { right: 51px; bottom: 51px; }

  .counter { position: absolute; right: 72px; bottom: 22px; font-family: var(--display); font-size: 13px; letter-spacing: 0.02em; color: var(--titanium); font-variant-numeric: tabular-nums; }
  .wordmark { position: absolute; left: 72px; bottom: 18px; height: 18px; color: var(--titanium); }
  .wordmark svg { display: block; }

  .slide > .in { position: relative; width: 100%; height: 100%; }

  /* type: the display face is capped at weight 500, the way the shipped site caps it */
  h1, h2, .big { font-family: var(--display); margin: 0; letter-spacing: -0.025em; text-wrap: balance; font-weight: 500; font-feature-settings: 'cv11', 'ss01'; }
  h1 { font-size: 88px; line-height: 1.02; }
  h2 { font-size: 44px; line-height: 1.1; margin-bottom: 18px; }
  .big { font-size: 72px; line-height: 1.06; }
  p { margin: 0; font-size: 22px; line-height: 1.5; color: var(--ink); }
  p + p { margin-top: 18px; }
  .lead { font-size: 26px; line-height: 1.45; }
  .cap { font-size: 15px; line-height: 1.45; color: var(--titanium); }
  .muted { color: var(--ink-2); }
  .max { max-width: 32ch; }
  .max-p { max-width: 56ch; }

  /* layouts */
  .center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .left-mid { position: absolute; left: 0; top: 50%; transform: translateY(-50%); }
  .split { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-start; gap: 56px; }
  .split > .head { flex: 0 0 auto; }
  .split > .body { flex: 1 1 auto; display: grid; align-content: center; min-height: 0; }
  .split > .body.end { align-content: end; }
  .cols { position: absolute; inset: 0; display: grid; grid-template-columns: 5fr 7fr; gap: 72px; align-items: center; }
  .cols.even { grid-template-columns: 1fr 1fr; }
  .cols.wide-right { grid-template-columns: 4fr 8fr; }
  .stack { display: flex; flex-direction: column; gap: 22px; }

  .shot { display: block; width: 100%; height: auto; border: 1px solid var(--hair); background: var(--plate); }
  .shot.fit { width: auto; max-width: 100%; max-height: 100%; }
  .shot-wrap { position: relative; display: grid; place-items: center; height: 100%; min-height: 0; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
  .pair figure { margin: 0; display: grid; gap: 12px; }
  .pair img { width: 100%; height: auto; border: 1px solid var(--hair); }
  .pair figcaption { font-size: 16px; line-height: 1.45; color: var(--ink-2); }

  /* lists set as ruled rows, never bullets */
  .rows { display: flex; flex-direction: column; border-top: 1px solid var(--hair); --key: 240px; }
  .rows > div { display: grid; grid-template-columns: var(--key) 1fr; gap: 32px; padding: 16px 0; border-bottom: 1px solid var(--hair); font-size: 20px; line-height: 1.45; }
  .rows > div > b { font-family: var(--display); font-weight: 500; letter-spacing: -0.01em; }
  .rows.narrow { --key: 180px; }
  .rows.tight > div { padding: 14px 0; font-size: 20px; }
  .plain { display: flex; flex-direction: column; gap: 0; border-top: 1px solid var(--hair); font-size: 24px; line-height: 1.4; font-family: var(--display); font-weight: 500; letter-spacing: -0.01em; }
  .plain > span { display: block; padding: 12px 0; border-bottom: 1px solid var(--hair-soft); }
  .plain > span:last-child { border-bottom-color: var(--hair); }
  .plain .no { color: var(--ink-2); text-decoration: line-through; text-decoration-thickness: 1.5px; text-decoration-color: var(--titanium); }
  .refs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 48px; font-size: 20px; line-height: 1.4; color: var(--ink); }
  .refs span { border-bottom: 1px solid var(--hair-soft); padding: 6px 0; }

  /* scales */
  .scales { display: flex; flex-direction: column; gap: 26px; }
  .scale { display: grid; grid-template-columns: 150px 1fr 150px; align-items: center; gap: 22px; font-size: 18px; color: var(--ink-2); }
  .scale span:last-child { text-align: right; }
  .scale .bar { position: relative; height: 1px; background: var(--hair); }
  .scale .bar i { position: absolute; top: -5px; width: 11px; height: 11px; background: var(--ink); transform: translateX(-50%); }
  .scale b { color: var(--ink); font-weight: 500; font-family: var(--display); }

  /* specimen */
  .spec { display: flex; flex-direction: column; gap: 6px; }
  .spec .w { font-family: var(--switzer); font-size: 58px; line-height: 1.12; letter-spacing: -0.02em; display: grid; grid-template-columns: 90px 1fr; align-items: baseline; }
  .spec .w small { font-family: var(--text); font-size: 15px; color: var(--titanium); letter-spacing: 0; }
  .lang { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 64px; align-items: start; }
  .lang div { font-family: var(--display); font-size: 34px; line-height: 1.3; letter-spacing: -0.01em; border-bottom: 1px solid var(--hair-soft); padding: 8px 0; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: baseline; }
  .lang div small { font-family: var(--text); font-size: 14px; color: var(--titanium); }
  .lang .ja, .lang .zh, .lang .ko { font-family: var(--cjk); font-weight: 500; }
  .lang .ar { font-family: var(--arabic); }
  .lang .hi { font-family: var(--indic); }

  .ladder { display: flex; flex-direction: column; border-top: 1px solid var(--hair); }
  .ladder > div { display: grid; grid-template-columns: 1fr 200px; align-items: baseline; gap: 24px; padding: 10px 0; border-bottom: 1px solid var(--hair-soft); font-family: var(--display); letter-spacing: -0.015em; line-height: 1.1; white-space: nowrap; overflow: hidden; }
  .ladder > div > small { font-family: var(--text); font-size: 14px; color: var(--titanium); text-align: right; letter-spacing: 0; }

  /* swatches drawn as plates, the deck itself stays two-tone */
  .swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 24px; }
  .swatch { border: 1px solid var(--hair); height: 190px; padding: 18px; display: flex; flex-direction: column; justify-content: flex-start; gap: 4px; }
  .swatch b { font-family: var(--display); font-weight: 500; font-size: 20px; }
  .swatch span { font-size: 15px; color: var(--titanium); font-variant-numeric: tabular-nums; }
  .swatch.ink { background: #070707; color: #ffffff; } .swatch.ink span { color: rgba(255,255,255,0.6); }
  .swatch.raised { background: #101010; color: #ffffff; } .swatch.raised span { color: rgba(255,255,255,0.6); }
  .swatch.ti { background: #8a8f98; color: #070707; } .swatch.ti span { color: rgba(7,7,7,0.6); }
  .swatch.paper { background: #ffffff; color: #070707; } .swatch.paper span { color: rgba(7,7,7,0.55); }

  svg.dia { display: block; width: 100%; height: auto; overflow: visible; }
  svg.dia text { font-family: var(--text); font-size: 20px; fill: var(--ink-2); }
  svg.dia .ink { stroke: var(--ink); } svg.dia .mid { stroke: var(--ink-2); } svg.dia .hair { stroke: var(--hair); } svg.dia .paper { stroke: var(--paper); }
  svg.dia .lab { font-family: var(--display); font-size: 26px; fill: var(--ink); font-weight: 500; letter-spacing: -0.01em; }
  svg.dia .sm { font-size: 18px; }

  canvas.dither { display: block; width: 100%; height: 220px; image-rendering: pixelated; }

  .say { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; }
  .say > div { border-top: 1px solid var(--hair); padding-top: 18px; }
  .say .q { font-family: var(--display); font-size: 34px; line-height: 1.2; letter-spacing: -0.015em; font-weight: 500; }
  .say .q.no { color: var(--ink-2); text-decoration: line-through; text-decoration-thickness: 1.5px; text-decoration-color: var(--titanium); }
  .say small { display: block; margin-top: 14px; font-size: 15px; color: var(--titanium); }

  /* code sits on the dark panel in white monospace, the same as on the site */
  .panel { background: #101010; color: rgba(255, 255, 255, 0.87); padding: 22px 26px; font-family: var(--mono); font-size: 17px; line-height: 1.7; border: 0; }
  :root[data-theme="dark"] .panel { border: 1px solid var(--hair); }
  
  @media (prefers-reduced-motion: no-preference) { .slide.is-on { animation: cut 140ms ease-out; } }
  @keyframes cut { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- viewer chrome ---------- */
  :root { --edge: rgba(7, 7, 7, 0.62); --thumb: rgba(7, 7, 7, 0.32); --bar-h: 52px; --panel-w: 460px; }
    :root[data-theme="dark"] { --edge: rgba(242, 242, 240, 0.55); --thumb: rgba(242, 242, 240, 0.32); }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--text); font-optical-sizing: auto; overflow: hidden; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }

  /* scroll regions: the thin scrollbar the Prototemplate shell uses (src/components/viewer/tokens.css .pt-scroll, directive 8.11):
     a 4px gutter with no track rule, a 2px thumb centered in it (a 1px transparent border each side clipped out of the
     thumb's ground, so it never touches the seam beside the gutter) that widens to 4px only while the pointer is on the
     thumb itself, no buttons, radius 0, scrollbar-width: thin in Firefox */
  .scroll { overflow-y: scroll; overflow-x: hidden; scrollbar-gutter: stable; scrollbar-width: auto; scrollbar-color: auto; }
  .scroll::-webkit-scrollbar { width: 4px; height: 4px; }
  .scroll::-webkit-scrollbar-track { background: transparent; border: 0; }
  .scroll::-webkit-scrollbar-thumb { background: var(--thumb); background-clip: padding-box; border: 0; border-left: 1px solid transparent; border-right: 1px solid transparent; border-radius: 0; }
  .scroll::-webkit-scrollbar-thumb:hover { background-color: var(--ink-2); border-width: 0; }
  .scroll::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
  @supports not selector(::-webkit-scrollbar) { .scroll { scrollbar-width: thin; scrollbar-color: var(--thumb) transparent; } }

  /* links inside slides stay in the ink, underlined with a hairline */
  .slide a { color: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-decoration-color: var(--hair); text-underline-offset: 5px; }
  .slide a:hover { text-decoration-color: var(--ink); }
  .rows.links span { color: var(--ink-2); }

  .viewer { position: fixed; inset: 0; display: grid; grid-template-columns: 208px minmax(0, 1fr); grid-template-rows: 100%; background: var(--paper); }
  .viewer.no-sb, .viewer.is-overview { grid-template-columns: 0 minmax(0, 1fr); }
  .viewer.no-sb .sb, .viewer.is-overview .sb { display: none; }

  /* sidebar: the slide list */
  .sb { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--hair); background: var(--paper); }
  .sb-head { height: var(--bar-h); flex: 0 0 var(--bar-h); display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--hair); }
  .sb-head svg { width: 22px; height: 14px; color: var(--ink); flex: 0 0 auto; }
  .sb-head b { font-family: var(--display); font-weight: 500; font-size: 13.5px; letter-spacing: -0.01em; white-space: nowrap; }
  .sb-head span { margin-left: auto; font-size: 12px; color: var(--titanium); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .thumbs { flex: 1 1 auto; padding: 6px 8px 28px 8px; display: flex; flex-direction: column; gap: 10px; }
  .sec-label { font-family: var(--display); font-weight: 500; font-size: 12px; letter-spacing: -0.005em; color: var(--titanium); padding: 14px 0 0 26px; }
  .sec-label:first-child { padding-top: 8px; }
  .thumb { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 6px; align-items: start; cursor: pointer; }
  .thumb .n { font-family: var(--display); font-weight: 500; font-size: 12px; color: var(--titanium); padding-top: 3px; font-variant-numeric: tabular-nums; text-align: right; }
  .thumb.is-active .n { color: var(--ink); }
  .thumb-frame { position: relative; width: 100%; aspect-ratio: 16 / 9; border: 1px solid var(--edge); overflow: hidden; background: var(--paper); }
  .thumb:hover .thumb-frame { border-color: var(--ink); }
  .thumb.is-active .thumb-frame { border-color: var(--ink); outline: 1px solid var(--ink); outline-offset: 2px; }
  .thumb-frame .mini { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; transform: scale(var(--k, 0.14)); pointer-events: none; }
  .thumb-frame .mini .slide { display: block; }
  .thumb-title { font-size: 12px; line-height: 1.35; color: var(--ink-2); margin-top: 6px; }
  .thumb.is-active .thumb-title { color: var(--ink); }

  /* main column: toolbar, stage, progress */
  .main { grid-column: 2; grid-row: 1; position: relative; display: grid; grid-template-rows: var(--bar-h) minmax(0, 1fr) 2px; min-width: 0; min-height: 0; background: var(--paper); }
  .toolbar { grid-row: 1; height: var(--bar-h); display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 0 12px 0 10px; border-bottom: 1px solid var(--hair); min-width: 0; }
  .bar-l, .bar-r { display: flex; align-items: center; gap: 4px; }
  .toolbar .count { font-size: 13px; color: var(--titanium); font-variant-numeric: tabular-nums; padding: 0 4px; white-space: nowrap; }
  .toolbar .count b { color: var(--ink); font-weight: 500; font-family: var(--display); font-size: 14px; }
  .toolbar .sep { width: 1px; height: 22px; background: var(--hair); margin: 0 8px; }
  .bar-brand { display: none; align-items: center; gap: 10px; padding: 0 6px; }
  .bar-brand svg { width: 25px; height: 16px; color: var(--ink); }
  .bar-brand b { font-family: var(--display); font-weight: 500; font-size: 14.5px; letter-spacing: -0.01em; white-space: nowrap; }
  .viewer.no-sb .bar-brand, .viewer.is-overview .bar-brand { display: inline-flex; }
  .ib { appearance: none; background: none; border: 1px solid transparent; color: var(--ink-2); font: 13px/1 var(--text); height: 32px; padding: 0 10px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; border-radius: 0; }
  .ib svg { width: 16px; height: 16px; fill: currentColor; flex: 0 0 auto; }
  .ib .theme-glyph { display: inline-block; width: 16px; font-size: 16px; line-height: 16px; text-align: center; font-weight: 400; } /* the theme's text glyph, ◐ in light and ◑ in dark, as the Prototemplate shell draws it (directive 8.4) */
  .ib:hover { color: var(--ink); border-color: var(--hair); }
  .ib:focus-visible { outline: 1px solid var(--ink); outline-offset: -1px; }
  .ib.is-on { color: var(--ink); border-color: var(--ink); }
  .ib.icon { width: 32px; padding: 0; justify-content: center; font-family: var(--display); font-weight: 500; font-size: 14px; }
  .seg { display: inline-flex; border: 1px solid var(--hair); height: 32px; }
  .seg .ib { height: 30px; border: 0; border-right: 1px solid var(--hair); padding: 0 12px; }
  .seg .ib:last-child { border-right: 0; }
  .seg .ib:hover { background: var(--plate); }
  .seg .ib.is-on { background: var(--ink); color: var(--paper); }
  .stagewrap { grid-row: 2; position: relative; overflow: hidden; min-height: 0; background: var(--plate); }
  .sheet { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; box-sizing: content-box; background: var(--paper); border: 1px solid var(--edge); box-shadow: 0 0 0 1px var(--paper), 0 0 0 2px var(--hair-soft); overflow: hidden; z-index: 1; }
  .stage { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; }
  .slide { position: absolute; inset: 57px; padding: 72px 80px; display: none; }
  .slide.is-on { display: block; }
  .progress { grid-row: 3; position: relative; background: var(--hair-soft); }
  .progress i { position: absolute; left: 0; top: 0; height: 100%; width: 0; background: var(--ink); transition: width 160ms ease-out; }

  /* grid: every slide at once */
  .grid { position: absolute; inset: 0; background: var(--paper); z-index: 2; }
  .grid .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 26px 26px; align-content: start; padding: 22px 34px 56px; overflow: visible; }
  .grid .sec-label { grid-column: 1 / -1; padding: 16px 0 0; margin-top: 10px; border-top: 1px solid var(--hair); font-size: 13.5px; color: var(--ink); }
  .grid .sec-label:first-child { border-top: 0; margin-top: 0; padding-top: 4px; }
  .grid .thumb { grid-template-columns: 26px minmax(0, 1fr); }

  /* book: the deck read top to bottom */
  .book { position: absolute; inset: 0; background: var(--paper); z-index: 2; }
  .book-in { --k: 0.6; max-width: 1280px; margin: 0 auto; padding: 44px 56px 120px; display: flex; flex-direction: column; gap: 36px; }
  .book-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 32px; align-items: end; padding-bottom: 26px; border-bottom: 1px solid var(--hair); } /* a structural rule, never ink (line law for chrome) */
  .book-head h1 { font-size: 44px; line-height: 1.04; }
  .book-head p { font-size: 15.5px; line-height: 1.5; color: var(--ink-2); max-width: 62ch; margin-top: 14px; }
  .book-head .meta { font-size: 13px; color: var(--titanium); text-align: right; line-height: 1.5; white-space: nowrap; }
  .book-toc { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 28px; }
  .book-toc a { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--hair-soft); color: inherit; text-decoration: none; font-family: var(--display); font-weight: 500; font-size: 14px; letter-spacing: -0.01em; }
  .book-toc a span { min-width: 0; line-height: 1.3; }
  .book-toc a:hover span { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
  .book-toc small { font-family: var(--text); font-size: 12px; color: var(--titanium); font-variant-numeric: tabular-nums; }
  .book-sec { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 28px; align-items: end; padding-top: 30px; border-top: 1px solid var(--hair); margin-top: 12px; }
  .book-sec small { font-size: 12.5px; line-height: 1.5; color: var(--titanium); font-variant-numeric: tabular-nums; }
  .book-sec h2 { font-size: 32px; line-height: 1.05; margin: 0; }
  .page { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 28px; align-items: start; scroll-margin-top: 20px; }
  .page .pn { padding-top: 2px; font-size: 12.5px; line-height: 1.45; color: var(--titanium); }
  .page .pn b { display: block; font-family: var(--display); font-weight: 500; font-size: 24px; letter-spacing: -0.02em; line-height: 1; color: var(--ink); margin-bottom: 8px; font-variant-numeric: tabular-nums; }
  .page .pn span { display: block; }
  .page.is-active .pn { color: var(--ink-2); }
  .page-frame { position: relative; width: 100%; aspect-ratio: 16 / 9; border: 1px solid var(--edge); background: var(--paper); overflow: hidden; cursor: pointer; }
  .page:hover .page-frame { border-color: var(--ink); }
  .page.is-active .page-frame { border-color: var(--ink); outline: 1px solid var(--ink); outline-offset: 2px; }
  .page-frame .mini { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; transform: scale(var(--k)); }
  .page-frame .mini .slide { display: block; }

  /* surfaces: every public place the brand is live */
  .panel-r { position: absolute; top: var(--bar-h); right: 0; bottom: 0; /* runs over the progress track so a row rule at its foot never sits 1px above the 2px line */ width: var(--panel-w); max-width: 100%; background: var(--paper); border-left: 1px solid var(--hair); z-index: 4; display: flex; flex-direction: column; transform: translateX(100%); visibility: hidden; transition: transform 180ms ease-out, visibility 180ms; }
  .panel-r.is-on { transform: none; visibility: visible; }
  .panel-head { height: var(--bar-h); flex: 0 0 var(--bar-h); display: flex; align-items: center; gap: 10px; padding: 0 10px 0 18px; border-bottom: 1px solid var(--hair); }
  .panel-head b { font-family: var(--display); font-weight: 500; font-size: 14.5px; letter-spacing: -0.01em; }

  .panel-tools input:focus { border-color: var(--ink); }

  .surf-group { padding-top: 18px; }

  .surf { display: grid; grid-template-columns: 96px minmax(0, 1fr) 16px; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--hair-soft); color: inherit; text-decoration: none; }

  .surf-name { display: block; font-family: var(--display); font-weight: 500; font-size: 14px; letter-spacing: -0.01em; }
  .surf-url { display: block; font-size: 12px; color: var(--titanium); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .surf-desc { display: block; font-size: 12.5px; line-height: 1.4; color: var(--ink-2); margin-top: 4px; }

  .help-card p { font-size: 12.5px; line-height: 1.5; color: var(--titanium); margin: 14px 0 0; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--paper); font-size: 12.5px; padding: 7px 12px; opacity: 0; transition: opacity 160ms; pointer-events: none; z-index: 21; }
